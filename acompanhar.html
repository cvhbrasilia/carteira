  if (window.CVH_CTN) { var c = q.get('c') || ''; try { if (c) localStorage.setItem('cvh_ct', c); else c = localStorage.getItem('cvh_ct') || ''; } catch (e) {} window.BOOT = { modo: c ? 'carteirinha' : 'nenhum', token: '', ct: c }; }

  function chaveArq() { try { return localStorage.getItem('cvh_fs') || ''; } catch (e) { return ''; } }

  var VERSAO = '20261128210948';

  function recarregar(v) { try { var u = new URL(location.href); u.searchParams.set('atualizado', v); location.replace(u.toString()); } catch (e) { location.reload(); } }

      // o Cartão doador só mostra o cartão: troca de versão sozinho, sem pedir toque

  function limparIcone() { if (document.hidden) return; try { if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (e) {} try { navigator.serviceWorker && navigator.serviceWorker.getRegistration().then(function (r) { if (r && r.getNotifications) r.getNotifications().then(function (L) { L.forEach(function (n) { n.close(); }); }); }); } catch (e) {} }

// Painel CVH · campo de digitação sempre visível acima do teclado do celular (vale para todas as telas e módulos).
// O iPhone não rola a tela quando o campo está no fim da página ou dentro de um módulo: aqui o sistema abre espaço
// embaixo e sobe o campo para o meio da parte visível, e repete enquanto o teclado abre ou muda de tamanho.

// Painel CVH · colar uma foto copiada (print, WhatsApp, Fotos) em qualquer campo de foto das telas e módulos.
// Ao tocar num botão de foto, abre uma folha com "Colar a foto copiada" e "Tirar ou escolher foto";
// a foto colada entra no mesmo campo, como se tivesse sido escolhida, sem nenhuma alteração.
(function () {

    '.cvh-colar .p{background:#5F130F;color:#fff}.cvh-colar .s{background:#fff;color:#5F130F;border:1px solid #E2D6C8}.cvh-colar .c{background:none;color:#6b5a52;font-weight:400}' +

    } catch (e) { st.textContent = 'Não consegui colar. Permita colar quando o celular perguntar, ou use Tirar ou escolher foto.'; }
  }
  function abrir(inp) {
    alvo = inp; fechar();

    var pdf = /pdf/i.test(inp.accept || '');

      (podeLer ? '<button class="p" data-c="colar">Colar a foto copiada</button>' : '') +

// Puxar para baixo no alto da tela atualiza o app (busca a versão nova e recarrega), como nos apps do celular.
(function () {

  }

  }

    if (!ok) { esconder(); return; }

    // guarda onde a pessoa estava, para voltar à mesma tela depois de recarregar
    try { var st = window.__estadoApp && window.__estadoApp(); if (st) { st.t = Date.now(); sessionStorage.setItem('cvh_volta', JSON.stringify(st)); } } catch (_) {}

    setTimeout(fim, 2500);
  }, { passive: true });
})();

<title>Acompanhar pedido · CVH</title>
<style>
:root{--vinho:#5F130F;--verm:#A83D3D;--areia:#EEE5DB;--areia2:#E2D6C8;--caramelo:#C49A6C;--papel:#FBF8F4;--tinta:#2b2320;--tinta2:#6b5a52;--ok:#2F6B45}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px}
h1{margin:0;font-size:22px;color:var(--vinho)}
.sub{color:var(--tinta2);font-size:13.5px;margin:2px 0 14px}
.cx{background:#fff;border:1px solid var(--areia2);border-radius:18px;padding:16px;margin:12px 0}
.pac{font-size:18px;font-weight:700;color:var(--vinho)}.pac small{display:block;font-size:14px;color:var(--tinta2);font-weight:600;margin-top:2px}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{position:relative;padding:0 0 18px 34px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:10px;top:22px;bottom:-2px;width:2px;background:var(--areia2)}
.tl li:last-child::before{display:none}
.tl i{position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;border:2px solid var(--areia2);background:#fff}
.tl li.feito i{background:var(--verm-bt,#A83D3D);border-color:var(--verm-bt,#A83D3D)}
.tl li.feito i::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tl li.feito::before{background:var(--verm-bt,#A83D3D)}
.tl li.atual i{border-color:var(--caramelo);box-shadow:0 0 0 4px #F3E6D6}
.tl li.cancel i{background:var(--verm);border-color:var(--verm)}
.tl b{display:block;font-size:15.5px}.tl li:not(.feito):not(.atual):not(.cancel) b{color:#9a8b82;font-weight:600}
.tl small{color:var(--tinta2);font-size:13px}
.rod{color:var(--tinta2);font-size:12.5px;text-align:center;margin-top:18px}
.erro{color:var(--verm);font-weight:700}
</style><style id="paleta-cvh">
/* paleta inteira do manual (26/11/2026): o vinho fica no botão principal; secundários em areia, destaques em caramelo, títulos em vinho com traço caramelo */
.btn.sec,.btn.sec2{background:#EEE5DB;color:#5F130F;border-color:#C6B098}
.btn.cara{background:#C49A6C;color:#3D0C09}
.cx>h2:first-child,.cx>h3:first-child,.cartao>h3{color:#5F130F;border-left:3px solid #C49A6C;padding-left:8px;line-height:1.15}
.mini{background:#EEE5DB;border-color:#C6B098}
.filtro.on{background:#C49A6C;color:#3D0C09;border-color:#C49A6C}
.mod{border-top:4px solid var(--mc,#C6B098);box-shadow:none}
.mods .mod:nth-child(4n+1){--mc:#C49A6C}.mods .mod:nth-child(4n+2){--mc:#C6B098}.mods .mod:nth-child(4n+3){--mc:#A83D3D}.mods .mod:nth-child(4n+4){--mc:#5F130F}
.mod i{background:#EEE5DB;border:1px solid #E3D5C5}
.mod-n{background:#EEE5DB;color:#9B7A55}
.filtros button.on,.ag-abas button.on,.mini.on{background:#C49A6C;color:#3D0C09;border-color:#C49A6C}
</style>
</head><body>
<div class="wrap" id="app"><p>Abrindo o pedido…</p></div>
<script>
// acompanhamento do pedido para a clínica: só a linha do tempo deste atendimento, sem login
const $ = (q) => document.querySelector(q), esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const p2 = (n) => String(n).padStart(2, "0");
const hora = (iso) => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + " às " + p2(d.getHours()) + ":" + p2(d.getMinutes()); };
const T = new URLSearchParams(location.search).get("p") || "";
const srv = (fn, ...a) => window.CVH_SERVIDOR.chamar(fn, a);
async function abrir() {
  let r; try { r = await srv("acompDados", T); } catch (e) { $("#app").innerHTML = '<h1>Pedido CVH</h1><div class="cx"><p class="erro">' + esc(e.message || e) + "</p></div>"; return; }
  const P = r.passos || [], ult = P.reduce((i, x, k) => (x.em || x.pulado ? k : i), -1), fim = ["concluido", "entregue", "cancelado"].includes(r.etapa);
  const li = (x, k) => { const cls = x.k === "cancelado" ? "cancel" : x.em || x.pulado ? "feito" : !fim && k === ult + 1 ? "atual" : "";
    return '<li class="' + cls + '"><i></i><b>' + esc(x.t) + "</b><small>" + (x.em ? esc(hora(x.em)) : x.pulado ? "" : cls === "atual" ? (x.prev ? "previsão " + esc(hora(x.prev)) : "próxima etapa") : "") + "</small></li>"; };
  $("#app").innerHTML = '<h1>Acompanhar pedido</h1><div class="sub">CVH - Centro Veterinário de Hemoterapia · pedido ' + esc(r.id) + "</div>" +
    '<div class="cx"><div class="pac">' + esc(r.paciente || "Paciente") + "<small>" + esc(r.oque || "") + (r.destino ? " · " + esc(r.destino) : "") + "</small></div></div>" +
    '<div class="cx"><ul class="tl">' + P.map(li).join("") + "</ul></div>" +
    '<p class="rod">' + (fim ? "Pedido encerrado." : "Esta página se atualiza sozinha.") + " Dúvidas, fale com o CVH.</p>";
  if (!fim) setTimeout(abrir, 60000);
}
abrir();
</script></body></html>
