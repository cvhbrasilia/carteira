<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carteira CVH</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carteira CVH">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E7BCC4">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="manifest" href="carteira.webmanifest">
<style>html,body{margin:0;height:100%;background:#E7BCC4}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}</style>
<script src="config.js"></script>
</head>
<body>
<iframe id="app" title="Carteira de Saúde CVH" allow="clipboard-write"></iframe>
<script>
  var q = new URLSearchParams(location.search), r = q.get('r');
  try { if (r) localStorage.setItem('cvh_r', r); else r = localStorage.getItem('cvh_r'); } catch (e) {}
  document.getElementById('app').src = window.APP_URL + (r ? '?r=' + encodeURIComponent(r) : '');
</script>
</body>
</html>
