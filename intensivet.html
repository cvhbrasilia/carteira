<style>

<script>
"use strict";

/* ── aparelho: o link do CVH (?k=…) ativa este celular; depois o endereço fica limpo ── */
let K = "";

/* ── sons (Web Audio): aviso suave e alarme insistente; o primeiro toque na tela libera o som ── */
let AUD = null;

  const ov = document.createElement("div"); ov.id = "alarme"; ov.innerHTML = "<div><b>ATENÇÃO</b><h2>" + esc(titulo) + "</h2><p>" + esc(corpo) + '</p><button class="btn" id="alOk">Estou resolvendo</button></div>'; document.body.appendChild(ov);
  const ciclo = () => { for (let i = 0; i < 4; i++) { tom(853, i * 0.5, 0.24, 0.35, "square"); tom(960, i * 0.5 + 0.25, 0.24, 0.35, "square"); } if (navigator.vibrate) navigator.vibrate([600, 200, 600, 200, 600]); };

const SILENCIO = {};

/* ── notificações com o app fechado (caixa a caminho, alertas) ── */

const notifOk = () => { try { return "Notification" in window && Notification.permission === "granted"; } catch (e) { return false; } };
try { if (navigator.serviceWorker) { navigator.serviceWorker.register("sw.js").catch(() => {}); navigator.serviceWorker.addEventListener("message", () => carregar(true)); } } catch (e) {}

/* ── leitor de QR: BarcodeDetector quando o celular tem; senão jsQR; sempre dá para digitar ── */

        }

// código de barras (Code 128) pela câmera quando o celular não tem leitor próprio (iPhone): ZXing na faixa do meio da imagem
let ZXP = null;

  ZXP = new Promise((ok, erro) => { const tenta = (src, depois) => { const sc = document.createElement("script"); sc.src = src; sc.onload = () => window.ZXing ? ok(window.ZXing) : depois(); sc.onerror = depois; document.head.appendChild(sc); }; let local = "bibliotecas/zxing.min.js"; try { if (window.parent !== window) local = new URL(local, window.parent.location.href).href; } catch (e) {} tenta(local, () => tenta("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js", () => { ZXP = null; erro(new Error("zxing")); })); });

function leitorBarras(Z) {

  if (!o.bolsas.length && !o.testes.length) return toast("Escolha o que precisa, bolsa ou teste.", 5000);
  if (!o.urgencia) return toast("Escolha o tipo do pedido.", 5000);
  if (o.urgencia === "reserva" && !o.reservaPara) return toast("Informe a data e a hora do procedimento.", 5000);
  if (!o.paciente.nome || !o.paciente.peso) return toast("Informe o nome e o peso do paciente.", 5000);
  if (!o.vet.nome || !o.vet.crmv) return toast("Informe o médico veterinário e o CRMV.", 5000);
  if (!o.responsavel.contato) return toast("Escolha a orientação de contato com o responsável.", 5000);
  if (ASS.tracos < 8 && !ASS.anexo) return toast("Assine a requisição no quadro ou anexe a requisição em PDF.", 6000);
  if (ASS.tracos >= 8) o.assinatura = $("#sAss").toDataURL("image/png").split(",")[1]; if (ASS.anexo) o.anexo = ASS.anexo;
  b.disabled = true; b.textContent = "Enviando…";
  try { await srv("intSolicitar", o); try { const V = vets().filter((v) => v.nome.toLowerCase() !== o.vet.nome.toLowerCase()); V.unshift({ nome: o.vet.nome, crmv: o.vet.crmv }); localStorage.setItem("cvh_int_vets", JSON.stringify(V.slice(0, 12))); } catch (e) {}
    fechar(); toast("Pedido enviado ao CVH. Acompanhe aqui em Pedidos ao CVH.", 6000); await carregar(); }
  catch (e) { b.disabled = false; b.textContent = "Enviar pedido ao CVH"; toast(e.message || String(e), 7000); }
}
function formTransfusao(uid) {
  const V = vets();
  modal("<h2>Transfundido · " + esc(uid) + '</h2><label>Nome do animal que recebeu a bolsa</label><input type="text" id="tAn"><label>Peso (kg)</label><input type="number" inputmode="decimal" id="tPeso"><label>Hematócrito do paciente (%)</label><input type="number" inputmode="decimal" id="tHt"><label>Telefone ou WhatsApp do responsável</label><input type="tel" id="tTel">' +
    (V.length ? '<label>Médico veterinário</label><div class="bts" style="margin-top:0">' + V.map((v, i) => '<button class="btn sec peq" data-a="vetUsar" data-v="' + i + '">' + esc(v.nome) + "</button>").join("") + "</div>" : "") +
    '<label>Nome do médico veterinário</label><input type="text" id="tVet"><label>CRMV/UF</label><input type="text" id="tCrmv" placeholder="CRMV-DF 0000">' +
    '<label>Contato com o responsável</label><label class="op"><input type="radio" name="tCont" value="ciente"> O responsável já está ciente da transfusão. O CVH pode entrar em contato.</label><label class="op"><input type="radio" name="tCont" value="aguardar"> Favor aguardar para entrar em contato. O responsável ainda não foi avisado.</label>' +
    '<div class="bts"><button class="btn" data-a="transfOk" data-v="' + esc(uid) + '">TRANSFUNDIDO</button><button class="btn sec" data-a="fechar">Voltar</button></div>');
}
async function transfOk(uid, b) {
  const c = document.querySelector('input[name="tCont"]:checked');
  const o = { animal: $("#tAn").value.trim(), peso: $("#tPeso").value.trim(), ht: $("#tHt").value.trim(), telefone: $("#tTel").value.trim(), vet: $("#tVet").value.trim(), crmv: $("#tCrmv").value.trim(), contato: c ? c.value : "" };
  if (["animal", "peso", "ht", "telefone", "vet", "crmv"].some((k) => !o[k])) return toast("Preencha todos os dados do paciente e do médico veterinário.", 6000);
  if (!o.contato) return toast("Escolha a orientação de contato com o responsável.", 6000);
  // confirmação física: depois de TRANSFUNDIDO, a etiqueta da bolsa usada precisa ser lida; sem a leitura, nada é registrado
  const t = await lerQR("Leia a etiqueta da bolsa transfundida (" + uid + ")");
  if (!t) return toast("Transfusão não registrada: a etiqueta não foi lida.", 6000);
  if (norm(t) !== uid.toUpperCase()) { bip(false); return toast("Esta etiqueta é de outra bolsa (" + norm(t) + "). Transfusão não registrada.", 8000); }
  o.etiqueta = norm(t);
  b.disabled = true;
  try {
    await srv("intTransfundir", uid, o); somOk();
    try { const V = vets().filter((v) => v.nome.toLowerCase() !== o.vet.toLowerCase()); V.unshift({ nome: o.vet, crmv: o.crmv }); localStorage.setItem("cvh_int_vets", JSON.stringify(V.slice(0, 12))); } catch (e) {}
    fechar(); toast("Transfusão registrada. Obrigado.", 5000); await carregar();
  } catch (e) { toast(e.message, 7000); } finally { b.disabled = false; }
}
function cancelarUso(uid) {
  const u = uniDe(uid), feita = u && u.situacao === "utilizada";
  modal("<h2>Cancelar e devolver ao estoque</h2><p>" + esc(uid) + "</p>" + (feita ? '<label class="op"><input type="checkbox" id="cSem"> Confirmo que a bolsa não foi usada e que as condições de retorno estão atendidas (Transfundido tocado por engano).</label>' : "<p>Use só se a transfusão não começou e a bolsa está íntegra.</p>") + '<p><small>Depois de cancelar, leia o QR do equipamento e tire a foto da bolsa guardada.</small></p><div class="bts"><button class="btn perigo" data-a="cancelarOk" data-v="' + esc(uid) + '">Cancelar e devolver</button><button class="btn sec" data-a="fechar">Voltar</button></div>');
}
function devolver(uid) {
  const u = uniDe(uid);
  modal("<h2>Devolver ao CVH</h2>" + '<div class="bolsa">' + linhaBolsa(u) + '</div><p>Use quando o CVH pedir a bolsa de volta ou quando ela não for mais ficar aqui.</p><label>Seu primeiro nome</label><input type="text" id="mNome" value="' + esc(nomeSalvo()) + '"><div class="bts"><button class="btn" data-a="devOk" data-v="' + esc(uid) + '">Confirmar a saída da bolsa</button><button class="btn sec" data-a="fechar">Voltar</button></div>');
}
async function lerEtiquetaGeral() { const t = await lerQR("Leia a etiqueta da bolsa"); if (t) tratarBolsa(norm(t)); }
function tratarBolsa(id) {
  const u = (D.unidades || []).find((x) => x.id.toUpperCase() === id);
  if (u && pendenteGuarda(u)) { if (u.componente === "CH") { modal("<h2>CH · " + esc(u.id) + "</h2><p><b>Retire a bolsa de CH do ziplock. No refrigerador, deixe o plástico aberto por baixo e a bolsa de CH por cima, fora dele.</b></p>" + ORIENTA_CH + '<div class="bts"><button class="btn" data-a="lerEquip" data-v="' + esc(u.id) + '">Ler o QR do refrigerador</button><button class="btn sec" data-a="fechar">Voltar</button></div>'); return; } return lerEquip(u.id); }
  if (u && D.aparelho.setor === "internacao" && ["disponivel", "reservada"].includes(u.situacao) && u.local === D.aparelho.local) return confirmarRetirada(u.id);
  if (u && u.local === D.aparelho.local) { modal('<div class="bolsa">' + linhaBolsa(u) + "</div><p>" + esc(u.equipamento || "") + '</p><div class="bts"><button class="btn sec" data-a="devolver" data-v="' + esc(u.id) + '">Devolver ao CVH</button><button class="btn sec" data-a="ocorrencia" data-v="' + esc(u.id) + '">Informar ocorrência</button><button class="btn sec" data-a="fechar">Fechar</button></div>'); return; }
  bip(false); toast("Bolsa não encontrada no estoque daqui.", 6000);
}

document.addEventListener("click", async (ev) => {
  if (ev.target.id === "veu") return fechar();
  const b = ev.target.closest("[data-a]"); if (!b) return; const a = b.dataset.a, v = b.dataset.v;
  try {
    if (a === "fechar") { PROX = null; return fechar(); }
    if (a === "solicitar") return formSolicitar();
    if (a === "solicitarOk") return solicitarOk(b);
    if (a === "assLimpar") { const cv = $("#sAss"); cv.getContext("2d").clearRect(0, 0, cv.width, cv.height); ASS.tracos = 0; return; }
    if (a === "sAnexar") return $("#sArq").click();
    if (a === "atualizar") { await carregar(); return toast("Atualizado.", 1500); }
    if (a === "notif") { await ativarNotif(); toast("Notificações ativadas.", 4000); return pintar(); }
    if (a === "receber") return receber();
    if (a === "nomeOk") return nomeOk(b);
    if (a === "guardar") return guardar(v);
    if (a === "lerEquip") return lerEquip(v);
    if (a === "lerEtiqueta") return lerEtiquetaGeral();
    if (a === "pedirFoto") return pedirFotoGuarda(v);
    if (a === "fotoGuarda") return fotoGuarda(v);
    if (a === "ocorrencia") return ocorrencia(v);
    if (a === "ocOk") { const tx = $("#ocTxt").value.trim(); if (!tx) return toast("Descreva a ocorrência."); const n = $("#mNome").value.trim(); if (n) salvarNome(n); b.disabled = true; await srv("intOcorrencia", v, tx, n); fechar(); somOk(); return toast("Ocorrência enviada ao CVH.", 5000); }
    if (a === "retirar") return confirmarRetirada(v);
    if (a === "retirarQR") return retirarQR();
    if (a === "retirarOk") { b.disabled = true; await srv("intRetirar", v); somOk(); fechar(); await carregar(); return formTransfusao(v); }
    if (a === "transfundir") return formTransfusao(v);
    if (a === "vetUsar") { const x = vets()[+v]; if (x) { $("#tVet").value = x.nome; $("#tCrmv").value = x.crmv; } return; }
    if (a === "transfOk") return transfOk(v, b);
    if (a === "cancelar") return cancelarUso(v);
    if (a === "cancelarOk") { const c = $("#cSem"); if (c && !c.checked) return toast("Marque a confirmação."); b.disabled = true; await srv("intCancelarRetirada", v, { semUso: !!c }); fechar(); await carregar(); toast("Retirada cancelada. Agora leia o QR do equipamento.", 6000); return lerEquip(v); }
    if (a === "devolver") return devolver(v);
    if (a === "devOk") { const n = $("#mNome").value.trim(); if (!n) return toast("Informe seu primeiro nome."); salvarNome(n); b.disabled = true; await srv("intDevolver", v, n); fechar(); toast("Devolução registrada. Mande a bolsa ao CVH em caixa térmica.", 7000); return carregar(); }
  } catch (e) { toast(e.message || String(e), 7000); b.disabled = false; }
});
// leitor de código de barras ligado ao celular (Bluetooth): digita o código e um Enter em poucos milissegundos
const LEIT = { buf: "", t0: 0, ult: 0 };
document.addEventListener("keydown", (e) => {
  const t = performance.now();
  if (e.key === "Enter") { const c = LEIT.buf; LEIT.buf = ""; if (c.length >= 4 && t - LEIT.t0 < 40 * c.length + 120) { e.preventDefault(); const el = document.activeElement; if (el && /INPUT|TEXTAREA/.test(el.tagName)) el.value = el.value.slice(0, Math.max(0, el.value.length - c.length)); lidoLeitor(c); } return; }
  if (e.key.length !== 1) return; if (t - LEIT.ult > 60) { LEIT.buf = ""; LEIT.t0 = t; } LEIT.ult = t; LEIT.buf += e.key;
}, true);
function lidoLeitor(c) {
  if (CAM_FIM) return CAM_FIM(c);
  if (!D || $("#modal").classList.contains("on")) return;
  const C = norm(c), r = (D.remessas || []).find((x) => x.id === C), u = (D.unidades || []).find((x) => x.id.toUpperCase() === C);
  if (r && !r.recebida_em) { bip(); return receberCaixa(r.id); }
  if (u) return tratarBolsa(u.id.toUpperCase());
  bip(false); toast("Código não reconhecido aqui: " + c, 5000);
}
