<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Cartão de vacina CVH</title><style>
:root{--vinho:#5F130F;--verm:#A83D3D;--areia:#EEE5DB;--areia2:#E2D6C8;--papel:#FBF8F4;--bege:#C6B098;--dour:#C49A6C;--tinta:#2b2320;--tinta2:#6b5a52}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:22px;max-width:1280px;margin:0 auto;padding:16px 16px 60px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:14px;padding:12px 12px 80px}}
.lista{max-width:760px;margin:0 auto;padding:16px 16px 70px}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 6px}.cab h1{margin:0;font-size:24px;color:var(--vinho)}.sob{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta2);font-weight:700}
.lista h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--verm);margin:22px 0 8px}
.dia{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--areia2);border-radius:14px;padding:11px 12px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
.dia:hover{border-color:var(--bege)}
.obs-tc{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--vinho)}.obs-tc input{width:100%;margin-top:4px}
.dia.tc{margin:-4px 0 12px 28px;width:calc(100% - 28px);padding:8px 12px;background:#FBF8F4}.dia.tc .dt small{font-weight:800;color:var(--vinho);font-size:11px}
.dt{flex:0 0 58px;text-align:center;border-right:1px solid var(--areia);padding-right:10px}.dt b{display:block;font-size:18px;color:var(--vinho)}.dt small{color:var(--tinta2);font-size:12px}
.dd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.dd small{color:var(--tinta2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd .ok{font-size:12.5px;color:#2F7D4F;font-weight:700}.dd .pend{font-size:12.5px;color:#8a5a20;font-weight:700}.dd .novo{font-size:12.5px;color:var(--verm);font-weight:700}
.vai{font-size:24px;color:var(--bege)}
.vazio-p{color:var(--tinta2);font-size:14px}
.cx{background:#fff;border-radius:14px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:0 1px 6px rgba(95,19,15,.08)}
.cx h3{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--vinho)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px}
.larga{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--tinta2)}
input,select,textarea{font:inherit;font-size:15px;color:var(--tinta);border:1px solid var(--areia2);border-radius:10px;padding:9px 10px;background:#fff;width:100%;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(95,19,15,.25);border-color:var(--vinho)}
.btn{border:0;background:var(--vinho);color:#fff;font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:12px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:#fff;color:var(--vinho);border:1px solid var(--areia2)}
.btn.mini{font-size:13px;padding:7px 10px;border-radius:9px}
.lnk{border:0;background:none;color:var(--verm);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.nota{font-size:13px;color:var(--tinta2);margin:4px 0}
.topo-ed{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.an{border:1.5px solid var(--areia2);border-radius:12px;padding:9px 10px;margin-bottom:9px;background:#FFFDFB}.an.novo{border-color:var(--verm)}
.an-top{display:flex;align-items:center;gap:10px}.an-top .n{flex:0 0 30px;height:30px;border-radius:50%;border:1.5px solid var(--vinho);color:var(--vinho);display:flex;align-items:center;justify-content:center;font-size:15px}
.an-nm{flex:1;min-width:0}.an-nm b{display:block;color:var(--vinho)}.an-nm small{display:block;color:var(--tinta2);font-size:12.5px}
.mini-c{flex:0 0 78px}.mini-c input{padding:6px 8px;font-size:14px}
.an-bt{display:flex;gap:4px}.an-bt button{border:1px solid var(--areia2);background:#fff;color:var(--vinho);border-radius:8px;width:30px;height:30px;font:inherit;cursor:pointer}.an-bt button:disabled{opacity:.35}
.an details{margin-top:6px}.an summary{cursor:pointer;color:var(--verm);font-size:13px}.an details .grade{margin-top:8px}
.add{display:flex;gap:8px;margin-top:8px}
.an-nm b i{font-style:normal;color:var(--verm)}
.cmp{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--tinta2)}
.opc{display:flex;gap:6px;flex-wrap:wrap}.opc button{flex:1;min-width:64px;border:1px solid var(--areia2);background:#fff;color:var(--vinho);border-radius:10px;padding:9px 10px;font:inherit;font-size:14.5px;cursor:pointer}
.cito{margin-top:10px;border-top:1px dashed var(--areia2);padding-top:10px}.cito .ct{display:block;color:var(--vinho);font-size:15px;margin-bottom:6px}.cito .obr{font-style:normal;font-size:12px;color:#A83D3D;font-weight:700}
.opc button[aria-pressed=true]{background:var(--vinho);color:#fff;border-color:var(--vinho);font-weight:700}.add input{flex:1}
.rap{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
details.gr{border-top:1px solid var(--areia);padding:6px 0}details.gr summary{cursor:pointer;font-weight:700;color:var(--vinho);font-size:14px;padding:4px 0}details.gr summary small{color:var(--verm)}
.exs{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:4px 0 6px}@media (max-width:520px){.exs{grid-template-columns:1fr}}
label.ex{flex-direction:row;align-items:flex-start;gap:8px;font-size:14px;font-weight:400;color:var(--tinta);padding:5px 0;cursor:pointer}label.ex input{width:18px;height:18px;flex:0 0 18px;margin:1px 0 0;accent-color:var(--vinho)}
input.loc{grid-column:1/-1;font-size:14px;padding:6px 8px;margin-bottom:4px}
.acoes-fim{display:flex;flex-direction:column;gap:8px}
.st{font-size:13.5px;color:var(--tinta2);min-height:18px;margin:0}.st.erro{color:var(--verm);font-weight:700}
.lado{position:sticky;top:0;align-self:start;padding-top:8px;background:var(--papel);z-index:2}
@media (max-width:900px){.lado{position:static}}
.barra-prev{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
#modo-prev{display:flex;gap:4px;margin-left:auto}
#modo-prev button{border:1px solid var(--areia2);background:#fff;color:var(--vinho);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
#modo-prev button[aria-pressed=true]{background:var(--vinho);color:#fff;border-color:var(--vinho)}
#previa{display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 80px);overflow:auto;padding:2px}
@media (max-width:900px){#previa{max-height:none}}
.folha-wrap{background:#fff;box-shadow:0 1px 2px rgba(95,19,15,.18),0 6px 18px rgba(95,19,15,.08)}
svg.folha{display:block;width:100%;height:auto;font-family:"Receita CVH",sans-serif}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px);background:var(--vinho);color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9;width:max-content;max-width:min(94vw,620px);line-height:1.35;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.22)}#toast.on{opacity:1;transform:translateX(-50%)}

.busca{width:100%;padding:12px 14px;border:1px solid var(--areia2);border-radius:12px;font:inherit;margin:8px 0 14px;background:#fff}
.fl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--areia)}.fl small{color:var(--tinta2)}
.qt{display:flex;align-items:center;gap:10px}.qt button{width:34px;height:34px;border-radius:50%;border:1px solid var(--areia2);background:#fff;color:var(--vinho);font:inherit;font-size:19px;cursor:pointer}.qt b{min-width:18px;text-align:center}
.ck{display:flex;gap:8px;align-items:center;margin:12px 0 4px;font-size:14px}
.dd{flex:1;min-width:0;display:flex;flex-direction:column}.dd small{color:var(--tinta2);font-size:12.5px}
</style><style id="paleta-cvh">
/* paleta inteira do manual (26/11/2026): o vinho fica no botão principal; secundários em areia, destaques em caramelo, títulos em vinho com traço caramelo */
.btn.sec,.btn.sec2{background:#EEE5DB;color:#5F130F;border-color:#C6B098}
.btn.cara{background:#C49A6C;color:#3D0C09}
.cx>h2:first-child,.cx>h3:first-child,.cartao>h3{color:#5F130F;border-left:3px solid #C49A6C;padding-left:8px;line-height:1.15}
.mini{background:#EEE5DB;border-color:#C6B098}
.filtro.on{background:#C49A6C;color:#3D0C09;border-color:#C49A6C}
.mod{border-top:4px solid var(--mc,#C6B098);box-shadow:none}
.mods .mod:nth-child(4n+1){--mc:#C49A6C}.mods .mod:nth-child(4n+2){--mc:#C6B098}.mods .mod:nth-child(4n+3){--mc:#A83D3D}.mods .mod:nth-child(4n+4){--mc:#5F130F}
.mod i{background:#EEE5DB;border:1px solid #E3D5C5}
.mod-n{background:#EEE5DB;color:#9B7A55}
.filtros button.on,.ag-abas button.on,.mini.on{background:#C49A6C;color:#3D0C09;border-color:#C49A6C}
</style>
</head>

// Escolhe o desenho pela largura livre: cada um entra inteiro e na proporção dele, e a altura fica o mais perto possível do alvo.
// Entre desenhos de altura parecida, o título decide qual entra, para as seções não ficarem todas iguais.
function tuboEscolha(W, alvo, semente) {
  const c = TUBOS.map((t, i) => ({ i, t, H: W * t.h / 1000 })).map(o => (o.n = Math.abs(Math.log(o.H / alvo)), o)).sort((a, b) => a.n - b.n);
  const ok = c.filter(o => o.n <= c[0].n + 0.08);
  let s = 0; for (const ch of String(semente || '')) s = (s * 31 + ch.charCodeAt(0)) % 9973;
  return ok[s % ok.length];
}
// yMin: limite de cima (cabeçalho ou linha); se o desenho passaria dele, o título desce (dy)
function tuboTitulo(tx, y, xFim, tam, yMin) {
  const W = xFim - tx; if (W < 40) return { el: [], h: 0, dy: 0 };
  const o = tuboEscolha(W, tam * 1.6, "receita"), k = W / 1000, y0 = o.t.p[0][1] * k;
  const dy = Math.max(0, (yMin || 0) - (y + tam * 0.5 - y0)), topo = y + dy + tam * 0.5 - y0;
  return { el: [E.cam(o.t.p.map(p => [tx + p[0] * k, topo + p[1] * k]), { s: "#A73E3E", lw: Math.max(1.1, tam * 0.062) })], h: tam * 0.5 + o.H - y0, dy };
}
// páginas A4 de um documento (a receita é digital: uma via só, o responsável fica com o PDF)
function rubricaEls(d, x, y, w, h, cor) {
  if (!d) return [];
  // só o pedaço desenhado da rubrica, centralizado no espaço (o quadro de 300 × 120 tem sobra e deixava a rubrica torta)
  const nn = String(d).match(/-?\d+(\.\d+)?/g) || []; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i + 1 < nn.length; i += 2) { const a = +nn[i], b = +nn[i + 1]; if (a < x0) x0 = a; if (a > x1) x1 = a; if (b < y0) y0 = b; if (b > y1) y1 = b; }
  if (x0 > x1) { x0 = 0; y0 = 0; x1 = 300; y1 = 120; }
  const k0 = Math.min(w / 300, h / 120), bw = Math.max(1, x1 - x0), bh = Math.max(1, y1 - y0), k = Math.min(w / bw, h / bh), ox = x + (w - bw * k) / 2 - x0 * k, oy = y + (h - bh * k) / 2 - y0 * k, P = (a, b) => [ox + a * k, oy + b * k];
  const out = [], re = /([MLQ])([^MLQ]*)/g; let m, cur = null, ult = null;
  while ((m = re.exec(d))) {
    const n = m[2].trim().split(/[\s,]+/).map(Number).filter((v) => isFinite(v));
    if (m[1] === "M" && n.length >= 2) { if (cur && cur.length > 1) out.push(cur); ult = [n[0], n[1]]; cur = [P(n[0], n[1])]; for (let i = 2; i + 1 < n.length; i += 2) { ult = [n[i], n[i + 1]]; cur.push(P(n[i], n[i + 1])); } }
    else if (m[1] === "L" && cur) for (let i = 0; i + 1 < n.length; i += 2) { ult = [n[i], n[i + 1]]; cur.push(P(n[i], n[i + 1])); }
    else if (m[1] === "Q" && cur && ult) for (let i = 0; i + 3 < n.length; i += 4) { const [x0, y0] = ult; for (let t = 0.25; t <= 1.001; t += 0.25) { const u = 1 - t; cur.push(P(u * u * x0 + 2 * u * t * n[i] + t * t * n[i + 2], u * u * y0 + 2 * u * t * n[i + 1] + t * t * n[i + 3])); } ult = [n[i + 2], n[i + 3]]; }

  return out.map((pts) => E.cam(pts, { s: cor || "#1A2A9C", lw: Math.max(0.45, 1.5 * Math.max(k0, k * 0.45)) }));
}

// ---------- base ----------
const CTX = window.CVH_CTX || {};
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const p2 = (n) => String(n).padStart(2, "0");
const hojeISO = () => { const d = new Date(); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
const br = (iso) => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(iso || ""); return m ? m[3] + "/" + m[2] + "/" + m[1] : ""; };
const DIAS = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const diaSem = (iso) => DIAS[new Date(iso + "T12:00").getDay()];
const ponte = (metodo, ...args) => {
  let f = null; try { f = window.parent.CVH_PONTE; } catch (e) { f = null; }
  if (typeof f !== "function") return Promise.reject(new Error("Abra as requisições pelo Painel CVH."));
  return new Promise((ok, erro) => { try { Promise.resolve(f(metodo, JSON.parse(JSON.stringify(args)))).then((r) => ok(r == null ? r : JSON.parse(JSON.stringify(r))), (e) => erro(new Error((e && e.message) || String(e)))); } catch (e) { erro(e); } });
};
const req = (fn, ...a) => ponte("req", fn, ...a);
const marcarSujo = (v) => { ponte("sujo", v).catch(() => {}); };
const b64De = (u8) => { let t = ""; for (let i = 0; i < u8.length; i += 0x8000) t += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(t); };
function toast(m, ms) { let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); } t.textContent = m; t.className = "on"; clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ""; }, ms || 3000); }

(function fontes() {
  try {
    const css = [["r", 400, "normal"], ["b", 700, "normal"], ["i", 400, "italic"]].map(([k, w, s]) => `@font-face{font-family:"Receita CVH";font-weight:${w};font-style:${s};src:url(data:font/ttf;base64,${FONTES[k].ttf}) format("truetype")}`).join("");
    const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
  } catch (e) {}
})();

const ANIMAIS = CTX.animais || [], VETS = CTX.vets || [];
const animalDe = (id) => ANIMAIS.find((a) => a.id === id);
const vetPadrao = () => VETS.find((v) => v.padrao === "1") || VETS[0] || {};
const ehGato = (e) => /fel|gat/i.test(e || "");
function tipagemTxt(a) {
  const t = String(a.tipoSanguineo || "");

  const dea = /dea\s*1\s*pos/i.test(t) ? "DEA 1 Positivo" : /dea\s*1\s*neg/i.test(t) ? "DEA 1 Negativo" : "";

}
function idadeHoje(n) {
  const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(n || ""); if (!m) return "";
  const h = hojeISO(); let meses = (+h.slice(0, 4) - +m[1]) * 12 + (+h.slice(5, 7) - +m[2]); if (+h.slice(8, 10) < +m[3]) meses--;
  if (meses < 12) return meses <= 1 ? (meses === 1 ? "1 mês" : "menos de 1 mês") : meses + " meses";

// as folhas do cartão físico (A4, frente e verso com a mesma página)
const FOLHAS = [

  { k: "vermifugo", t: "Controle de vermifugação", linhas: 7 },

// ---------- desenho das folhas (conteúdo dentro da área do papel timbrado) ----------
const X0 = PG.X, W0 = PG.CW, LIN = "#B39B7F", ROT = "#8A6640";
function dataEmBranco(x, y, tam, grande) {

  const el = [], w1 = grande ? 19 : 14, w3 = grande ? 30 : 24, g = grande ? 9 : 7; let xx = x;
  [w1, w1, w3].forEach((w, i) => { el.push(E.lin(xx, y, xx + w, y, { s: LIN, lw: 0.8 })); xx += w; if (i < 2) { el.push(T(xx + 1.5, y - 1.5, "/", tam || 9, { c: LIN })); xx += g; } });

function rotulo(x, y, t, o) { return T(x, y, t.toUpperCase(), 6.6, Object.assign({ b: true, c: ROT }, o || {})); }
function cabecalho(a, y) {

  if (tip) el.push(T(X0 + W0 - 14, y + 27, tip, 10, { b: true, c: COR.VERMELHO, a: "e" }));
  const col = (x, yy, r, val, w) => { let t = String(val || "-"); while (t.length > 2 && largura(t, 9.5) > w) t = t.slice(0, -2) + "…"; return [rotulo(x, yy, r), T(x, yy + 12, t, 9.5, { c: COR.TEXTO })]; };
  const c1 = X0 + 14, cw = (W0 - 28) / 4;

  [["Espécie", a.especie], ["Raça", a.raca], ["Sexo", a.sexo], ["Nascimento", a.nascimento ? br(a.nascimento) + (idadeHoje(a.nascimento) ? " (" + idadeHoje(a.nascimento) + ")" : "") : ""]]
    .forEach(([r, val], i) => el.push(...col(c1 + i * cw, y + 54, r, val, cw - 8)));

}
function tituloFolha(f, y) {

function linhasFolha(f, y) {
  const el = [], yF = PG.YMAX, n = f.linhas;
  if (f.k === "obs") {
    // observações: data à esquerda e linhas para escrever
    const lh = 24, nL = Math.floor((yF - y) / lh);
    for (let i = 0; i < nL; i++) { const yy = y + (i + 1) * lh; el.push(E.lin(X0, yy, X0 + W0, yy, { s: i % 5 === 4 ? "#B39B7F" : "#CDBBA5", lw: 0.7 })); }

  for (let i = 0; i < n; i++) {

    el.push(E.lin(X0 + 6, yy + h, X0 + W0 - 6, yy + h, { s: "#D3C2AE", lw: 0.7 }));

      el.push(rotulo(cx, yy + 13, "Vacinado em")); el.push(...data(cx, yy + 31));

      el.push(rotulo(cx, yy + h / 2 + 10, verm ? "Reforço em" : "Próximo em")); el.push(...data(cx, yy + h / 2 + 28));

function paginaFolha(a, f) {

// cada folha pedida sai na quantidade escolhida; frente e verso repete a mesma página no verso
function paginas(a, pedido, fv) {

  return P;
}

// ---------- telas ----------
const estado = { aid: CTX.animalId || "", pedido: { vacina: 1, vermifugo: 1, ecto: 1, obs: 1 }, fv: false, modo: "imp", busca: "" };

function telaAnimal() {

async function jpegReduzido(f) {

function renderPrevia() {

async function baixar(digital) {

}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v;
  if (a === "animal") { estado.aid = v; return telaAnimal(); }

});
window.CVH_VOLTAR = () => { if (estado.aid) { telaLista(); return true; } return false; };

<script>
// Painel CVH · campo de digitação sempre visível acima do teclado do celular (vale para todas as telas e módulos).
// O iPhone não rola a tela quando o campo está no fim da página ou dentro de um módulo: aqui o sistema abre espaço
// embaixo e sobe o campo para o meio da parte visível, e repete enquanto o teclado abre ou muda de tamanho.
(function () {
  if (window.__cvhTeclado) return; window.__cvhTeclado = 1;
  var topo = window; try { if (window.top && window.top.document) topo = window.top; } catch (e) { topo = window; }
  var vv = topo.visualViewport; if (!vv) return;
  var ESPACO = 'cvh-kb-espaco', foco = null, tSai = null, tRola = null;
  function campo(el) { return el && (/^(TEXTAREA|SELECT)$/.test(el.tagName) || (el.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|reset|file|range|color|hidden)$/i.test(el.type || ''))) || (el && el.isContentEditable); }
  function rolador(el) {
    for (var p = el.parentElement; p && p !== document.body && p !== document.documentElement; p = p.parentElement) {
      // painéis que rolam de verdade (tela, folha, gaveta); tabelas com rolagem lateral ficam de fora

    var esp = r.querySelector(':scope > .' + ESPACO);
    if (!esp) { esp = document.createElement('div'); esp.className = ESPACO; esp.setAttribute('aria-hidden', 'true'); esp.style.cssText = 'display:block;width:1px;pointer-events:none;flex:none'; (r === document.scrollingElement || r === document.documentElement ? document.body : r).appendChild(esp); }
    esp.style.height = Math.round(h) + 'px';
  }
  function fecharEspaco() { var L = document.querySelectorAll('.' + ESPACO); for (var i = 0; i < L.length; i++) L[i].remove(); }
  function ajustar() {
    if (!foco || !document.contains(foco)) return;
    var kb = alturaTeclado(); if (kb < 80) return; // sem teclado aberto (computador ou teclado externo)
    var r = rolador(foco); abrirEspaco(r, kb + 40);
    var b = foco.getBoundingClientRect(), off = deslocamento();
    var visTopo = vv.offsetTop + 8, visFim = vv.offsetTop + vv.height - 12;
    var cTopo = off + b.top, cFim = off + Math.min(b.bottom, b.top + 140);
    // campo escondido pelo teclado ou acima da área visível: leva o campo para perto do meio da parte visível
    if (cFim > visFim || cTopo < visTopo) {
      var alvo = visTopo + (visFim - visTopo) * 0.38, delta = cTopo - alvo;

    }
  }
  function agendar() { clearTimeout(tRola); ajustar(); tRola = setTimeout(ajustar, 120); setTimeout(ajustar, 320); setTimeout(ajustar, 650); }
  document.addEventListener('focusin', function (e) { if (!campo(e.target)) return; clearTimeout(tSai); foco = e.target; agendar(); }, true);
  document.addEventListener('focusout', function () { tSai = setTimeout(function () { if (!campo(document.activeElement)) { foco = null; fecharEspaco(); } }, 250); }, true);
  // ao digitar (texto que quebra linha, sugestões que aparecem) o campo continua visível
  document.addEventListener('input', function (e) { if (foco && e.target === foco) { clearTimeout(tRola); tRola = setTimeout(ajustar, 60); } }, true);
  vv.addEventListener('resize', function () { if (foco) agendar(); });
  vv.addEventListener('scroll', function () { if (foco) { clearTimeout(tRola); tRola = setTimeout(ajustar, 80); } });
})();

// Painel CVH · colar uma foto copiada (print, WhatsApp, Fotos) em qualquer campo de foto das telas e módulos.
// Ao tocar num botão de foto, abre uma folha com "Colar a foto copiada" e "Tirar ou escolher foto";
// a foto colada entra no mesmo campo, como se tivesse sido escolhida, sem nenhuma alteração.
(function () {
  if (window.__cvhColar) return; window.__cvhColar = 1;
  var podeLer = !!(navigator.clipboard && navigator.clipboard.read) && typeof DataTransfer === 'function';
  var deFoto = function (el) { return el && el.tagName === 'INPUT' && el.type === 'file' && /image/i.test(el.accept || '') && !el.hasAttribute('capture'); };
  var css = '.cvh-colar{position:fixed;inset:0;background:rgba(43,35,32,.5);z-index:2147483000;display:flex;align-items:flex-end;justify-content:center;font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}' +
    '.cvh-colar .cx{background:#FBF8F4;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.2)}' +
    '@media (min-width:700px){.cvh-colar{align-items:center}.cvh-colar .cx{border-radius:18px}}' +
    '.cvh-colar h3{margin:0 0 10px;color:#5F130F;font-size:17px}.cvh-colar button{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin:0 0 8px;font:inherit;font-weight:700;cursor:pointer}' +
    '.cvh-colar .p{background:#5F130F;color:#fff}.cvh-colar .s{background:#fff;color:#5F130F;border:1px solid #E2D6C8}.cvh-colar .c{background:none;color:#6b5a52;font-weight:400}' +
    '.cvh-colar .st{font-size:13.5px;color:#A83D3D;min-height:18px;margin:2px 0 6px}';
  var folha = null;
  function fechar() { if (folha) { folha.remove(); folha = null; document.removeEventListener('paste', aoColar, true); } }
  function entregar(inp, arqs) {
    var dt = new DataTransfer(); arqs.forEach(function (f) { dt.items.add(f); });
    inp.files = dt.files; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
  }
  var alvo = null;
  function nomeArq(tipo) { var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); }; return 'Foto colada ' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + 'h' + p(d.getMinutes()) + '.' + (/png/.test(tipo) ? 'png' : /webp/.test(tipo) ? 'webp' : 'jpg'); }
  // Ctrl/Cmd+V com a folha aberta (computador)
  function aoColar(ev) {
    if (!alvo) return; var it = ev.clipboardData && ev.clipboardData.items ? [].slice.call(ev.clipboardData.items) : [], img = it.filter(function (i) { return i.kind === 'file' && /^image\//.test(i.type); })[0];
    if (!img) return; ev.preventDefault(); var b = img.getAsFile(), inp = alvo; fechar(); entregar(inp, [new File([b], nomeArq(b.type), { type: b.type })]);
  }
  async function colar(inp, st) {
    try {
      var itens = await navigator.clipboard.read();
      for (var i = 0; i < itens.length; i++) { var t = itens[i].types.filter(function (x) { return /^image\//.test(x); })[0]; if (t) { var b = await itens[i].getType(t); fechar(); entregar(inp, [new File([b], nomeArq(t), { type: t })]); return; } }
      st.textContent = 'Não há foto copiada. Copie a foto (no WhatsApp, em Fotos ou num print) e toque em Colar de novo.';
    } catch (e) { st.textContent = 'Não consegui colar. Permita colar quando o celular perguntar, ou use Tirar ou escolher foto.'; }
  }
  function abrir(inp) {
    alvo = inp; fechar();
    if (!document.getElementById('cvh-colar-css')) { var s = document.createElement('style'); s.id = 'cvh-colar-css'; s.textContent = css; document.head.appendChild(s); }
    folha = document.createElement('div'); folha.className = 'cvh-colar';
    var pdf = /pdf/i.test(inp.accept || '');
    folha.innerHTML = '<div class="cx" role="dialog" aria-modal="true"><h3>Adicionar foto</h3><p class="st"></p>' +
      (podeLer ? '<button class="p" data-c="colar">Colar a foto copiada</button>' : '') +
      '<button class="s" data-c="escolher">' + (pdf ? 'Tirar foto ou escolher arquivo' : 'Tirar ou escolher foto') + '</button><button class="c" data-c="cancelar">Cancelar</button></div>';
    document.body.appendChild(folha); document.addEventListener('paste', aoColar, true);
    var st = folha.querySelector('.st');
    folha.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-c]'); if (!b) { if (ev.target === folha) fechar(); return; }
      var c = b.dataset.c;
      if (c === 'cancelar') return fechar();
      if (c === 'colar') return colar(inp, st);
      if (c === 'escolher') { fechar(); inp.__cvhDireto = 1; inp.click(); }
    });
  }
  // toque no campo de foto (pelo botão, pelo rótulo ou por .click() no código): a folha abre antes do seletor do celular
  document.addEventListener('click', function (ev) {
    var inp = ev.target; if (!deFoto(inp)) return;
    if (inp.__cvhDireto) { inp.__cvhDireto = 0; return; }
    ev.preventDefault(); ev.stopPropagation(); abrir(inp);
  }, true);
})();

</script>
