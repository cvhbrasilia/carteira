<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estoque CVH</title>
<style>
:root{--vinho:#5F130F;--verm:#A83D3D;--cara:#C49A6C;--bege:#C6B098;--areia:#EEE5DB;--areia2:#E2D6C8;--papel:#FBF8F4;--tinta:#2b2320;--tinta2:#6b5a52;--ok:#2F6B45}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:14px 14px 90px}
.topo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.topo h1{margin:0;font-size:22px;color:var(--vinho)}
.topo h1 small{display:block;font-size:12px;font-weight:500;color:var(--tinta2)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--vinho);color:#fff;font-weight:700}
.btn.sec{background:#fff;color:var(--vinho);border:1px solid var(--areia2)}
.btn.peq{padding:7px 11px;font-size:13.5px;border-radius:10px}
.btn.grande{width:100%;padding:16px;font-size:17px}
.btn.perigo{background:#fff;color:var(--verm);border:1px solid #e3b9b4}
.btn:disabled{opacity:.45}
.bts{display:flex;flex-wrap:wrap;gap:8px}
.abas{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--areia2);margin-bottom:14px;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--tinta2);border-bottom:3px solid transparent;white-space:nowrap}
.abas button.on{color:var(--vinho);border-color:var(--vinho)}
.abas b{background:var(--verm);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px}
.cx{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 6px rgba(95,19,15,.08)}
.cx h2{margin:0 0 4px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--vinho)}
.nota{font-size:13px;color:var(--tinta2);margin:4px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 6px rgba(95,19,15,.08);border:0;text-align:left}
.kpi b{display:block;font-size:24px;color:var(--vinho);line-height:1.1}
.kpi span{font-size:12.5px;color:var(--tinta2)}
.lin{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #f0e8df}
.lin:first-of-type{border-top:0}
.lin .t{min-width:0}
.lin .t b{display:block;color:var(--vinho)}
.lin .t small{display:block;color:var(--tinta2);font-size:12.5px}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--areia);color:var(--vinho);white-space:nowrap}
.chip.ok{background:#E3EFE6;color:var(--ok)}.chip.al{background:#F6DADA;color:#8A1D14}.chip.av{background:#FBF0DC;color:#7A4E0B}.chip.ne{background:#f1ece6;color:#7a6a62}
.unid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 4px;border-top:1px solid #f0e8df}
.unid .co{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;background:var(--vinho)}
.unid .co.CP{background:#C49A6C}.unid .co.PFC,.unid .co.CRIO,.unid .co.PPC{background:#A83D3D}
.unid .t b{color:var(--vinho)}.unid .t small{display:block;color:var(--tinta2);font-size:12.5px}
.unid .d{text-align:right}.unid .d small{display:block;color:var(--tinta2);font-size:12px}
.filtros{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filtros button{border:1px solid var(--areia2);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--tinta2)}
.filtros button.on{background:var(--vinho);border-color:var(--vinho);color:#fff}
.passos{display:flex;gap:4px;margin:8px 0 14px;flex-wrap:wrap}
.passos span{flex:1;min-width:70px;font-size:11px;text-align:center;padding:6px 4px;border-radius:8px;background:#f3ede6;color:#9a8a80;font-weight:700}
.passos span.feito{background:#E3EFE6;color:var(--ok)}.passos span.agora{background:var(--vinho);color:#fff}
label{display:block;font-size:13px;color:var(--tinta2);margin:8px 0 4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:12px;border:1px solid var(--areia2);border-radius:10px;background:#fff;color:var(--tinta);font-size:17px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grade{grid-template-columns:1fr}}
.peso{display:flex;gap:8px;align-items:stretch}.peso input{flex:1;min-width:0}.peso .btn{flex:none;padding:0 14px}
.calc{background:#FFFBF5;border:1px dashed var(--bege);border-radius:12px;padding:12px;margin:10px 0}
.calc b.big{font-size:26px;color:var(--vinho)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:6px 0 12px}
.dl dt{color:var(--tinta2)}.dl dd{margin:0;font-weight:600}
.ev{font-size:13px;border-left:3px solid var(--areia2);padding:3px 0 3px 10px;margin:6px 0}
.ev small{color:var(--tinta2)}
#veu{position:fixed;inset:0;background:rgba(43,35,32,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#veu.on{opacity:1;pointer-events:auto}
#gaveta{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--papel);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s;z-index:21;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.18)}
#gaveta.on{transform:none}
@media (min-width:900px){#gaveta{left:auto;top:0;bottom:0;width:520px;max-height:none;border-radius:18px 0 0 18px;transform:translateX(105%)}#gaveta.on{transform:none}}
.gv-t{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.gv-t h3{margin:0;color:var(--vinho);font-size:18px}
.gv-t button{border:0;background:#fff;border-radius:999px;width:40px;height:40px;font-size:22px;color:var(--vinho);box-shadow:0 1px 4px rgba(0,0,0,.1)}
#gvC{overflow:auto;padding:0 16px 30px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw}
.vazio{color:var(--tinta2);font-size:14px;padding:6px 0}
@media (min-width:1000px){.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}}
#camE{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}
#camE.on{display:flex}
#camE video{flex:1;width:100%;object-fit:cover;min-height:0}
#camE .mira{position:absolute;left:50%;top:38%;width:70vmin;height:42vmin;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.85);border-radius:16px;pointer-events:none}
#camE .base{background:#fff;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
#camE .base p{margin:0 0 8px;font-weight:700;color:var(--vinho)}
#camE .flash{position:absolute;inset:0;background:rgba(47,107,69,.35);opacity:0;transition:opacity .25s;pointer-events:none}
#camE .flash.on{opacity:1;transition:none}
</style></head>
<body>
<div class="wrap" id="app"><div class="cx vazio">Abrindo o estoque…</div></div>
<div id="veu"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div id="camE"><video playsinline muted></video><div class="mira"></div><div class="flash"></div><div class="base"><p id="camEt">Aponte para o código da bolsa</p><div id="camEl" style="font-size:13.5px;max-height:22vh;overflow:auto"></div><button class="btn sec" id="camEsair" style="width:100%;margin-top:8px">Fechar a câmera</button></div></div>
<aside id="gaveta" aria-hidden="true"><div class="gv-t"><h3 id="gvT"></h3><button type="button" data-a="fechar" aria-label="Fechar">×</button></div><div id="gvC"></div></aside>
<script>
/* Estoque Inteligente CVH · fase 1: produção na bancada, estoque, ficha da bolsa e pendências do dia */
const CTX = window.CVH_CTX || {};
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const p2 = (n) => String(n).padStart(2, "0");
const hojeISO = () => { const d = new Date(); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
const br = (d) => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(String(d || "")); return m ? m[3] + "/" + m[2] + "/" + m[1] : (d || ""); };
const hora = (t) => { const d = new Date(t); return isNaN(d) ? "" : p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + "/" + d.getFullYear() + " às " + p2(d.getHours()) + ":" + p2(d.getMinutes()); };
const num = (x) => { if (x == null || x === "") return null; const n = parseFloat(String(x).replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : null; };
const fmt = (v, c = 0) => v == null || !isFinite(v) ? "" : (+v).toLocaleString("pt-BR", { maximumFractionDigits: c, minimumFractionDigits: c });
const dias = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const somaDias = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
const ponte = (metodo, ...args) => {
  let f = null; try { f = window.parent.CVH_PONTE; } catch (e) { f = null; }
  if (typeof f !== "function") return Promise.reject(new Error("Abra o estoque pelo Painel CVH."));
  const copia = (r) => { try { return r == null ? r : JSON.parse(JSON.stringify(r)); } catch (e) { return r; } };
  return new Promise((ok, erro) => { try { Promise.resolve(f(metodo, JSON.parse(JSON.stringify(args)))).then((r) => ok(copia(r)), (e) => erro(new Error((e && e.message) || String(e)))); } catch (e) { erro(e); } });
};
const est = (fn, ...a) => ponte("est", fn, ...a);
let tT = null;
function toast(m, ms) { let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(() => { t.hidden = true; }, ms || 3500); }
function abrirGaveta(t, h) { $("#gvT").textContent = t; $("#gvC").innerHTML = h; $("#gvC").scrollTop = 0; $("#gaveta").classList.add("on"); $("#veu").classList.add("on"); $("#gaveta").setAttribute("aria-hidden", "false"); }
function fecharGaveta() { $("#gaveta").classList.remove("on"); $("#veu").classList.remove("on"); $("#gaveta").setAttribute("aria-hidden", "true"); S.prodAberta = null; S.uniAberta = null; S.remAberta = null; }
// deslizar a gaveta para baixo no celular fecha
(() => { let y0 = null; const g = $("#gaveta"); g.addEventListener("touchstart", (e) => { y0 = $("#gvC").scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true }); g.addEventListener("touchend", (e) => { if (y0 != null && e.changedTouches[0].clientY - y0 > 90) fecharGaveta(); y0 = null; }, { passive: true }); })();

/* ── estado ── */
const S = { aba: "hoje", rem: [], eq: [], ap: [], sel: {}, prod: [], uni: [], ev: [], P: null, admin: !!CTX.admin, f: { comp: "", tipo: "", sit: "ativas" }, prodAberta: null, uniAberta: null };
const DOA = (CTX.doacoes || []).filter((d) => d.numero);
const ANI = Object.fromEntries((CTX.animais || []).map((a) => [a.id, a]));
const doacao = (c) => DOA.find((d) => d.numero.replace(/\s/g, "") === c) || null;
const animalDe = (id) => ANI[id] || {};
const tipoTxt = (a) => { if (!a) return ""; const t = String(a.tipoSanguineo || ""); return (/fel|gat/i.test(a.especie || "") ? t : t.replace(/Positivo/i, "+").replace(/Negativo/i, "−")) + (a.dal ? " · DAL " + (/neg/i.test(a.dal) ? "−" : "+") : ""); };
const ROT_SIT = { quarentena: "Aguardando liberação", disponivel: "Disponível", reservada: "Reservada", transito: "Em trânsito", retirada: "Retirada para transfusão", producao_crio: "Em produção de CRIO", utilizada: "Utilizada", descartada: "Descartada", bloqueada: "Bloqueada" };
const COR_SIT = { quarentena: "av", disponivel: "ok", reservada: "", transito: "av", retirada: "av", producao_crio: "av", utilizada: "ne", descartada: "ne", bloqueada: "al" };
const NOME_COMP = { CH: "CH com SAG", CP: "Concentrado de plaquetas", PFC: "Plasma fresco congelado", CRIO: "Crioprecipitado", PPC: "Plasma pobre em crio" };
const ETAPAS = [["peso_st", "Peso do ST"], ["centrifugacao", "Centrifugação"], ["ch_sem_sag", "CH sem SAG"], ["ch_com_sag", "CH com SAG"], ["cp_pfc", "CP e PFC"], ["concluida", "Concluída"]];

// validade: avisos de 10, 5 e 1 dia, no dia e depois da data impressa
function alertaValidade(u) {
  if (!u.validade || ["utilizada", "descartada"].includes(u.situacao)) return null;
  const n = dias(hojeISO(), String(u.validade).slice(0, 10));
  if (n < 0) return { t: "DATA DA ETIQUETA VENCIDA", c: "al", n };
  if (n === 0) return { t: "VENCE HOJE", c: "al", n };
  if (n === 1) return { t: "VENCE AMANHÃ", c: "al", n };
  if (n <= 5) return { t: "Vence em " + n + " dias", c: "av", n };
  if (n <= 10) return { t: "Vence em " + n + " dias", c: "ne", n };
  return null;
}
// plasma no freezer sem a conferência do dia seguinte
// PFC: conferência no dia seguinte; CRIO: 6 horas depois do início do congelamento (fica pendente até alguém conferir)
const congPendente = (u) => { const c = (u.dados || {}).congelamento; return c && c.inicio && !(c.conferido && c.conferido.congelado) && Date.now() - Date.parse(c.inicio) > (u.componente === "CRIO" ? 6 : 12) * 36e5; };

/* ── produção ── */
// coletas que aparecem para produzir: fichas com coleta a partir do início do estoque (20/11/2026)
const INICIO = "2026-11-20";
function aguardando() {
  const tem = new Set(S.prod.map((p) => p.coleta));
  const tem2 = new Set(S.uni.map((u) => u.coleta));
  return DOA.filter((d) => !d.naoColetado && d.data && d.data >= INICIO && dias(d.data, hojeISO()) <= 21 && !tem.has(d.numero.replace(/\s/g, "")) && !tem2.has(d.numero.replace(/\s/g, ""))).sort((a, b) => String(b.data).localeCompare(String(a.data)));
}
function sag(p) {
  const P = S.P.sag, peso = num(p.pesoCHsem), htM = num(p.htCHsem), ht = htM != null ? htM : P.htMedioCH;
  if (peso == null || peso <= P.tara) return null;
  const vol = (peso - P.tara) / P.densidade, calc = vol * (ht / P.htAlvo - 1);
  return { vol, calc: Math.max(0, calc), ht, medido: htM != null, suficiente: calc <= P.sagBolsa };
}
const volPeso = (peso, tara, dens) => { const p = num(peso); return p == null || p <= tara ? null : (p - tara) / dens; };
function abrirProducao(coleta) {
  const p = S.prod.find((x) => x.coleta === coleta) || { coleta, etapa: "peso_st", dados: {} }, d = doacao(coleta) || {}, a = animalDe(d.animalId || p.animal_id);
  S.prodAberta = coleta;
  const D = p.dados || {}, et = p.etapa, ie = ETAPAS.findIndex((e) => e[0] === et);
  const passos = '<div class="passos">' + ETAPAS.slice(0, 5).map((e, i) => '<span class="' + (i < ie || et === "concluida" ? "feito" : i === ie ? "agora" : "") + '">' + e[1] + "</span>").join("") + "</div>";
  const cab = '<dl class="dl"><dt>Doador</dt><dd>' + esc(a.nome || d.nome || "") + (tipoTxt(a) ? " · " + esc(tipoTxt(a)) : "") + "</dd><dt>Coleta</dt><dd>" + esc(br(d.data || "")) + (d.volume ? " · " + esc(d.volume) + " mL de ST" : "") + "</dd>" +
    (d.lote || d.validade ? "<dt>Bolsa</dt><dd>" + esc([d.lote ? "lote " + d.lote : "", d.validade ? "validade " + br(d.validade) : ""].filter(Boolean).join(" · ")) + "</dd>" : "") + (d.seguimento ? "<dt>Segmento</dt><dd>" + esc(d.seguimento) + "</dd>" : "") + "</dl>";
  let corpo = "";
  if (et === "peso_st") corpo = '<h2>Peso do conjunto completo de ST</h2><p class="nota">Tudo o que vai à balança na entrada da produção: bolsa de coleta com o sangue, bolsa de SAG com a solução, bolsa das plaquetas, plástico, manguitos e conexões.</p>' +
    '<label>Peso bruto do conjunto (g)</label><div class="peso"><input type="number" inputmode="decimal" id="pPesoST" value="' + esc(D.pesoST ?? "") + '"><button type="button" class="btn sec peq" data-a="foto" data-v="pPesoST">Foto</button></div><label>Micro-hematócrito do ST (%) <small>opcional, pode entrar depois</small></label><input type="number" inputmode="decimal" id="pHtST" value="' + esc(D.htST ?? "") + '">' +
    '<p class="nota">Identifique a amostra do ST na IDEXX como <b>ST_BOLSA ' + esc(coleta) + "</b>.</p>" + '<button class="btn grande" data-a="pSalvar" data-v="peso_st">Confirmar peso e seguir</button>';
  else if (et === "centrifugacao") corpo = "<h2>Centrifugações e transferência</h2>" +
    [["c1", "Primeira centrifugação concluída e porção das plaquetas separada"], ["c2", "Segunda centrifugação concluída"], ["tp", "Plasma remanescente transferido para a bolsa das plaquetas"]].map(([k, t]) => '<div class="lin"><div class="t"><b>' + t + "</b><small>" + (D[k] ? "feito " + esc(hora(D[k])) : "pendente") + "</small></div>" + (D[k] ? '<span class="chip ok">feito</span>' : '<button class="btn peq" data-a="pMarca" data-v="' + k + '">Feito</button>') + "</div>").join("") +
    (D.c1 && D.c2 && D.tp ? '<button class="btn grande" data-a="pAvanca" data-v="ch_sem_sag" style="margin-top:12px">Pesar o CH sem SAG</button>' : "");
  else if (et === "ch_sem_sag" || et === "ch_com_sag") {
    const c = sag(D);
    corpo = '<h2>SAGcalculadora</h2><div class="grade"><div><label>Peso do CH sem SAG (g)</label><div class="peso"><input type="number" inputmode="decimal" id="pPesoCH" value="' + esc(D.pesoCHsem ?? "") + '"><button type="button" class="btn sec peq" data-a="foto" data-v="pPesoCH">Foto</button></div></div><div><label>Micro-Ht do CH sem SAG (%) <small>opcional</small></label><input type="number" inputmode="decimal" id="pHtCH" value="' + esc(D.htCHsem ?? "") + '"></div></div>' +
      (c ? '<div class="calc"><small>Volume de SAG a acrescentar</small><br><b class="big">' + fmt(c.calc) + ' mL</b><br><small>CH sem SAG com ' + fmt(c.vol) + " mL · hematócrito " + (c.medido ? "medido " : "pela média do CVH, ") + fmt(c.ht, 1) + "% · alvo " + fmt(S.P.sag.htAlvo) + "%" + (c.suficiente ? "" : " · <b>passa da bolsa de SAG (" + fmt(S.P.sag.sagBolsa) + " mL)</b>") + "</small></div>" : '<p class="nota">Informe o peso para calcular o SAG. Sem micro-Ht, o cálculo usa a média do CVH (' + fmt(S.P.sag.htMedioCH, 1) + "%), e isso fica identificado no histórico.</p>") +
      '<div class="grade"><div><label>SAG acrescentado (mL)</label><input type="number" inputmode="decimal" id="pSagAd" value="' + esc(D.sagAdicionado ?? (c ? Math.round(c.calc) : "")) + '"></div><div><label>Peso final do CH com SAG (g)</label><div class="peso"><input type="number" inputmode="decimal" id="pPesoFinal" value="' + esc(D.pesoCHfinal ?? "") + '"><button type="button" class="btn sec peq" data-a="foto" data-v="pPesoFinal">Foto</button></div></div></div>' +
      '<label>Micro-Ht do CH com SAG (%) <small>opcional, pode entrar depois</small></label><input type="number" inputmode="decimal" id="pHtFinal" value="' + esc(D.htCHfinal ?? "") + '">' +
      '<p class="nota">Identifique a amostra na IDEXX como <b>CH_BOLSA ' + esc(coleta) + '</b>.</p><button class="btn grande" data-a="pSalvar" data-v="ch">Salvar CH e seguir para CP e PFC</button>';
  } else if (et === "cp_pfc") {
    const Q = S.P.qc, vcp = volPeso(D.pesoCP, Q.taraCP, Q.densCP), vpl = volPeso(D.pesoPFC, Q.taraPL, Q.densPL);

function calcFracionar() {
  const u = S.uni.find((x) => x.id === S.uniAberta); if (!u || !$("#fPI")) return;
  const d = densDe(u.componente), tM = +$("#fTM").value, pI = num($("#fPI").value), pF = num($("#fPF").value), L = S.P.limites || { fracionamentoMl: 30, criticoMl: 40 };
  const vol = (p, t) => p == null ? null : (p - t) / d;
  $("#fPIv").textContent = pI != null ? (pI < tM ? "Peso menor que a tara: confira o modelo." : "Volume estimado " + fmt(vol(pI, tM), 1) + " mL") : "";

  for (let i = 0; i < (S.nFr || 1); i++) {
    const a = num($("#fA" + i).value), t = +$("#fT" + i).value, p = num($("#fP" + i).value);

}

// peso pela foto do visor da balança: a foto vai reduzida (rápida) e o número entra no campo para conferir
let ALVO_FOTO = "";
async function lerPesoFoto(file) {
  const campo = $("#" + ALVO_FOTO); if (!campo || !file) return;
  const t0 = Date.now(); toast("Lendo o peso…", 20000);
  try {
    const img = await new Promise((ok, erro) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); ok(im); }; im.onerror = () => erro(new Error("Não consegui abrir a foto.")); im.src = u; });

    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    const b64 = cv.toDataURL("image/jpeg", 0.75).split(",")[1];
    const r = await ponte("iaRapida", "balanca", "image/jpeg", b64);
    let g = num(r && r.peso); if (g != null && /kg/i.test(r.unidade || "")) g = g * 1000;
    if (!r || !r.legivel || g == null) throw new Error("Não deu para ler o visor. Tire outra foto, de frente e sem reflexo, ou digite o peso.");
    campo.value = Math.round(g * 10) / 10; campo.dispatchEvent(new Event("input", { bubbles: true })); campo.focus();
    toast("Peso identificado: " + fmt(g, g % 1 ? 1 : 0) + " g (" + fmt((Date.now() - t0) / 1000, 1) + " s). Confira antes de confirmar.", 6000);
  } catch (e) { toast(e.message || String(e), 6000); }
}
