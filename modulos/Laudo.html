<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laudo de exame CVH</title><style>
:root{--vinho:#5F130F;--verm:#A83D3D;--areia:#EEE5DB;--areia2:#E2D6C8;--papel:#FBF8F4;--bege:#C6B098;--tinta:#2b2320;--tinta2:#6b5a52}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:22px;max-width:1280px;margin:0 auto;padding:16px 16px 60px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:14px;padding:12px 12px 80px}}
.cx{background:#fff;border-radius:14px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:0 1px 6px rgba(95,19,15,.08)}
.cx h3{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--vinho)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px}
.grade.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:480px){.grade.g4{grid-template-columns:1fr 1fr}}
.larga{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--tinta2)}
input,select,textarea{font:inherit;font-size:15px;color:var(--tinta);border:1px solid var(--areia2);border-radius:10px;padding:9px 10px;background:#fff;width:100%;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(95,19,15,.25);border-color:var(--vinho)}
.cep{display:flex;gap:6px}
.item{border:1px solid var(--areia2);border-radius:12px;padding:10px;margin-bottom:10px;background:#FFFDFB}
.it-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.it-top b{color:var(--vinho);font-size:14px}
.btn{border:0;background:var(--vinho);color:#fff;font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:12px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:#fff;color:var(--vinho);border:1px solid var(--areia2)}
.btn.mini{font-size:13px;padding:7px 10px;border-radius:9px}
.lnk{border:0;background:none;color:var(--verm);font-size:13px;text-decoration:underline;cursor:pointer}
.nota{font-size:13px;color:var(--tinta2);margin:4px 0}
.aviso{font-size:13px;background:#FFF2E0;color:#7a4a10;border-radius:10px;padding:8px 10px;margin:8px 0 0}
details.dose{margin-top:8px;font-size:14px}details.dose summary{cursor:pointer;color:var(--vinho);font-weight:700}
.calc{border:1px solid var(--areia2);border-radius:12px;padding:8px 10px;margin:0 0 12px;background:#FFFBF7}.calc summary{cursor:pointer;color:var(--vinho);font-weight:700;padding:4px 0}
.grade.g3{grid-template-columns:repeat(3,1fr);margin-top:8px}@media (max-width:520px){.grade.g3{grid-template-columns:1fr 1fr}}
.chk{justify-content:flex-end}.chk span{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--tinta)}.chk input[type=checkbox]{width:18px;height:18px}
.calc-res{margin-top:8px;font-size:14px}.calc-res p{margin:4px 0}.calc-pos{background:#fff;border-radius:8px;padding:8px 10px;border:1px solid var(--areia2)}.calc-pos small{color:var(--tinta2)}
.calc-usar{display:flex;gap:6px;align-items:center;margin-top:6px}.calc-usar select{flex:1}
.dose-res{font-size:13.5px;margin:8px 0 0;line-height:1.5}
.lado{position:sticky;top:0;align-self:start;padding-top:8px;background:var(--papel);z-index:2}
@media (max-width:900px){.lado{position:static}}
.barra-prev{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
#abas-doc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#abas-doc button,#modo-prev button{border:1px solid var(--areia2);background:#fff;color:var(--vinho);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
#abas-doc button.on,#modo-prev button[aria-pressed=true]{background:var(--vinho);color:#fff;border-color:var(--vinho)}
#modo-prev{display:flex;gap:4px;margin-left:auto}
.fora{font-size:12px;color:#7a4a10;background:#FFF2E0;border-radius:999px;padding:4px 9px}
#previa{display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 150px);overflow:auto;padding:2px}
@media (max-width:900px){#previa{max-height:none}}
.folha-wrap{background:#fff;box-shadow:0 1px 2px rgba(95,19,15,.18),0 6px 18px rgba(95,19,15,.08)}
.folha-wrap.mob{max-width:400px;margin:0 auto;width:100%}
svg.folha{display:block;width:100%;height:auto;font-family:"Receita CVH",sans-serif}
.vazio{background:#fff;border-radius:14px;padding:40px 20px;text-align:center;color:var(--tinta2)}
.acoes-fim{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.st{font-size:13.5px;color:var(--tinta2);min-height:18px}.st.erro{color:var(--verm);font-weight:700}
#salvo{background:#fff;border-radius:14px;padding:14px;box-shadow:0 0 0 2px #2F7D4F inset;margin-bottom:12px}
#salvo h3{margin:0 0 8px;color:#2F7D4F;font-size:16px}
.sv-doc{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px solid var(--areia)}
.sv-doc small{display:block;color:var(--tinta2);font-size:12.5px}
.sv-bts{display:flex;flex-wrap:wrap;gap:6px}
@media (min-width:901px){.wrap{grid-template-columns:minmax(0,560px) minmax(0,1fr)}}
/* celular: uma coluna só, a prévia fica no fim da página e nada desliza para o lado */
html,body{overflow-x:hidden;max-width:100%}
.folha-wrap svg{width:100%;height:auto;display:block}
@media (max-width:900px){.lado{border-top:1px solid var(--areia2);padding-top:14px}.lado::before{content:"Prévia do laudo";display:block;font-weight:700;color:var(--vinho);margin-bottom:8px}}
.rcab,.rl{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(54px,.7fr) 56px minmax(0,1.3fr) 24px;gap:6px;align-items:center}
.rl.com-pct{grid-template-columns:minmax(0,1.5fr) minmax(54px,.7fr) 56px minmax(0,1.3fr) 24px}
.rcab{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7A5530;padding:0 2px 4px}
.rg{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--verm);margin:12px 0 4px;border-bottom:1px solid var(--areia2);padding-bottom:3px}
.rl{padding:3px 2px;border-radius:8px}.rl:nth-child(even){background:#FBF6F1}
.rl .rn{font-size:13.5px;color:var(--tinta)}.rl input{padding:6px 7px;font-size:14px;border-radius:8px}.rl .rv{font-weight:700;color:var(--vinho);text-align:right}
.rl .rp{display:none}.rl .ru{font-size:11.5px;color:var(--tinta2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl .rr{display:flex;align-items:center;gap:3px}.rl .rr input{font-size:12.5px;color:var(--tinta2);text-align:center;padding:5px 3px}.rl .rr i{font-style:normal;color:var(--tinta2)}
.rl.fora .rv{color:var(--verm);border-color:var(--verm);background:#FBF3F1}.rl.fora .rn{color:var(--verm);font-weight:700}
.rx{border:0;background:none;color:#B9A79B;font-size:18px;cursor:pointer;padding:0}.rx:hover{color:var(--verm)}
#salvo{box-shadow:0 0 0 2px var(--vinho) inset}#salvo h3{color:var(--vinho)}#salvo .btn{margin-top:8px;width:100%;justify-content:center}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media (max-width:520px){.tipos{grid-template-columns:1fr}}
.tipo{border:1px solid var(--areia2);background:#FFFDFB;border-radius:12px;padding:12px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:3px}
.tipo b{color:var(--vinho);font-size:15px}.tipo small{color:var(--tinta2);font-size:12.5px;line-height:1.35}.tipo:hover{border-color:var(--bege);background:#FBF6F1}
.topo-tipo{display:flex;align-items:center;gap:10px;margin:0 0 10px}.topo-tipo b{color:var(--vinho);font-size:14px}.topo-tipo .lnk{padding:0}
.idade-cx{display:flex;gap:6px}.idade-cx input{flex:1 1 52px;min-width:52px}.idade-cx select{flex:0 0 auto;width:auto;max-width:96px;padding-left:8px;padding-right:6px}
.segm{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.segm button{border:1px solid var(--areia2);background:#fff;color:var(--vinho);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;min-width:52px}
.segm button[aria-pressed=true]{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.item.pos{border-color:#E4B7B0;background:#FDF6F4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{border:1px dashed var(--bege);background:#FFFDFB;color:var(--tinta2);border-radius:10px;padding:6px 9px;font:inherit;font-size:12.5px;text-align:left;cursor:pointer}.chip:hover{color:var(--vinho);border-color:var(--vinho)}
.foto-cx{display:flex;gap:12px;align-items:center;margin-top:10px;border:1px dashed var(--areia2);border-radius:12px;padding:10px;background:#FFFDFB}.foto-cx img{width:120px;max-height:110px;object-fit:contain;border-radius:8px;border:1px solid var(--areia2);background:#fff}.foto-cx b{color:var(--vinho);font-size:14px}
.modal{position:fixed;inset:0;background:rgba(43,35,32,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}.modal[hidden]{display:none}
.modal .caixa{background:#fff;border-radius:16px;padding:16px;max-width:620px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}.modal h3{margin:0 0 4px;color:var(--vinho);font-size:16px}
.modal .area{position:relative;margin:10px auto;touch-action:none;user-select:none}.modal canvas{display:block;border-radius:6px}
.moldura{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45);cursor:move;touch-action:none}
.alca{position:absolute;width:22px;height:22px;background:#fff;border:2px solid var(--vinho);border-radius:50%}.alca[data-c=nw]{left:-12px;top:-12px;cursor:nwse-resize}.alca[data-c=ne]{right:-12px;top:-12px;cursor:nesw-resize}.alca[data-c=sw]{left:-12px;bottom:-12px;cursor:nesw-resize}.alca[data-c=se]{right:-12px;bottom:-12px;cursor:nwse-resize}
.modal .botoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.modal .esp{flex:1}
.kit{margin:8px 0 2px;border-radius:10px;background:#F7F2EC;padding:8px 10px;font-size:13px;color:var(--tinta2)}.kit p{margin:0 0 4px}.kit.pouco{background:#FFF2E0;color:#7a4a10}.kit.fim{background:#FBE9E6;color:var(--verm)}
.kit-b{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}.kit-f{margin-top:6px}
.sugere{margin-top:8px;border-radius:10px;background:#F7F2EC;padding:9px 10px;font-size:13.5px}.sugere p{margin:0 0 6px}
.ac-pai{position:relative}.ac-lista{display:none;position:absolute;left:0;right:0;top:100%;z-index:20;margin:2px 0 0;padding:4px 0;list-style:none;background:#fff;border:1px solid var(--areia2);border-radius:10px;box-shadow:0 6px 18px rgba(95,19,15,.12);max-height:240px;overflow:auto}
.ac-lista.on{display:block}.ac-lista li{padding:7px 10px;font-size:14px;font-weight:400;color:var(--tinta);cursor:pointer}.ac-lista li:hover,.ac-lista li.sel{background:#FBF6F1}
</style>

  <div><div id="salvo" hidden></div><div id="form"></div>
    <div class="cx acoes-fim"><button type="button" class="btn" id="salvar" data-a="salvar" disabled>Salvar e assinar</button><button type="button" class="btn sec" id="guardar" data-a="guardar">Guardar para editar depois (15 dias)</button><p class="st" id="st"></p></div></div>

// ---------- medida de texto (métricas da fonte do laudo) ----------
function largura(txt, tam, neg, ita) {
  const w = (ita ? FONTES.i : neg ? FONTES.b : FONTES.r).w, mapa = FONTES.cp1252;
  let s = 0;
  for (const ch of String(txt)) { const b = mapa[ch]; s += b != null ? w[b - 32] : w[31]; }
  return (s * tam) / 1000;
}
const seg = (t, tam, o = {}) => ({ t: String(t), tam, b: !!o.b, i: !!o.i, c: o.c || COR.TEXTO, sup: !!o.sup });
function largSegs(segs) { return segs.reduce((s, g) => s + largura(g.t, g.sup ? g.tam * 0.62 : g.tam, g.b, g.i), 0); }
function quebrar(texto, tam, neg, max) {
  const linhas = []; let atual = "";
  for (const p of String(texto).split(/\s+/).filter(Boolean)) {
    const teste = atual ? atual + " " + p : p;
    if (largura(teste, tam, neg) <= max || !atual) atual = teste; else { linhas.push(atual); atual = p; }
  }
  if (atual) linhas.push(atual);
  return linhas.length ? linhas : [""];
}
// unidade com expoente: "×10⁶/µL" vira segmentos com o 6 sobrescrito
function unidadeSegs(un, tam, c, b) {
  const m = String(un).match(/^(.*?)([⁰¹²³⁴⁵⁶⁷⁸⁹]+)(.*)$/);
  if (!m) return [seg(un, tam, { c, b })];
  const sup = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9" };
  return [seg(m[1], tam, { c, b }), seg([...m[2]].map((x) => sup[x]).join(""), tam, { c, b, sup: true }), seg(m[3], tam, { c, b })];
}

// Entre desenhos de altura parecida, o título decide qual entra, para as seções não ficarem todas iguais.
function tuboEscolha(W, alvo, semente) {
  const c = TUBOS.map((t, i) => ({ i, t, H: W * t.h / 1000 })).map(o => (o.n = Math.abs(Math.log(o.H / alvo)), o)).sort((a, b) => a.n - b.n);
  const ok = c.filter(o => o.n <= c[0].n + 0.08);
  let s = 0; for (const ch of String(semente || '')) s = (s * 31 + ch.charCodeAt(0)) % 9973;
  return ok[s % ok.length];
}

// junta os trechos de texto de cada página em linhas, pela posição vertical (guarda a altura de cada linha na página)
function linhasPdf(paginas) {
  const out = [];
  paginas.forEach((itens, ip) => {
    const its = itens.filter((i) => i.str && i.str.trim() !== "").map((i) => ({ s: i.str, x: i.transform[4], y: i.transform[5], w: i.width || 0 }));
    its.sort((a, b) => (b.y - a.y) || (a.x - b.x));
    const grupos = [];
    for (const it of its) { const g = grupos.find((gr) => Math.abs(gr.y - it.y) <= 2.5); if (g) g.itens.push(it); else grupos.push({ y: it.y, itens: [it] }); }
    grupos.sort((a, b) => b.y - a.y);
    for (const g of grupos) {
      g.itens.sort((a, b) => a.x - b.x);
      let txt = "", fim = null;
      for (const it of g.itens) { if (fim !== null) { const gap = it.x - fim; txt += gap > 8 ? "   " : (gap > 0.8 ? " " : ""); } txt += it.s; fim = it.x + it.w; }
      out.push({ t: txt.replace(/\s+$/, ""), y: g.y, x: g.itens[0].x, pg: ip });
    }
  });
  return out;
}

// só o exame principal, à esquerda, é lido (nome, resultado, unidade e referência). Tudo à direita da escala BAIXO · NORMAL · ALTO é ignorado.
function semExameAnterior(paginas) {
  return paginas.map((itens) => {
    const txt = (i) => String(i.str || "").trim(), x = (i) => i.transform[4], y = (i) => i.transform[5];
    const larg = Math.max(...itens.map((i) => x(i) + (i.width || 0)), 1);
    const alto = itens.filter((i) => /^(ALTO|HIGH)$/i.test(txt(i))), datas = itens.filter((i) => /^\d{2}\/\d{2}\/(\d{2}|\d{4})$/.test(txt(i)) && x(i) > larg * 0.55);
    let corte = Infinity, yTopo = -Infinity;
    // cabeçalho da escala: o exame anterior fica sempre à direita da palavra ALTO
    alto.forEach((a) => { const fim = x(a) + (a.width || 0) + 12, temDir = itens.some((i) => x(i) >= fim && y(i) < y(a) && /\d/.test(txt(i))); if (temDir) { corte = Math.min(corte, fim); yTopo = Math.max(yTopo, y(a)); } });
    // data do exame anterior (sem cabeçalho de escala): a coluna começa um pouco antes dela
    datas.forEach((d) => { corte = Math.min(corte, x(d) - 14); yTopo = Math.max(yTopo, y(d) + 3); });
    if (!isFinite(corte)) return itens;
    return itens.filter((i) => !(x(i) >= corte && y(i) <= yTopo));
  });
}

  const graf = [];

    iRes.forEach((k, j) => {

      const seg = corpo.slice(k, fim), antes = corpo[k - 1] || "";

      const ref = (corpo[k].replace(/^RESULTADO\s*\.*\s*:?\s*\.*\s*/i, "").split(/\s{2,}/)[1] || "").trim();

// Fita cortada ao meio no comprimento volta à espessura inteira; o pedaço da membrana que faltar é completado com a textura dela mesma.
