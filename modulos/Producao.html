<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Produção CVH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Proza+Libre:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--vinho:#5F130F;--verm:#A83D3D;--cara:#C49A6C;--bege:#C6B098;--areia:#EEE5DB;--areia2:#E2D6C8;--papel:#FBF8F4;--tinta:#2b2320;--tinta2:#6b5a52;--ok:#2F6B45}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:14px 14px 90px}
.topo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.topo h1{margin:0;font-size:22px;color:var(--vinho)}
.topo h1 small{display:block;font-size:12px;font-weight:500;color:var(--tinta2)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--verm-bt,#A83D3D);color:#fff;font-weight:700}
.btn.sec{background:#fff;color:var(--vinho);border:1px solid var(--areia2)}
.btn.peq{padding:7px 11px;font-size:13.5px;border-radius:10px}
.btn.grande{width:100%;padding:16px;font-size:17px}
.btn.perigo{background:#fff;color:var(--verm);border:1px solid #e3b9b4}
.btn:disabled{opacity:.45}
.bts{display:flex;flex-wrap:wrap;gap:8px}
.secs{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:6px}.sec-u{text-align:left;border:1px solid var(--areia2);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px}.sec-u b{color:var(--vinho);font-size:14.5px}.sec-u small{color:var(--suave);font-size:12px;line-height:1.3}.sec-u.on{border-color:var(--verm-bt,#A83D3D);background:#FBF3E8}.opc{display:flex;flex-direction:column;gap:8px}.opc .o{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.opc .o small{flex:1;min-width:180px;color:var(--suave);line-height:1.3}
.abas{display:flex;flex-wrap:wrap;gap:2px 4px;overflow-x:auto;border-bottom:1px solid var(--areia2);margin-bottom:14px;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--tinta2);border-bottom:3px solid transparent;white-space:nowrap}
.abas button.on{color:var(--vinho);border-color:var(--verm-bt,#A83D3D)}
.abas b{background:var(--verm);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px}
.cx{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 6px rgba(95,19,15,.08)}
.cx h2{margin:0 0 4px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--vinho)}
.nota{font-size:13px;color:var(--tinta2);margin:4px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 6px rgba(95,19,15,.08);border:0;text-align:left}
.kpi{position:relative}.kpi span.kco{position:absolute;top:10px;right:10px;width:38px;height:24px;border-radius:7px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:var(--verm-bt,#A83D3D)}.kpi span.kco.PFC,.kpi span.kco.CRIO{background:#A83D3D}.kpi span.kco.CP{background:#C49A6C}
.ag-abas button{border:1px solid #E5D8CB;background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--vinho)}.ag-abas button.on{background:var(--verm-bt,#A83D3D);color:#fff;border-color:var(--verm-bt,#A83D3D)}.hj-abas{margin:0 0 14px}.tp-abas{margin:2px 0 12px}
.kpi b{display:block;font-size:24px;color:var(--vinho);line-height:1.1}
.kpi span{font-size:12.5px;color:var(--tinta2)}
.lin{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #f0e8df}
.lin:first-of-type{border-top:0}
.lin .t{min-width:0}
.lin.clic{cursor:pointer;border-radius:8px;padding-left:6px;padding-right:6px;margin:0 -6px}.lin.clic:hover{background:var(--areia)}
.lin .t b{display:block;color:var(--vinho)}
.lin .t small{display:block;color:var(--tinta2);font-size:12.5px}
.trava{border:1.5px solid #E2B04A;background:#FBF0DC;border-radius:12px;padding:12px 14px;margin:8px 0 12px;display:flex;flex-direction:column;gap:6px}.trava b{color:#7A4E0B}.trava small{color:#5c4a2a;font-size:13px}.trava .ped{color:#7A4E0B}.trava input{width:100%}.trava .btn{align-self:flex-start}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--areia);color:var(--vinho);white-space:nowrap}
.chip.ok{background:#E3EFE6;color:var(--ok)}.chip.al{background:#F6DADA;color:#8A1D14}.chip.av{background:#FBF0DC;color:#7A4E0B}.chip.ne{background:#f1ece6;color:#7a6a62}
.unid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 4px;border-top:1px solid #f0e8df}
.unid .co{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;background:var(--verm-bt,#A83D3D)}
.unid .co.CP{background:#C49A6C}.unid .co.PFC,.unid .co.CRIO,.unid .co.PPC{background:#A83D3D}
.unid .t b{color:var(--vinho)}.tps{display:inline-block;vertical-align:2px;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.02em;line-height:1.5;color:#fff;white-space:nowrap}.tps.neg{background:#A83D3D}.tps.pos{background:#3F6890}.tps.gat{background:#C49A6C}.unid .t small{display:block;color:var(--tinta2);font-size:12.5px}
.unid .d{text-align:right}.unid .d small{display:block;color:var(--tinta2);font-size:12px}
.filtros{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filtros button{border:1px solid var(--areia2);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--tinta2)}
.filtros button.on{background:var(--verm-bt,#A83D3D);border-color:var(--verm-bt,#A83D3D);color:#fff}
.passos{display:flex;gap:4px;margin:8px 0 14px;flex-wrap:wrap}
.passos span{flex:1;min-width:70px;font-size:11px;text-align:center;padding:6px 4px;border-radius:8px;background:#f3ede6;color:#9a8a80;font-weight:700}
.passos span.feito{background:#E3EFE6;color:var(--ok)}.passos span.agora{background:var(--verm-bt,#A83D3D);color:#fff}
label{display:block;font-size:13px;color:var(--tinta2);margin:8px 0 4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:12px;border:1px solid var(--areia2);border-radius:10px;background:#fff;color:var(--tinta);font-size:17px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grade{grid-template-columns:1fr}}
.peso{display:flex;gap:8px;align-items:stretch}.peso input{flex:1;min-width:0}.peso .btn{flex:none;padding:0 14px}
.calc{background:#FFFBF5;border:1px dashed var(--bege);border-radius:12px;padding:12px;margin:10px 0}
.calc b.big{font-size:26px;color:var(--vinho)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:6px 0 12px}
.dl dt{color:var(--tinta2)}.dl dd{margin:0;font-weight:600}
.ev{font-size:13px;border-left:3px solid var(--areia2);padding:3px 0 3px 10px;margin:6px 0}
.ev small{color:var(--tinta2)}
.lembrete-ov{position:fixed;inset:0;background:rgba(43,35,32,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}.lembrete-cx{background:#fff;border-radius:16px;padding:20px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}.lembrete-cx>b{display:block;font-size:19px;color:#5F130F;margin-bottom:6px}.lembrete-cx .bts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#veu{position:fixed;inset:0;background:rgba(43,35,32,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#veu.on{opacity:1;pointer-events:auto}
#gaveta{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--papel);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s;z-index:21;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.18)}
#gaveta.on{transform:none}
@media (min-width:900px){#gaveta{left:auto;top:0;bottom:0;width:520px;max-height:none;border-radius:18px 0 0 18px;transform:translateX(105%)}#gaveta.on{transform:none}}
.gv-t{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.gv-t h3{margin:0;color:var(--vinho);font-size:18px}
.gv-t button{border:0;background:#fff;border-radius:999px;width:40px;height:40px;font-size:22px;color:var(--vinho);box-shadow:0 1px 4px rgba(0,0,0,.1)}
#gvC{overflow:auto;padding:0 16px 30px}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;z-index:40;width:max-content;max-width:min(94vw,620px);line-height:1.35;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.vazio{color:var(--tinta2);font-size:14px;padding:6px 0}
@media (min-width:1000px){.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}}
#camE{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}
#camE.on{display:flex}
#camE video{flex:1;width:100%;object-fit:cover;min-height:0}
#camE .mira{position:absolute;left:50%;top:38%;width:70vmin;height:42vmin;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.85);border-radius:16px;pointer-events:none}
#camE .base{background:#fff;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
#camE .base p{margin:0 0 8px;font-weight:700;color:var(--vinho)}
#camE .flash{position:absolute;inset:0;background:rgba(47,107,69,.35);opacity:0;transition:opacity .25s;pointer-events:none}
#camE .flash.on{opacity:1;transition:none}
.unid.fr{margin-left:28px;width:calc(100% - 28px);background:#FBF3E8;border-left:3px solid var(--cara);border-radius:0 10px 10px 0;padding-left:10px}
.unid.fr .co{background:#C49A6C!important;width:38px;height:38px;font-size:11.5px}
.grupo-t{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2);margin:12px 0 2px}
</style><style id="paleta-cvh">
/* paleta inteira do manual (26/11/2026): o vinho fica no botão principal; secundários em areia, destaques em caramelo, títulos em vinho com traço caramelo */
.btn.sec,.btn.sec2{background:#EEE5DB;color:#5F130F;border-color:#C6B098}
.btn.cara{background:#C49A6C;color:#3D0C09}
.cx>h2:first-child,.cx>h3:first-child,.cartao>h3{color:#5F130F;border-left:3px solid #C49A6C;padding-left:8px;line-height:1.15}
.mini{background:#EEE5DB;border-color:#C6B098}
.filtro.on{background:#C49A6C;color:#3D0C09;border-color:#C49A6C}
.mod{border-top:4px solid var(--mc,#C6B098);box-shadow:none}
.mods .mod:nth-child(4n+1){--mc:#C49A6C}.mods .mod:nth-child(4n+2){--mc:#C6B098}.mods .mod:nth-child(4n+3){--mc:#A83D3D}.mods .mod:nth-child(4n+4){--mc:#5F130F}
.mod i{background:#EEE5DB;border:1px solid #E3D5C5}
.mod-n{background:#EEE5DB;color:#9B7A55}
.filtros button.on,.ag-abas button.on,.mini.on{background:#C49A6C;color:#3D0C09;border-color:#C49A6C}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="cx vazio">Abrindo o estoque…</div></div>
<div id="veu"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="embFotoIn" accept="image/*" capture="environment" hidden>
<div id="camE"><video playsinline muted></video><div class="mira"></div><div class="flash"></div><div class="base"><p id="camEt">Aponte para o código da bolsa</p><div id="camEl" style="font-size:13.5px;max-height:22vh;overflow:auto"></div><button class="btn sec" id="camEsair" style="width:100%;margin-top:8px">Fechar a câmera</button></div></div>
<aside id="gaveta" aria-hidden="true"><div class="gv-t"><h3 id="gvT"></h3><button type="button" data-a="fechar" aria-label="Fechar">×</button></div><div id="gvC"></div></aside>
<script>
/* Estoque Inteligente CVH · fase 1: produção na bancada, estoque, ficha da bolsa e pendências do dia */
const CTX = window.CVH_CTX || {};
// o mesmo arquivo serve dois módulos: Estoque (bolsas prontas) e Produção (bancada); os dados e as regras são os mesmos
const MODO = "producao", PROD = MODO === "producao";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const p2 = (n) => String(n).padStart(2, "0");
const hojeISO = () => { const d = new Date(); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
const br = (d) => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(String(d || "")); return m ? m[3] + "/" + m[2] + "/" + m[1] : (d || ""); };
const hora = (t) => { const d = new Date(t); return isNaN(d) ? "" : p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + "/" + d.getFullYear() + " às " + p2(d.getHours()) + ":" + p2(d.getMinutes()); };
const num = (x) => { if (x == null || x === "") return null; const n = parseFloat(String(x).replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : null; };
const fmt = (v, c = 0) => v == null || !isFinite(v) ? "" : (+v).toLocaleString("pt-BR", { maximumFractionDigits: c, minimumFractionDigits: c });
const dias = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const somaDias = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
const ponte = (metodo, ...args) => {
  let f = null; try { f = window.parent.CVH_PONTE; } catch (e) { f = null; }
  if (typeof f !== "function") return Promise.reject(new Error("Abra o estoque pelo Painel CVH."));
  const copia = (r) => { try { return r == null ? r : JSON.parse(JSON.stringify(r)); } catch (e) { return r; } };
  return new Promise((ok, erro) => { try { Promise.resolve(f(metodo, JSON.parse(JSON.stringify(args)))).then((r) => ok(copia(r)), (e) => erro(new Error((e && e.message) || String(e)))); } catch (e) { erro(e); } });
};
const est = (fn, ...a) => ponte("est", fn, ...a);
let tT = null;
function toast(m, ms) { let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(() => { t.hidden = true; }, ms || 3500); }
function abrirGaveta(t, h) { $("#gvT").textContent = t; $("#gvC").innerHTML = h; $("#gvC").scrollTop = 0; $("#gaveta").classList.add("on"); $("#veu").classList.add("on"); $("#gaveta").setAttribute("aria-hidden", "false"); }
function fecharGaveta() { $("#gaveta").classList.remove("on"); $("#veu").classList.remove("on"); $("#gaveta").setAttribute("aria-hidden", "true"); S.prodAberta = null; S.uniAberta = null; S.remAberta = null; }
// deslizar a gaveta para baixo no celular fecha
(() => { let y0 = null; const g = $("#gaveta"); g.addEventListener("touchstart", (e) => { y0 = $("#gvC").scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true }); g.addEventListener("touchend", (e) => { if (y0 != null && e.changedTouches[0].clientY - y0 > 90) fecharGaveta(); y0 = null; }, { passive: true }); })();

/* ── estado ── */
const S = { aba: ["hoje", "estoque", "rem", "int", "conf", "rel", "hist"].includes(CTX.aba) ? CTX.aba : "hoje", at: [], rem: [], eq: [], ap: [], sel: {}, prod: [], uni: [], ev: [], P: null, admin: !!CTX.admin, f: { comp: "", tipo: "", sit: "ativas" }, prodAberta: null, uniAberta: null };
const DOA = (CTX.doacoes || []).filter((d) => d.numero);
const ANI = Object.fromEntries((CTX.animais || []).map((a) => [a.id, a]));
const doacao = (c) => DOA.find((d) => d.numero.replace(/\s/g, "") === c) || null;
const animalDe = (id) => ANI[id] || {};
// doador sem cadastro (carga inicial): nome, espécie e tipagem anotados na bolsa ou na bolsa de origem
const doadorDe = (u) => { if (u && u.animal_id && ANI[u.animal_id]) return ANI[u.animal_id]; const d = (u && u.dados) || {}, m = u && u.mae_id ? ((S.uni || []).find((x) => x.id === u.mae_id) || {}).dados || {} : {}; return { nome: d.doador || m.doador || "", especie: d.especie || m.especie || "", tipoSanguineo: d.tipoSanguineo || m.tipoSanguineo || "", dal: d.dal || m.dal || "" }; };
// etiqueta do tipo sanguíneo: DEA 1 negativo em vermelho, positivo em azul (no gato, o grupo A, B ou AB)
const seloTipo0 = (a) => { if (!a) return ""; const t = String(a.tipoSanguineo || ""); if (/fel|gat/i.test(a.especie || "")) { const g = (t.match(/\b(AB|A|B)\b/i) || [])[1]; return g ? '<span class="tps gat">Tipo ' + g.toUpperCase() + "</span>" : ""; } return /neg/i.test(t) ? '<span class="tps neg">DEA 1 −</span>' : /pos/i.test(t) ? '<span class="tps pos">DEA 1 +</span>' : ""; };
const seloTipo = (a) => seloTipo0(a) + (a && a.dal && !/fel|gat/i.test(a.especie || "") ? (/neg/i.test(a.dal) ? '<span class="tps neg">DAL −</span>' : '<span class="tps pos">DAL +</span>') : "");
const tipoResto = (a) => { if (!a || /fel|gat/i.test(a.especie || "")) return ""; const t = String(a.tipoSanguineo || ""); return !/neg|pos/i.test(t) && t ? t : ""; };
const tipoTxt = (a) => { if (!a) return ""; const t = String(a.tipoSanguineo || ""); return (/fel|gat/i.test(a.especie || "") ? t : t.replace(/Positivo/i, "+").replace(/Negativo/i, "−")) + (a.dal ? " · DAL " + (/neg/i.test(a.dal) ? "−" : "+") : ""); };
const ROT_SIT = { quarentena: "Aguardando liberação", disponivel: "Disponível", reservada: "Reservada", transito: "Em trânsito", retirada: "Retirada para transfusão", producao_crio: "Em produção de CRIO", utilizada: "Utilizada", descartada: "Descartada", bloqueada: "Bloqueada" };
const COR_SIT = { quarentena: "av", disponivel: "ok", reservada: "", transito: "av", retirada: "av", producao_crio: "av", utilizada: "ne", descartada: "ne", bloqueada: "al" };
const NOME_COMP = { CH: "CH com SAG", CP: "Concentrado de plaquetas", PFC: "Plasma fresco congelado", CRIO: "Crioprecipitado", PPC: "Plasma pobre em crio" };
const ETAPAS = [["peso_st", "Peso do ST"], ["centrifugacao", "Centrifugação"], ["ch_sem_sag", "CH sem SAG"], ["ch_com_sag", "CH com SAG"], ["cp_pfc", "CP e PFC"], ["concluida", "Concluída"]];

// validade: avisos de 10, 5 e 1 dia, no dia e depois da data impressa
function alertaValidade(u) {
  if (!u.validade || ["utilizada", "descartada"].includes(u.situacao)) return null;
  const n = dias(hojeISO(), String(u.validade).slice(0, 10));
  if (n < 0) return { t: "DATA DA ETIQUETA VENCIDA", c: "al", n };
  if (n === 0) return { t: "VENCE HOJE", c: "al", n };
  if (n === 1) return { t: "VENCE AMANHÃ", c: "al", n };
  if (n <= 5) return { t: "Vence em " + n + " dias", c: "av", n };
  if (n <= 10) return { t: "Vence em " + n + " dias", c: "ne", n };
  return null;
}
// plasma no freezer sem a conferência do dia seguinte
// PFC: conferência no dia seguinte; CRIO: 6 horas depois do início do congelamento (fica pendente até alguém conferir)

// coloração (5.6): cor média do centro da foto; plasma esperado amarelo (sem tom vermelho nem verde)
let COR_AV = null;
async function avaliarCor(file) {
  const u = S.uni.find((x) => x.id === S.uniAberta), box = $("#corRes"); if (!u || !file || !box) return;
  const img = await new Promise((ok, erro) => { const url = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(url); ok(im); }; im.onerror = () => erro(new Error("Não consegui abrir a foto.")); im.src = url; }).catch((e) => { toast(e.message); return null; }); if (!img) return;
  const k = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight)), cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
  const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, cv.width, cv.height);
  const w = cv.width, h = cv.height, px = cx.getImageData(Math.round(w * 0.3), Math.round(h * 0.3), Math.max(1, Math.round(w * 0.4)), Math.max(1, Math.round(h * 0.4))).data;
  let R = 0, G = 0, B = 0, n = 0; for (let i = 0; i < px.length; i += 16) { R += px[i]; G += px[i + 1]; B += px[i + 2]; n++; } R /= n; G /= n; B /= n;
  const lum = (R + G + B) / 3, hsl = (() => { const r = R / 255, g = G / 255, b = B / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b); let hh = 0; if (mx !== mn) { const dd = mx - mn; hh = mx === r ? ((g - b) / dd) % 6 : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4; hh *= 60; if (hh < 0) hh += 360; } return hh; })();
  let resultado = "normal", motivo = "tom amarelado, dentro do padrão";
  if (lum < 45 || lum > 248) { resultado = "inadequada"; motivo = lum < 45 ? "foto escura demais" : "foto clara demais"; }
  else if (R - G > 45 && hsl < 30) { resultado = "fora"; motivo = "tom avermelhado (possível hemólise)"; }
  else if (hsl > 75 && hsl < 180 && G > R) { resultado = "fora"; motivo = "tom esverdeado"; }
  else if (lum < 90 && R > G) { resultado = "fora"; motivo = "cor escura (avaliar hemólise ou contaminação)"; }
  COR_AV = { b64: cv.toDataURL("image/jpeg", 0.8).split(",")[1], resultado, motivo, cor: { r: Math.round(R), g: Math.round(G), b: Math.round(B), h: Math.round(hsl) } };
  box.innerHTML = '<img src="data:image/jpeg;base64,' + COR_AV.b64 + '" style="max-width:100%;border-radius:10px;margin:8px 0"><p><span class="chip ' + (resultado === "normal" ? "ok" : "al") + '">' + (resultado === "normal" ? "Dentro do padrão" : resultado === "inadequada" ? "Foto inadequada" : "Fora do padrão") + "</span> " + esc(motivo) + "</p>" +
    (resultado === "inadequada" ? '<p><small>Tire outra foto com mais luz, sobre fundo branco.</small></p><button class="btn sec peq" data-a="corFoto">Tirar outra foto</button>' : '<p><small>A avaliação automática apoia, mas não descarta sozinha. ' + (resultado === "fora" ? "O Plínio recebe o aviso com a foto." : "") + '</small></p><div class="bts"><button class="btn peq" data-a="corSalvar">Registrar a avaliação</button><button class="btn sec peq" data-a="corFoto">Tirar outra foto</button></div>');
}

function calcFracionar() {

  document.addEventListener('input', function (e) { if (foco && e.target === foco) { clearTimeout(tRola); tRola = setTimeout(ajustar, 60); } }, true);

  vv.addEventListener('scroll', function () { if (foco) { clearTimeout(tRola); tRola = setTimeout(ajustar, 80); } });

// Painel CVH · colar uma foto copiada (print, WhatsApp, Fotos) em qualquer campo de foto das telas e módulos.
// Ao tocar num botão de foto, abre uma folha com "Colar a foto copiada" e "Tirar ou escolher foto";
// a foto colada entra no mesmo campo, como se tivesse sido escolhida, sem nenhuma alteração.
(function () {
  if (window.__cvhColar) return; window.__cvhColar = 1;
  var podeLer = !!(navigator.clipboard && navigator.clipboard.read) && typeof DataTransfer === 'function';
  var deFoto = function (el) { return el && el.tagName === 'INPUT' && el.type === 'file' && /image/i.test(el.accept || '') && !el.hasAttribute('capture'); };
  var css = '.cvh-colar{position:fixed;inset:0;background:rgba(43,35,32,.5);z-index:2147483000;display:flex;align-items:flex-end;justify-content:center;font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}' +
    '.cvh-colar .cx{background:#FBF8F4;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.2)}' +
    '@media (min-width:700px){.cvh-colar{align-items:center}.cvh-colar .cx{border-radius:18px}}' +
    '.cvh-colar h3{margin:0 0 10px;color:#5F130F;font-size:17px}.cvh-colar button{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin:0 0 8px;font:inherit;font-weight:700;cursor:pointer}' +
    '.cvh-colar .p{background:#5F130F;color:#fff}.cvh-colar .s{background:#fff;color:#5F130F;border:1px solid #E2D6C8}.cvh-colar .c{background:none;color:#6b5a52;font-weight:400}' +
    '.cvh-colar .st{font-size:13.5px;color:#A83D3D;min-height:18px;margin:2px 0 6px}';
  var folha = null;
  function fechar() { if (folha) { folha.remove(); folha = null; document.removeEventListener('paste', aoColar, true); } }
  function entregar(inp, arqs) {
    var dt = new DataTransfer(); arqs.forEach(function (f) { dt.items.add(f); });
    inp.files = dt.files; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
  }
  var alvo = null;
  function nomeArq(tipo) { var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); }; return 'Foto colada ' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + 'h' + p(d.getMinutes()) + '.' + (/png/.test(tipo) ? 'png' : /webp/.test(tipo) ? 'webp' : 'jpg'); }
  // Ctrl/Cmd+V com a folha aberta (computador)
  function aoColar(ev) {
    if (!alvo) return; var it = ev.clipboardData && ev.clipboardData.items ? [].slice.call(ev.clipboardData.items) : [], img = it.filter(function (i) { return i.kind === 'file' && /^image\//.test(i.type); })[0];
    if (!img) return; ev.preventDefault(); var b = img.getAsFile(), inp = alvo; fechar(); entregar(inp, [new File([b], nomeArq(b.type), { type: b.type })]);
  }
  async function colar(inp, st) {
    try {
      var itens = await navigator.clipboard.read();
      for (var i = 0; i < itens.length; i++) { var t = itens[i].types.filter(function (x) { return /^image\//.test(x); })[0]; if (t) { var b = await itens[i].getType(t); fechar(); entregar(inp, [new File([b], nomeArq(t), { type: t })]); return; } }
      st.textContent = 'Não há foto copiada. Copie a foto (no WhatsApp, em Fotos ou num print) e toque em Colar de novo.';
    } catch (e) { st.textContent = 'Não consegui colar. Permita colar quando o celular perguntar, ou use Tirar ou escolher foto.'; }
  }
  function abrir(inp) {
    alvo = inp; fechar();
    if (!document.getElementById('cvh-colar-css')) { var s = document.createElement('style'); s.id = 'cvh-colar-css'; s.textContent = css; document.head.appendChild(s); }
    folha = document.createElement('div'); folha.className = 'cvh-colar';
    var pdf = /pdf/i.test(inp.accept || '');
    folha.innerHTML = '<div class="cx" role="dialog" aria-modal="true"><h3>Adicionar foto</h3><p class="st"></p>' +
      (podeLer ? '<button class="p" data-c="colar">Colar a foto copiada</button>' : '') +
      '<button class="s" data-c="escolher">' + (pdf ? 'Tirar foto ou escolher arquivo' : 'Tirar ou escolher foto') + '</button><button class="c" data-c="cancelar">Cancelar</button></div>';
    document.body.appendChild(folha); document.addEventListener('paste', aoColar, true);

      var c = b.dataset.c;
      if (c === 'cancelar') return fechar();

  document.addEventListener('click', function (ev) {

// Puxar para baixo no alto da tela atualiza o app (busca a versão nova e recarrega), como nos apps do celular.
(function () {
  if (window.top !== window || window.__puxar) return; window.__puxar = 1;
  var y0 = null, x0 = 0, dy = 0, alvo = null, ind = null, LIM = 90;
  function rolagem(el) {
    for (var e = el; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
      var s = getComputedStyle(e); if (/(auto|scroll)/.test(s.overflowY) && e.scrollHeight > e.clientHeight + 2) return e;

  }
  function bloqueado(t) {
    if (!t || !t.closest) return true;

  }
  function mostrar(txt, p) {
    if (!ind) { ind = document.createElement('div'); ind.style.cssText = 'position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6px);z-index:99999;transform:translate(-50%,-60px);background:#EEE5DB;color:#5F130F;border:1px solid #C6B098;border-radius:999px;padding:7px 14px;font:600 13px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 4px 14px rgba(95,19,15,.15);pointer-events:none;transition:opacity .15s'; document.body.appendChild(ind); }
    ind.textContent = txt; ind.style.opacity = '1'; ind.style.transform = 'translate(-50%,' + Math.round(p) + 'px)';
  }
  function esconder() { if (ind) { ind.style.opacity = '0'; ind.style.transform = 'translate(-50%,-60px)'; } }
  document.addEventListener('touchstart', function (e) {
    y0 = null; dy = 0; if (e.touches.length !== 1 || bloqueado(e.target)) return;
    alvo = rolagem(e.target); if ((alvo.scrollTop || 0) > 0 || (window.scrollY || 0) > 0) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (y0 == null) return; var t = e.touches[0]; dy = t.clientY - y0;
    if (Math.abs(t.clientX - x0) > Math.abs(dy) || (alvo && alvo.scrollTop > 0)) { y0 = null; esconder(); return; }
    if (dy > 14) mostrar(dy > LIM ? 'Solte para atualizar' : '↓ Puxe para atualizar', Math.min(dy * 0.45, 46)); else esconder();
  }, { passive: true });
  document.addEventListener('touchend', function () {
    if (y0 == null) return; var ok = dy > LIM; y0 = null;
    if (!ok) { esconder(); return; }
    mostrar('Atualizando…', 40);
    var fim = function () { location.reload(); };
    try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(function (r) { return r && r.update(); }).catch(function () {}).then(fim); else fim(); } catch (_) { fim(); }
    setTimeout(fim, 2500);
  }, { passive: true });
})();
