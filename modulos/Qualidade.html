<!DOCTYPE html>

<style>

.ex-sug,.ex-fil{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;align-items:center}.ex-fil b{font-size:12px;color:var(--tinta2);margin-right:4px}.ex-sug button,.ex-fil button{border:1px solid var(--areia2);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--tinta2)}.ex-sug button.on,.ex-fil button.on{background:var(--vinho);border-color:var(--vinho);color:#fff}.ex-sel{margin-bottom:6px}.ex-leit{font-size:14.5px;margin:8px 0 2px;color:var(--tinta)}.ex-leit b{color:var(--vinho)}.ex-bol summary{cursor:pointer;font-size:13px;color:var(--vinho);font-weight:600;margin:4px 0}
.pl-cx{padding:12px}.pl-sc{overflow:auto;max-height:70vh;border:1px solid var(--areia2);border-radius:10px}
table.pl{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}

table.pl td.pf .pcel{font-style:italic;color:#6b5a52}
table.pl td.nr{background:#F4F1EE}table.pl td.nr .pcel::placeholder{color:#b3a59c;font-style:italic;font-size:11px}table.pl td.nr select.pcel{color:#9b8b82;font-style:italic}
table.pl tr td:nth-child(2),table.pl tr th.ph:nth-child(2){position:sticky;left:0;background:#fff;z-index:1;font-weight:700}
table.pl tr.pr td{background:var(--areia);color:var(--vinho);font-weight:700;font-size:11.5px;white-space:normal}
table.pl tr.pr.ref td{background:#fff}
.pcel{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 4px;font-size:12.5px;width:74px;text-align:center}

.formula{background:#fff;border:1px dashed var(--bege);border-radius:10px;padding:8px 10px;font-size:13.5px;margin:6px 0 10px}
.formula b{color:var(--vinho)}
.refs{font-size:12.5px;color:var(--tinta2);padding-left:18px;margin:4px 0}
.refs li{margin-bottom:5px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px}
.grade .larga{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--tinta2)}
input,select,textarea{font:inherit;font-size:15px;color:var(--tinta);border:1px solid var(--areia2);border-radius:10px;padding:8px 10px;background:#fff;width:100%;min-width:0}
.vals{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;font-size:12.5px}
.vals span{display:flex;justify-content:space-between;border-bottom:1px dotted #eadfd6;padding:2px 0}

.vals span.al1 b{color:var(--verm)}
.gaveta .vals{grid-template-columns:repeat(3,1fr)}@media (max-width:520px){.vals,.gaveta .vals{grid-template-columns:repeat(2,1fr)}}
.res{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.res .r{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border-radius:10px;padding:8px 10px;border:1px solid #f0e7df}
.res .r .n{font-size:13.5px}
.res .r .n small{display:block;color:var(--tinta2);font-size:11.5px}
.res .r .v{text-align:right;font-weight:700;color:var(--vinho);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:92%;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.vazio{padding:28px 14px;text-align:center;color:var(--tinta2)}
.fluxo text{font-family:inherit}
.fluxo .nd{cursor:pointer}
.fluxo .nd:hover rect,.fluxo .nd:hover path.cp{filter:brightness(.96)}
.nota{font-size:12.5px;color:var(--tinta2);margin:6px 0 0}
.carregando{padding:60px 10px;text-align:center;color:var(--tinta2)}
.lote td input{padding:5px 6px;font-size:13px;width:78px}
.lote td select{padding:5px 6px;font-size:13px}
@media print{.bts,.periodo,.abas,.veu,.gaveta{display:none!important}.cx{box-shadow:none;border:1px solid #ddd;break-inside:avoid}body{background:#fff}}
</style></head><body>
<div class="wrap" id="app"><div class="carregando">Carregando o controle de qualidade…</div></div>
<div class="veu" id="veu"></div>
<aside class="gaveta" id="gaveta" aria-hidden="true"><header><b id="gvT"></b><button type="button" id="gvX" aria-label="Fechar">×</button></header><div class="corpo" id="gvC"></div></aside>

<script>
"use strict";
const CTX = window.CVH_CTX || {};
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => { if (v == null || v === "") return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmt = (v, c) => v == null || !isFinite(v) ? "–" : v.toLocaleString("pt-BR", { minimumFractionDigits: c == null ? 1 : c, maximumFractionDigits: c == null ? 1 : c });
const br = (d) => d ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "";
const brc = (d) => d ? d.slice(8, 10) + "/" + d.slice(5, 7) : "";
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const mesTxt = (m) => MESES[+m.slice(5, 7) - 1] + "/" + m.slice(2, 4);
const hojeISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const ponte = (metodo, ...args) => {
  let f = null; try { f = window.parent.CVH_PONTE; } catch (e) { f = null; }
  if (typeof f !== "function") return Promise.reject(new Error("Abra o controle de qualidade pelo Painel CVH."));
  // a resposta vem de outra janela (o painel): vira texto e é remontada aqui, para não misturar objetos das duas janelas (o Safari se perde com isso)
  const copia = (r) => { try { return r == null ? r : JSON.parse(JSON.stringify(r)); } catch (e) { return r; } };
  return new Promise((ok, erro) => { try { Promise.resolve(f(metodo, JSON.parse(JSON.stringify(args)))).then((r) => ok(copia(r)), (e) => erro(new Error((e && e.message) || String(e)))); } catch (e) { erro(e); } });
};
const qc = (fn, ...a) => ponte("qc", fn, ...a);
let tT = null;
function toast(m, ms) { let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(() => { t.hidden = true; }, ms || 3500); }

/* ── estado ── */
const S = { P: null, padrao: null, regs: [], sag: [], sagP: {}, admin: !!CTX.admin, aba: "geral", periodo: "tudo", mes: "", doa: CTX.doacoes || [] };
const COMP = {
  ST: { n: "Sangue total", c: "#A83D3D" }, CH: { n: "Concentrado de hemácias", c: "#5F130F" }, CHD: { n: "CH desleucocitado", c: "#5F130F" },
  PFC: { n: "Plasma fresco congelado", c: "#C49A6C" }, PC: { n: "Plasma comum", c: "#C6B098" }, PIC: { n: "Plasma isento de crioprecipitado", c: "#C6B098" },
  CP: { n: "Concentrado de plaquetas", c: "#C49A6C" }, CRIO: { n: "Crioprecipitado", c: "#C6B098" }, DOA: { n: "Hemograma do doador", c: "#8E2B27" }
};
const doacaoDe = (b) => S.doa.find((d) => d.numero === b) || null;
const sagDe = (b) => S.sag.find((x) => x.bolsa === b) || null;
const regsDa = (b) => S.regs.filter((r) => r.bolsa === b);
const regDe = (b, c) => regsDa(b).filter((r) => r.componente === c).sort((x, y) => y.data.localeCompare(x.data))[0] || null;

/* ── volume da bolsa ── */
// CH: peso do CH com a bolsa (antes do SAG) menos a tara, dividido pela densidade, mais o SAG adicionado (peso final menos peso antes)
function volume(r) {
  const d = r.dados || {}, P = S.P, c = r.componente;
  if (num(d.volume) != null) return { v: num(d.volume), como: "volume informado" };
  if (c === "CH" || c === "CHD") {
    const s = sagDe(r.bolsa), pc = num(d.pesoAntesSag) != null ? num(d.pesoAntesSag) : s && num(s.pesoCH), pf = num(d.peso) != null ? num(d.peso) : s && num(s.pesoFinal);
    if (pc != null && pf != null) return { v: (pc - P.taraCH) / P.densCH + (pf - pc) / P.densSAG, como: "peso antes do SAG " + fmt(pc) + " g e depois " + fmt(pf) + " g (tara " + fmt(P.taraCH, 0) + " g)" };
    if (pf != null) return { v: (pf - P.taraCH) / P.densCH, como: "peso " + fmt(pf) + " g, tara " + fmt(P.taraCH, 0) + " g, densidade " + fmt(P.densCH, 2) };
    return null;
  }
  if (c === "CP") { const p = num(d.peso); return p == null ? null : { v: (p - P.taraCP) / P.densCP, como: "peso " + fmt(p, 0) + " g, tara " + fmt(P.taraCP, 0) + " g, densidade " + fmt(P.densCP, 2) }; }
  if (c === "ST") {
    const p = num(d.peso); if (p != null && P.taraST > 0) return { v: (p - P.taraST) / P.densST, como: "peso " + fmt(p, 0) + " g" };
    const doa = doacaoDe(r.bolsa), col = num(d.volumeColetado) != null ? num(d.volumeColetado) : doa && num(doa.volume);
    return col == null ? null : { v: col + P.anticoagulante, como: fmt(col, 0) + " mL coletados + " + fmt(P.anticoagulante, 0) + " mL de anticoagulante" };
  }
  const p = num(d.peso); return p == null ? null : { v: (p - P.taraPL) / P.densPL, como: "peso " + fmt(p, 0) + " g, tara " + fmt(P.taraPL, 0) + " g, densidade " + fmt(P.densPL, 2) };
}
const hm = (r, k) => { const h = (r && r.dados && r.dados.hemo) || {}; return num(h[k]); };
// hematócrito do CH: o micro-hematócrito vale mais que o do ProCyte, quando existe
function htCH(r) {
  const d = r.dados || {}, s = sagDe(r.bolsa), mi = num(d.microHt) != null ? num(d.microHt) : s && num(s.htFinalMicro);
  if (mi != null) return { v: mi, como: "micro-hematócrito", pro: hm(r, "HCT") };
  const p = hm(r, "HCT"); return p == null ? null : { v: p, como: "ProCyte One", pro: p };
}
/* ── itens do controle de qualidade (Tabela 4, ABVHMT 2024) ── */
const T4 = "Tabela 4 das Recomendações de Boas Práticas para Serviços de Hemoterapia Veterinária (ABVHMT, 2024)";
const ITENS = [
  { id: "ch_ht", comp: ["CH", "CHD"], nome: "Hematócrito", un: "%",
