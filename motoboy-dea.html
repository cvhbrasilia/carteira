<script>
// Painel CVH · ligação das telas com o servidor novo (substitui o google.script.run)
(function () {
  var API = 'https://nrgloiiqppamxmmvcoyl.supabase.co/functions/v1/api', q = new URLSearchParams(location.search);
  // mesmos endereços do Apps Script: ?painel=1, ?r=TOKEN (carteira), ?t=TOKEN (termo), ?v=CODIGO (verificação)
  if (q.get('t') && !/termo\.html$/.test(location.pathname)) { location.replace('termo.html' + location.search); return; }
  // links antigos do painel (?painel=1) abrem a página própria do painel, com ícone e nome do Painel CVH ao instalar
  if (q.get('painel') && !window.CVH_PAINEL) { location.replace('painel.html'); return; }
  // a carteira instalada no celular lembra o último animal aberto (como o site atual da carteira)
  var r = q.get('r') || '';
  if (!window.CVH_PAINEL && !window.CVH_CTN && !q.get('painel') && !(q.get('v') && String(q.get('v')).replace(/\s/g, '').length >= 8)) { try { if (r) localStorage.setItem('cvh_r', r); else r = localStorage.getItem('cvh_r') || ''; } catch (e) {} }
  window.BOOT = { modo: (window.CVH_PAINEL || q.get('painel')) ? 'painel' : (r ? 'responsavel' : 'nenhum'), token: r };
  // carteirinha do doador com ícone próprio: link ?c=CÓDIGO (só a carteirinha, sem a carteira de saúde); a instalada lembra o código
  if (window.CVH_CTN) { var c = q.get('c') || ''; try { if (c) localStorage.setItem('cvh_ct', c); else c = localStorage.getItem('cvh_ct') || ''; } catch (e) {} window.BOOT = { modo: c ? 'carteirinha' : 'nenhum', token: '', ct: c }; }
  var DRIVE = /https:\/\/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([A-Za-z0-9_-]{10,})(?:\/view|\/preview)?(?:\?[^"'\s<]*)?/g;
  function sessao() { try { return localStorage.getItem('cvh_s') || sessionStorage.getItem('cvh_s') || ''; } catch (e) { return ''; } }
  // links de arquivos (antes no Google Drive) passam a abrir pelo servidor novo
  // link de arquivo leva só a chave de arquivos (12 h), nunca a sessão do painel; sem a chave, cai na sessão (versões antigas)
  function chaveArq() { try { return localStorage.getItem('cvh_fs') || ''; } catch (e) { return ''; } }
  // fora do painel, o PDF leva a chave de PDFs da carteira (ou o código do termo): sem um link que ainda vale, o exame não abre
  var CHAVE_R = '';
  function linkResp() { try { var tt = new URLSearchParams(location.search).get('t') || ''; return (CHAVE_R ? '&fr=' + encodeURIComponent(CHAVE_R) : '') + (tt ? '&t=' + encodeURIComponent(tt) : ''); } catch (e) { return ''; } }
  function arquivo(id) { if (!window.CVH_PAINEL) return API + '?arquivo=' + encodeURIComponent(id) + linkResp(); var f = chaveArq(), s = f ? '' : sessao(); return API + '?arquivo=' + encodeURIComponent(id) + (f ? '&fs=' + encodeURIComponent(f) : s ? '&s=' + encodeURIComponent(s) : ''); }
  // links de arquivo do servidor chegam sem chave: cada tela põe a dela (painel: chave de arquivos; carteira: chave de PDFs)
  var ARQ = new RegExp(API.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&') + '\\?arquivo=([A-Za-z0-9_-]+)(?:&(?:s|fs|fr|t)=[^"&\\s#<]*)*', 'g');

      return chamar('moduloArquivo', args).then(function (nome) {
        return fetch('modulos/' + nome + '.html', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('Não consegui abrir o módulo.'); return r.text(); });

  }
  window.CVH_SERVIDOR = { api: API, chamar: chamar, arquivo: arquivo };
  // versão nova publicada: aparece um aviso pequeno, lá em cima, para recarregar (o app aberto não troca sozinho de versão)
  var VERSAO = '20261126123525';
  // o app instalado no iPhone às vezes recarrega a página guardada: abre o endereço com a versão nova no fim, que obriga a buscar de novo
  function recarregar(v) { try { var u = new URL(location.href); u.searchParams.set('atualizado', v); location.replace(u.toString()); } catch (e) { location.reload(); } }
  if (q.get('atualizado')) { try { var u0 = new URL(location.href); u0.searchParams.delete('atualizado'); history.replaceState(history.state, '', u0.toString()); } catch (e) {} }
  function conferirVersao() {
    if (document.hidden) return;
    fetch('versao.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (v) {
      v = String(v || '').trim(); if (!v || v === VERSAO || document.getElementById('cvhVersao')) return;
      // o Cartão doador só mostra o cartão: troca de versão sozinho, sem pedir toque
      if (window.CVH_CTN) { recarregar(v); return; }
      var d = document.createElement('button'); d.id = 'cvhVersao'; d.type = 'button'; d.textContent = 'Há uma versão nova do app. Toque para atualizar.';
      d.style.cssText = 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:9999;background:#5F130F;color:#fff;border:0;border-radius:12px;padding:8px 14px;font:600 13px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:min(94vw,620px);white-space:nowrap';
      d.onclick = function () { recarregar(v); }; document.body.appendChild(d);
    }).catch(function () {});
  }
  setInterval(conferirVersao, 180000);
  document.addEventListener('visibilitychange', conferirVersao);
  // ao abrir o app, o número vermelho do ícone some (os avisos foram vistos)
  function limparIcone() { if (document.hidden) return; try { if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (e) {} try { navigator.serviceWorker && navigator.serviceWorker.getRegistration().then(function (r) { if (r && r.getNotifications) r.getNotifications().then(function (L) { L.forEach(function (n) { n.close(); }); }); }); } catch (e) {} }
  document.addEventListener('visibilitychange', limparIcone); window.addEventListener('focus', limparIcone); setTimeout(limparIcone, 1500);
  // notificações: o service worker só existe no painel
  if (window.CVH_PAINEL && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
  // ?v= é a verificação de receita e laudo (código de 12 caracteres); nos links do painel e do motoboy, ?v=2 é só a versão da prévia do WhatsApp
  if (q.get('v') && !window.CVH_PAINEL && String(q.get('v')).replace(/\s/g, '').length >= 8) {
    chamar('verificacaoHtml', [q.get('v')]).then(function (h) { h = String(h).split('__API_URL__').join(API); document.open(); document.write(h); document.close(); },
      function (e) { document.body.textContent = e.message; });
  }
})();

<script>
// Painel CVH · campo de digitação sempre visível acima do teclado do celular (vale para todas as telas e módulos).
// O iPhone não rola a tela quando o campo está no fim da página ou dentro de um módulo: aqui o sistema abre espaço
// embaixo e sobe o campo para o meio da parte visível, e repete enquanto o teclado abre ou muda de tamanho.
(function () {
  if (window.__cvhTeclado) return; window.__cvhTeclado = 1;
  var topo = window; try { if (window.top && window.top.document) topo = window.top; } catch (e) { topo = window; }
  var vv = topo.visualViewport; if (!vv) return;
  var ESPACO = 'cvh-kb-espaco', foco = null, tSai = null, tRola = null;
  function campo(el) { return el && (/^(TEXTAREA|SELECT)$/.test(el.tagName) || (el.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|reset|file|range|color|hidden)$/i.test(el.type || ''))) || (el && el.isContentEditable); }
  function rolador(el) {
    for (var p = el.parentElement; p && p !== document.body && p !== document.documentElement; p = p.parentElement) {
      // painéis que rolam de verdade (tela, folha, gaveta); tabelas com rolagem lateral ficam de fora
      var s = getComputedStyle(p); if (/(auto|scroll)/.test(s.overflowY) && p.clientHeight >= window.innerHeight * 0.4) return p;
    }

  }
  // altura que o teclado ocupa na tela do aparelho
  function alturaTeclado() { return Math.max(0, topo.innerHeight - vv.height - vv.offsetTop); }
  // posição do topo deste documento dentro da tela (módulos rodam numa moldura dentro do painel)
  function deslocamento() { var y = 0, w = window; try { while (w !== topo && w.frameElement) { y += w.frameElement.getBoundingClientRect().top; w = w.parent; } } catch (e) {} return y; }
  function abrirEspaco(r, h) {
    var esp = r.querySelector(':scope > .' + ESPACO);
    if (!esp) { esp = document.createElement('div'); esp.className = ESPACO; esp.setAttribute('aria-hidden', 'true'); esp.style.cssText = 'display:block;width:1px;pointer-events:none;flex:none'; (r === document.scrollingElement || r === document.documentElement ? document.body : r).appendChild(esp); }
    esp.style.height = Math.round(h) + 'px';
  }
  function fecharEspaco() { var L = document.querySelectorAll('.' + ESPACO); for (var i = 0; i < L.length; i++) L[i].remove(); }
  function ajustar() {
    if (!foco || !document.contains(foco)) return;
    var kb = alturaTeclado(); if (kb < 80) return; // sem teclado aberto (computador ou teclado externo)
    var r = rolador(foco); abrirEspaco(r, kb + 40);
    var b = foco.getBoundingClientRect(), off = deslocamento();
    var visTopo = vv.offsetTop + 8, visFim = vv.offsetTop + vv.height - 12;
    var cTopo = off + b.top, cFim = off + Math.min(b.bottom, b.top + 140);
    // campo escondido pelo teclado ou acima da área visível: leva o campo para perto do meio da parte visível
    if (cFim > visFim || cTopo < visTopo) {
      var alvo = visTopo + (visFim - visTopo) * 0.38, delta = cTopo - alvo;
      if (r === document.scrollingElement || r === document.documentElement) window.scrollBy(0, delta); else r.scrollTop += delta;
    }
  }
  function agendar() { clearTimeout(tRola); ajustar(); tRola = setTimeout(ajustar, 120); setTimeout(ajustar, 320); setTimeout(ajustar, 650); }
  document.addEventListener('focusin', function (e) { if (!campo(e.target)) return; clearTimeout(tSai); foco = e.target; agendar(); }, true);
  document.addEventListener('focusout', function () { tSai = setTimeout(function () { if (!campo(document.activeElement)) { foco = null; fecharEspaco(); } }, 250); }, true);
  // ao digitar (texto que quebra linha, sugestões que aparecem) o campo continua visível
  document.addEventListener('input', function (e) { if (foco && e.target === foco) { clearTimeout(tRola); tRola = setTimeout(ajustar, 60); } }, true);
  vv.addEventListener('resize', function () { if (foco) agendar(); });
  vv.addEventListener('scroll', function () { if (foco) { clearTimeout(tRola); tRola = setTimeout(ajustar, 80); } });
})();

// Painel CVH · colar uma foto copiada (print, WhatsApp, Fotos) em qualquer campo de foto das telas e módulos.
// Ao tocar num botão de foto, abre uma folha com "Colar a foto copiada" e "Tirar ou escolher foto";
// a foto colada entra no mesmo campo, como se tivesse sido escolhida, sem nenhuma alteração.
(function () {
  if (window.__cvhColar) return; window.__cvhColar = 1;
  var podeLer = !!(navigator.clipboard && navigator.clipboard.read) && typeof DataTransfer === 'function';
  var deFoto = function (el) { return el && el.tagName === 'INPUT' && el.type === 'file' && /image/i.test(el.accept || '') && !el.hasAttribute('capture'); };
  var css = '.cvh-colar{position:fixed;inset:0;background:rgba(43,35,32,.5);z-index:2147483000;display:flex;align-items:flex-end;justify-content:center;font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}' +
    '.cvh-colar .cx{background:#FBF8F4;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.2)}' +
    '@media (min-width:700px){.cvh-colar{align-items:center}.cvh-colar .cx{border-radius:18px}}' +
    '.cvh-colar h3{margin:0 0 10px;color:#5F130F;font-size:17px}.cvh-colar button{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin:0 0 8px;font:inherit;font-weight:700;cursor:pointer}' +
    '.cvh-colar .p{background:#5F130F;color:#fff}.cvh-colar .s{background:#fff;color:#5F130F;border:1px solid #E2D6C8}.cvh-colar .c{background:none;color:#6b5a52;font-weight:400}' +
    '.cvh-colar .st{font-size:13.5px;color:#A83D3D;min-height:18px;margin:2px 0 6px}';
  var folha = null;
  function fechar() { if (folha) { folha.remove(); folha = null; document.removeEventListener('paste', aoColar, true); } }
  function entregar(inp, arqs) {
    var dt = new DataTransfer(); arqs.forEach(function (f) { dt.items.add(f); });
    inp.files = dt.files; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
  }
  var alvo = null;
  function nomeArq(tipo) { var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); }; return 'Foto colada ' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + 'h' + p(d.getMinutes()) + '.' + (/png/.test(tipo) ? 'png' : /webp/.test(tipo) ? 'webp' : 'jpg'); }
  // Ctrl/Cmd+V com a folha aberta (computador)
  function aoColar(ev) {
    if (!alvo) return; var it = ev.clipboardData && ev.clipboardData.items ? [].slice.call(ev.clipboardData.items) : [], img = it.filter(function (i) { return i.kind === 'file' && /^image\//.test(i.type); })[0];
    if (!img) return; ev.preventDefault(); var b = img.getAsFile(), inp = alvo; fechar(); entregar(inp, [new File([b], nomeArq(b.type), { type: b.type })]);
  }
  async function colar(inp, st) {
    try {
      var itens = await navigator.clipboard.read();
      for (var i = 0; i < itens.length; i++) { var t = itens[i].types.filter(function (x) { return /^image\//.test(x); })[0]; if (t) { var b = await itens[i].getType(t); fechar(); entregar(inp, [new File([b], nomeArq(t), { type: t })]); return; } }
      st.textContent = 'Não há foto copiada. Copie a foto (no WhatsApp, em Fotos ou num print) e toque em Colar de novo.';
    } catch (e) { st.textContent = 'Não consegui colar. Permita colar quando o celular perguntar, ou use Tirar ou escolher foto.'; }
  }
  function abrir(inp) {
    alvo = inp; fechar();
    if (!document.getElementById('cvh-colar-css')) { var s = document.createElement('style'); s.id = 'cvh-colar-css'; s.textContent = css; document.head.appendChild(s); }
    folha = document.createElement('div'); folha.className = 'cvh-colar';
    var pdf = /pdf/i.test(inp.accept || '');
    folha.innerHTML = '<div class="cx" role="dialog" aria-modal="true"><h3>Adicionar foto</h3><p class="st"></p>' +
      (podeLer ? '<button class="p" data-c="colar">Colar a foto copiada</button>' : '') +
      '<button class="s" data-c="escolher">' + (pdf ? 'Tirar foto ou escolher arquivo' : 'Tirar ou escolher foto') + '</button><button class="c" data-c="cancelar">Cancelar</button></div>';
    document.body.appendChild(folha); document.addEventListener('paste', aoColar, true);
    var st = folha.querySelector('.st');
    folha.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-c]'); if (!b) { if (ev.target === folha) fechar(); return; }
      var c = b.dataset.c;
      if (c === 'cancelar') return fechar();
      if (c === 'colar') return colar(inp, st);
      if (c === 'escolher') { fechar(); inp.__cvhDireto = 1; inp.click(); }
    });
  }
  // toque no campo de foto (pelo botão, pelo rótulo ou por .click() no código): a folha abre antes do seletor do celular
  document.addEventListener('click', function (ev) {
    var inp = ev.target; if (!deFoto(inp)) return;
    if (inp.__cvhDireto) { inp.__cvhDireto = 0; return; }
    ev.preventDefault(); ev.stopPropagation(); abrir(inp);
  }, true);
})();

</script>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Motoboy DEA+</title>
<style>
:root{--vinho:#5F130F;--verm:#A83D3D;--cara:#C49A6C;--bege:#C6B098;--areia:#EEE5DB;--areia2:#E2D6C8;--papel:#FBF8F4;--tinta:#2b2320;--tinta2:#6b5a52;--ok:#2F6B45}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.topo{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.topo h1{margin:0;font-size:21px;color:var(--vinho)}
.topo h1 small{display:block;font-size:12.5px;font-weight:600;color:var(--tinta2)}
.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--vinho);color:#fff;font-weight:700}
.btn.sec{background:#fff;color:var(--vinho);border:1px solid var(--areia2)}
.btn.peq{padding:8px 12px;font-size:14px;border-radius:11px}
.btn.grande{width:100%;padding:18px;font-size:18px;margin-bottom:10px}
.btn.perigo{background:#fff;color:var(--verm);border:1px solid #e3b9b4}
.btn:disabled{opacity:.45}

.cx{background:#fff;border:1px solid var(--areia2);border-radius:16px;padding:14px;margin-bottom:12px}
.cx h2{margin:0 0 8px;font-size:16px;color:var(--vinho)}
.cx.al{border-color:#e3b9b4;background:#fdf3f1}
.cx.av{border-color:#ecd7b3;background:#fdf8ef}
.bolsa{border-top:1px solid var(--areia);padding:10px 0}
.bolsa:first-of-type{border-top:0}
.bolsa b{font-size:16.5px}
.bolsa small{display:block;color:var(--tinta2)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;background:var(--areia);color:var(--tinta2);margin-left:4px}
.tag.ok{background:#e4efe7;color:var(--ok)}.tag.al{background:#f7dedb;color:var(--verm)}.tag.av{background:#f6ead3;color:#8a5a12}
.relogio{font-variant-numeric:tabular-nums;font-weight:800}
.relogio.al{color:var(--verm)}
.vazio{color:var(--tinta2);text-align:center;padding:14px}
label{display:block;font-size:13.5px;font-weight:700;color:var(--tinta2);margin:10px 0 4px}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;border:1px solid var(--areia2);border-radius:12px;padding:12px;background:#fff}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--areia2);border-radius:12px;padding:11px;margin-top:8px;font-weight:600}
.op input{margin-top:3px;transform:scale(1.25)}
#veu{position:fixed;inset:0;background:rgba(43,35,32,.5);z-index:20;display:none}
#veu.on{display:block}
#modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:16px;z-index:21;display:none}
#modal.on{display:block}
#modal h2{margin:0 0 6px;color:var(--vinho);font-size:18px}
#cam{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}
#cam.on{display:flex}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#cam .mira{position:absolute;left:50%;top:40%;width:62vmin;height:62vmin;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.85);border-radius:18px;pointer-events:none}
#cam .base{background:#fff;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
#cam .base p{margin:0 0 8px;font-weight:700;color:var(--vinho)}
#cam .linha{display:flex;gap:8px}
#cam .linha input{flex:1}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:8px 14px;border-radius:14px;z-index:40;width:max-content;max-width:min(94vw,620px);font-weight:500;font-size:13px;line-height:1.35;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.22)}
#alarme{position:fixed;inset:0;background:var(--verm);color:#fff;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#alarme h2{font-size:24px;margin:8px 0}
#alarme .btn{background:#fff;color:var(--verm);margin-top:16px;padding:16px 28px;font-size:18px}
.etapa{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2)}
.agora{border-radius:14px;padding:12px;margin:10px 0;font-weight:700;background:var(--areia)}
.agora.av{background:#f6ead3;color:#7a4e0b}.agora.al{background:var(--verm);color:#fff}.agora.ok{background:#e4efe7;color:var(--ok)}
.dest{font-size:24px;font-weight:800;color:var(--vinho);line-height:1.15;margin:4px 0}
.addr{color:var(--tinta2)}
.obs{background:#fdf8ef;border-left:4px solid var(--cara);padding:8px 10px;border-radius:8px;margin-top:8px}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--areia);color:var(--vinho);margin:2px 4px 2px 0}
.chip.red{background:var(--verm);color:#fff}
.cx.urg{border:2px solid var(--verm)}
.timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--vinho)}
.svc{display:flex;gap:10px;align-items:center;border:1px solid var(--areia2);border-radius:12px;padding:12px;margin-top:8px;font-weight:700}
.svc input{transform:scale(1.4)}
.svc.feito{background:#e4efe7}
.prox{display:flex;gap:10px;align-items:center;border-top:1px solid var(--areia);padding:10px 0}
.num{width:30px;height:30px;border-radius:50%;background:var(--areia);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.num.red{background:var(--verm);color:#fff}.num.ok{background:#e4efe7;color:var(--ok)}
.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--areia2);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:15}
.dock button{border:0;background:none;font-weight:700;font-size:13px;color:var(--vinho);padding:6px 8px}
.banner{background:var(--verm);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.banner ul{margin:6px 0 10px;padding-left:20px}
.qr{width:min(70vw,280px);height:auto;display:block;margin:10px auto}
.kmin{font-size:28px!important;text-align:center;font-weight:800}
.warnbox{background:#fdf8ef;border:1px solid #ecd7b3;border-radius:12px;padding:10px;margin-top:10px}
.errbox{background:#fdf3f1;border:1px solid #e3b9b4;color:var(--verm);border-radius:12px;padding:10px;margin-top:10px;font-weight:600}
.infobox{background:var(--areia);border-radius:12px;padding:10px;margin-top:10px}
.foto-bt{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--bege);border-radius:14px;padding:14px;font-weight:700;color:var(--vinho);cursor:pointer;margin-top:10px}
.foto-bt input{display:none}
.mini{width:84px;height:84px;object-fit:cover;border-radius:10px;margin:6px 6px 0 0}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t td{border-bottom:1px solid var(--areia);padding:6px 4px}

      msg.innerHTML = '<div class="warnbox"><b>Confira a leitura</b>' + av.map((x) => "<p>" + esc(x) + "</p>").join("") + (pedeJust ? '<label>Justificativa (obrigatória)</label><textarea id="kJust" rows="2"></textarea>' : "") + '<button class="btn" style="width:100%" id="kConf">O valor ' + fKm(km) + " km está correto</button></div>";
      if (usaSug) mostrarEd();
      $("#kConf").onclick = () => { if (pedeJust) { just = ($("#kJust").value || "").trim(); if (just.length < 5) return toast("Escreva a justificativa."); } confirmou = true; salvar(km, just); };
      return;
    }
    salvar(km, just);
  };
  const salvar = async (km, just) => {
    ocupado = true; $("#kMsg").innerHTML = '<div class="infobox">Salvando…</div>';
    try { await o.ok({ km, foto: foto ? foto.split(",")[1] : null, just }); fechar(); somOk(); await carregar(); }
    catch (e) { ocupado = false; $("#kMsg").innerHTML = '<div class="errbox">' + esc(e.message || "Não foi possível salvar.") + "</div>"; }
  };
  if ($("#kOkSug")) $("#kOkSug").onclick = () => enviar(true);
  $("#kOk").onclick = () => enviar(false);
  $("#kKm").onkeydown = (e) => { if (e.key === "Enter") enviar(false); };
}

/* ── ações ── */
const A = {

  base() { const ul = ultima(); folhaKm({ titulo: "Voltar para a base", sub: esc(D.base.nome), sugestao: ul ? +ul.km : null, botao: "Iniciar retorno", ok: (x) => srv("motoParada", null, "base", x) }); },
  pausa() { const a = ativa(), ul = ultima(); folhaKm({ titulo: "Pausa para uso pessoal", sub: "O que for rodado durante a pausa não conta como despesa do " + (D.empresa || "CVH") + ".", sugestao: a && a.status === "em_deslocamento" ? null : (ul ? +ul.km : null), botao: "Iniciar pausa", extra: '<label>Motivo</label><div class="bts" id="kMot"><button class="btn peq" data-m="Uso pessoal">Uso pessoal</button><button class="btn sec peq" data-m="Intervalo">Intervalo</button><button class="btn sec peq" data-m="Outro">Outro</button></div>' + (a && a.status === "em_deslocamento" ? '<div class="warnbox">O deslocamento para ' + esc(a.nome) + " será interrompido e a parada volta para a fila.</div>" : ""), ok: (x) => srv("motoExpediente", "pausa", Object.assign(x, { motivo: (document.querySelector("#kMot .btn:not(.sec)") || {}).dataset ? document.querySelector("#kMot .btn:not(.sec)").dataset.m : "Uso pessoal" })) });
    document.querySelectorAll("#kMot button").forEach((b) => { b.onclick = () => document.querySelectorAll("#kMot button").forEach((x) => x.classList.toggle("sec", x !== b)); }); },
  retomar() { folhaKm({ titulo: "Retomar serviço", sub: "Informe a quilometragem atual.", foto: "opc", botao: "Retomar", ok: (x) => srv("motoExpediente", "retomar", x) }); },
  async finalizar() { const a = ativa(); if (a && a.status === "em_deslocamento") return toast("Registre a chegada ao destino antes de finalizar.", 4000); const n = fila().length;
    folhaKm({ titulo: "Finalizar expediente", sub: (n ? "Ainda há " + n + " parada(s) pendente(s). " : "") + "Informe a quilometragem final e fotografe o hodômetro.", foto: "obrig", botao: "Finalizar expediente", ok: async (x) => { const e = await srv("motoExpediente", "finalizar", Object.assign(x, { gps: await gps() })); setTimeout(() => { const t = e.resumo || {}; modal('<h2>Expediente finalizado</h2><table class="t"><tr><td>Profissional</td><td><b>' + fKm(t.prof) + " km</b></td></tr><tr><td>Particular</td><td>" + fKm(t.pes) + " km</td></tr><tr><td>Não comprovado</td><td>" + fKm(t.nc) + " km</td></tr></table>"); }, 300); } }); },
  abastecer() {
    const ul = ultima();
    modal('<h2>Registrar abastecimento</h2><label>Litros</label><input type="text" inputmode="decimal" id="aL"><label>Valor pago (R$)</label><input type="text" inputmode="decimal" id="aV"><label>Quem pagou</label><div class="bts" id="aPg"><button class="btn peq" data-p="cvh">' + esc(D.empresa || "CVH") + '</button><button class="btn sec peq" data-p="motoboy">Eu paguei</button></div><label class="op"><input type="checkbox" id="aCheio"> Tanque cheio</label><label>Quilometragem do hodômetro (opcional)</label><input type="text" inputmode="decimal" id="aKm" placeholder="' + (ul ? esc(fKm(ul.km)) : "") + '"><label class="foto-bt">Fotografar o comprovante' + (D.cfg.fotoAbastecimento === false ? " (opcional)" : " (obrigatório)") + '<input type="file" accept="image/*" capture="environment" id="aFoto"></label><div id="aTh"></div><div id="aMsg"></div><div class="bts"><button class="btn" id="aOk">Salvar</button></div>');
    let foto = null; document.querySelectorAll("#aPg button").forEach((b) => { b.onclick = () => document.querySelectorAll("#aPg button").forEach((x) => x.classList.toggle("sec", x !== b)); });
    $("#aFoto").onchange = async (ev) => { const f = ev.target.files[0]; if (f) { foto = await lerFoto(f); $("#aTh").innerHTML = '<img class="mini" src="' + foto + '">'; } };
    $("#aOk").onclick = async () => { try { if (!foto && D.cfg.fotoAbastecimento !== false) { $("#aMsg").innerHTML = '<div class="errbox">Fotografe o comprovante do abastecimento. Ele garante o preço e o valor pago.</div>'; return; } $("#aOk").disabled = true; await srv("motoExpediente", "abastecimento", { litros: $("#aL").value, valor: $("#aV").value, pagoPor: document.querySelector("#aPg .btn:not(.sec)").dataset.p, cheio: $("#aCheio").checked, km: parseKm($("#aKm").value), foto: foto ? foto.split(",")[1] : null }); fechar(); somOk(); toast("Abastecimento registrado."); carregar(); } catch (e) { $("#aOk").disabled = false; $("#aMsg").innerHTML = '<div class="errbox">' + esc(e.message) + "</div>"; } };
  },
  meuDia() {
    const e = expAberto() || (D.expedientes || []).find((x) => String(x.data) === hoje()); const L = e ? leituras(e) : [], t = e ? totais(e) : null;
    const NOME = { inicio_expediente: "Início do expediente", saida: "Saída", chegada: "Chegada", pausa_inicio: "Início de pausa", pausa_fim: "Retomada", abastecimento: "Abastecimento", fim_expediente: "Fim do expediente" };
    modal("<h2>Meu dia</h2>" + (t ? '<table class="t"><tr><td>Profissional</td><td><b>' + fKm(t.prof) + " km</b></td></tr><tr><td>Particular</td><td>" + fKm(t.pes) + " km</td></tr><tr><td>Não comprovado</td><td>" + fKm(t.nc) + " km</td></tr></table>" : "<p>Nenhum expediente hoje.</p>") +

    if (faltam.length && sv.length > 1) { modal('<h2>Confirmar serviço</h2><p>Nem todos os itens foram marcados.</p><div class="bts" style="flex-direction:column"><button class="btn" id="cTodos">Todos foram realizados</button><button class="btn sec" id="cParte">Alguns não foram realizados</button></div><div id="cObs"></div>');
      $("#cTodos").onclick = async () => { fechar(); await srv("motoParada", v, "confirmar", {}); somOk(); carregar(); };

      return; }
    b.disabled = true; await srv("motoParada", v, "confirmar", {}); somOk(); toast("Serviço confirmado."); await carregar();
  },
};
let ULT = lsGet("cvh_moto_ult", 0);
async function carregar(silencio) {
  if (!K) { $("#app").innerHTML = '<div class="cx"><h2>Aparelho não ativado</h2><p>Copie o link de ativação enviado pela administração e cole aqui. Também dá para abrir o link no navegador e adicionar à tela de início de novo.</p><input type="text" id="atvLink" placeholder="Cole o link aqui" style="width:100%;font-size:16px;padding:12px;border:1px solid #E2D6C8;border-radius:10px;margin:8px 0"><button class="btn" id="atvBt" style="width:100%">Ativar este celular</button></div>';
    // o app da tela de início do iPhone tem memória separada do navegador: o link colado aqui ativa o próprio app
    $("#atvBt").onclick = () => { const v = $("#atvLink").value.trim(), m = /[?&]k=([A-Za-z0-9]+)/.exec(v), k = m ? m[1] : /^[A-Za-z0-9]{16,}$/.test(v) ? v : ""; if (!k) { alert("Esse não parece um link de ativação."); return; } try { localStorage.setItem("cvh_moto_k", k); const s2 = /[?&]s=(recepcao|internacao)/.exec(v); if (s2) localStorage.setItem("cvh_int_setor", s2[1]); } catch (e) {} K = k; carregar(); };
    return; }
  try {
    const antes = D; D = await srv("motoDados"); nomeApp(D.conta || "", D.empresa);
    const novos = (D.avisos || []).filter((x) => x.id > ULT).sort((a, b) => a.id - b.id);
    if (novos.length) { ULT = novos[novos.length - 1].id; lsSet("cvh_moto_ult", ULT); if (antes) { const c = novos.filter((x) => x.nivel === "critico"); if (c.length) alarme(c[c.length - 1].titulo, c[c.length - 1].corpo); else { somAviso(); toast(novos[novos.length - 1].titulo + " · " + novos[novos.length - 1].corpo, 8000); } } }
    if (antes) for (const r of D.remessas || []) { const r0 = (antes.remessas || []).find((x) => x.id === r.id) || {}; if (r.recebida_em && !r0.recebida_em) { somOk(); toast("QR lido pela Intensivet · caixa " + r.id, 8000); } }
    if (!$("#modal").classList.contains("on")) pintar();
  } catch (e) {
    if (/APARELHO/.test(e.message)) { try { localStorage.removeItem("cvh_moto_k"); } catch (_) {} K = ""; return carregar(); }
    if (!silencio) toast(e.message || String(e), 6000);
    if (!D) $("#app").innerHTML = '<div class="cx vazio">Sem conexão com o servidor. <div class="bts" style="justify-content:center"><button class="btn" data-a="atualizar">Tentar de novo</button></div></div>';
  }
}
setInterval(() => carregar(true), 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar(true); });
document.addEventListener("change", async (ev) => {
  const el = ev.target; if (!el.dataset || !el.dataset.a) return;
  try {
    if (el.dataset.a === "svc") { await srv("motoParada", el.dataset.v, "servico", { i: +el.dataset.i, feito: el.checked }); await carregar(true); }

  } catch (e) { toast(e.message || String(e), 6000); }
});
document.addEventListener("click", async (ev) => {
  if (ev.target.id === "veu") return fechar();

    if (a === "notif") { await ativarNotif(); toast("Notificações ativadas.", 4000); return pintar(); }
    if (a === "ciente") { await srv("motoCiente"); return carregar(); }
    if (a === "agora") { await srv("motoParada", v, "fazerAgora", {}); return carregar(); }
    if (a === "confirmar") return A.confirmar(v, b);
    if (A[a]) return A[a](v, b);
  } catch (e) { toast(e.message || String(e), 7000); b.disabled = false; }
