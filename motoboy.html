// Painel CVH · ligação das telas com o servidor novo (substitui o google.script.run)
(function () {
  var API = 'https://nrgloiiqppamxmmvcoyl.supabase.co/functions/v1/api', q = new URLSearchParams(location.search);
  // mesmos endereços do Apps Script: ?painel=1, ?r=TOKEN (carteira), ?t=TOKEN (termo), ?v=CODIGO (verificação)
  if (q.get('t') && !/termo\.html$/.test(location.pathname)) { location.replace('termo.html' + location.search); return; }
  // links antigos do painel (?painel=1) abrem a página própria do painel, com ícone e nome do Painel CVH ao instalar
  if (q.get('painel') && !window.CVH_PAINEL) { location.replace('painel.html'); return; }
  // a carteira instalada no celular lembra o último animal aberto (como o site atual da carteira)
  var r = q.get('r') || '';
  if (!window.CVH_PAINEL && !q.get('painel') && !q.get('v')) { try { if (r) localStorage.setItem('cvh_r', r); else r = localStorage.getItem('cvh_r') || ''; } catch (e) {} }
  window.BOOT = { modo: (window.CVH_PAINEL || q.get('painel')) ? 'painel' : (r ? 'responsavel' : 'nenhum'), token: r };
  var DRIVE = /https:\/\/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([A-Za-z0-9_-]{10,})(?:\/view|\/preview)?(?:\?[^"'\s<]*)?/g;
  function sessao() { try { return sessionStorage.getItem('cvh_s') || ''; } catch (e) { return ''; } }
  // links de arquivos (antes no Google Drive) passam a abrir pelo servidor novo
  function arquivo(id) { var s = sessao(); return API + '?arquivo=' + encodeURIComponent(id) + (s ? '&s=' + encodeURIComponent(s) : ''); }
  function reescrever(x) {
    if (typeof x === 'string') return x.indexOf('drive.google.com') >= 0 ? x.replace(DRIVE, function (_, id) { return arquivo(id); }) : x;
    if (Array.isArray(x)) return x.map(reescrever);
    if (x && typeof x === 'object') { var o = {}; for (var k in x) o[k] = reescrever(x[k]); return o; }
    return x;
  }
  function chamar(fn, args) {
    args = JSON.parse(JSON.stringify(args || []));
    if (fn === 'moduloHtml') {
      // o servidor confere a permissão; o módulo vem do próprio site
      return chamar('moduloArquivo', args).then(function (nome) {
        return fetch('modulos/' + nome + '.html', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('Não consegui abrir o módulo.'); return r.text(); });
      });
    }
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json().catch(function () { throw new Error('O servidor não respondeu (' + r.status + '). Tente de novo.'); }); },
        function () { throw new Error('Sem conexão com o servidor. Confira a internet e tente de novo.'); })
      .then(function (r) { if (!r.ok) throw new Error(r.erro || 'Erro no servidor.'); return reescrever(r.r); });
  }
  window.CVH_SERVIDOR = { api: API, chamar: chamar, arquivo: arquivo };
  // notificações: o service worker só existe no painel
  if (window.CVH_PAINEL && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
  if (q.get('v')) {
    chamar('verificacaoHtml', [q.get('v')]).then(function (h) { document.open(); document.write(h); document.close(); },
      function (e) { document.body.textContent = e.message; });
  }
})();

</script>

	if (num.length === undefined) {

		offset++;

	for (var i = 0; i < num.length - offset; i++) {

/* ── aparelho do motoboy: ativado pelo link do CVH ── */
let K = "";
try { const q = new URLSearchParams(location.search); if (q.get("k")) { localStorage.setItem("cvh_moto_k", q.get("k")); history.replaceState(null, "", location.pathname); } K = localStorage.getItem("cvh_moto_k") || ""; } catch (e) {}
const srv = (fn, ...a) => window.CVH_SERVIDOR.chamar(fn, [K, ...a]);

/* ── sons: aviso suave e alarme insistente para alta prioridade ── */
let AUD = null;
function somLiberar() { try { AUD = AUD || new (window.AudioContext || window.webkitAudioContext)(); if (AUD.state === "suspended") AUD.resume(); } catch (e) {} }
document.addEventListener("pointerdown", somLiberar, { passive: true });
function tom(f, ini, dur, vol, tipo) { if (!AUD) return; const o = AUD.createOscillator(), g = AUD.createGain(), t = AUD.currentTime + ini; o.type = tipo || "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(AUD.destination); o.start(t); o.stop(t + dur + 0.05); }
function somAviso() { tom(659.3, 0, 0.9, 0.22); tom(880, 0.18, 1.2, 0.2); }
function somOk() { tom(784, 0, 0.35, 0.18); tom(1046.5, 0.12, 0.5, 0.16); }
let ALARME = null;
function alarme(titulo, corpo) {
  if ($("#alarme")) $("#alarme").remove(); clearInterval(ALARME);
  const ov = document.createElement("div"); ov.id = "alarme"; ov.innerHTML = "<div><b>ALTA PRIORIDADE</b><h2>" + esc(titulo) + "</h2><p>" + esc(corpo) + '</p><button class="btn" id="alOk">Entendi</button></div>'; document.body.appendChild(ov);
  const ciclo = () => { for (let i = 0; i < 4; i++) { tom(853, i * 0.5, 0.24, 0.35, "square"); tom(960, i * 0.5 + 0.25, 0.24, 0.35, "square"); } if (navigator.vibrate) navigator.vibrate([600, 200, 600, 200, 600]); };
  ciclo(); ALARME = setInterval(ciclo, 2600);
  $("#alOk").onclick = () => { clearInterval(ALARME); ov.remove(); if (navigator.vibrate) navigator.vibrate(0); };
}

/* ── notificações com o app fechado ── */
async function ativarNotif() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) throw new Error(/iPhone|iPad/.test(navigator.userAgent) ? "No iPhone, adicione esta página à tela de início (Compartilhar, Adicionar à Tela de Início) e abra por lá para ativar as notificações." : "Este navegador não recebe notificações.");
  somLiberar(); const p = await Notification.requestPermission(); if (p !== "granted") throw new Error("Permissão de notificação não concedida.");
  const reg = await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
  const chave = await window.CVH_SERVIDOR.chamar("pushChave", []); if (!chave) throw new Error("O servidor ainda não tem a chave das notificações.");
  const b = Uint8Array.from(atob(chave.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((chave.length + 3) % 4)), (c) => c.charCodeAt(0));
  let sub = await reg.pushManager.getSubscription(); if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b });
  await srv("apPushAssinar", sub.toJSON());
}
const notifOk = () => { try { return "Notification" in window && Notification.permission === "granted"; } catch (e) { return false; } };
try { if (navigator.serviceWorker) { navigator.serviceWorker.register("sw.js").catch(() => {}); navigator.serviceWorker.addEventListener("message", () => carregar(true)); } } catch (e) {}

/* ── o que o motoboy vê em cada etapa (23.2) ── */
const ROT = { possivel: "Possível atendimento", autorizado: "Atendimento autorizado", pago: "Venda confirmada", testes: "Laudo em elaboração", fracionamento: "Bolsa em preparo", preparo: "Embalagem em preparação", pronta: "Pronto para retirada", retirada: "Em entrega", entregue: "Entregue · aguardando a leitura do QR", concluido: "Concluído",
  amostraBuscada: "Amostra buscada", amostraEntregue: "Amostra entregue no CVH", amostraChegou: "Amostra chegou no CVH", retirei: "Caixa retirada", entreguei: "Entrega registrada", aberto: "Atendimento aberto", uber: "Mudou para Uber", uberFim: "Corrida encerrada" };
const maps = (a) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(a.endereco || a.destino);
let D = null;
function cartao(a) {
  const am = a.amostra || {}, r = (D.remessas || []).find((x) => x.id === a.remessa_id);
  let agora = "", cls = "", bt = "";
  const B = (acao, t, c) => '<button class="btn grande ' + (c || "") + '" data-a="acao" data-id="' + esc(a.id) + '" data-v="' + acao + '">' + t + "</button>";
  if (a.etapa === "possivel") agora = "Há um possível atendimento. Ainda não é necessário se deslocar.";
  if (a.etapa === "autorizado") agora = "Atendimento autorizado, aguardando a confirmação do pagamento. Ainda não precisa se deslocar.";
  if (["pago", "testes", "fracionamento", "preparo"].includes(a.etapa) && am.buscar && !am.buscadaEm) { cls = "av"; agora = "Buscar a amostra em " + (am.local || "local a combinar") + (am.prazoBusca ? " até " + hora(am.prazoBusca) : "") + "."; bt = B("amostraBuscada", "Busquei a amostra"); }
  else if (["pago", "testes", "fracionamento", "preparo"].includes(a.etapa) && am.buscar && am.buscadaEm && !am.chegouEm) { cls = "av"; agora = "Leve a amostra ao CVH."; bt = B("amostraEntregue", "Entreguei a amostra no CVH"); }
  else if (a.etapa === "pago") agora = "Venda confirmada. Amostra no CVH." + (am.previsaoTestes ? " Testes previstos para " + hora(am.previsaoTestes) + "." : "");
  if (a.etapa === "testes" && !bt) { cls = "av"; agora = "Os testes terminaram e a equipe está emitindo o laudo. Fique atento: a retirada está próxima."; }
  if (a.etapa === "fracionamento" && !bt) { cls = "al"; agora = "A bolsa da entrega já está em preparo. Programe-se para ir ao CVH."; }
  if (a.etapa === "preparo" && !bt) { cls = "al"; agora = "A embalagem está sendo preparada no CVH."; }
  if (a.etapa === "pronta") { cls = "al"; agora = "PRONTO PARA RETIRADA no CVH. Destino " + a.destino + (a.endereco ? ", " + a.endereco : "") + "."; bt = B("retirei", "Retirei a caixa"); }
  if (a.etapa === "retirada") { cls = "av"; agora = "Leve até " + a.destino + (a.endereco ? ", " + a.endereco : "") + "."; bt = '<a class="btn grande sec" href="' + maps(a) + '" target="_blank" rel="noopener">Abrir no mapa</a>' + B("entreguei", a.remessa_id ? "Entreguei · enviar QR" : "Entreguei"); }
  if (a.etapa === "entregue") {
    if (r && r.recebida_em) { cls = "ok"; agora = "QR lido pela Intensivet · caixa " + r.id + " às " + hora(r.recebida_em).split(" às ")[1] + ". Obrigado."; }
    else { cls = "av"; agora = "Mostre este QR para a recepção ou a internação ler antes de abrir a caixa."; bt = (a.remessa_id ? qrSvg(a.remessa_id) + '<p style="text-align:center;font-size:22px;font-weight:800;letter-spacing:.08em">' + esc(a.remessa_id) + '</p><button class="btn grande sec" data-a="compartilhar" data-v="' + esc(a.remessa_id) + '">Enviar o código da caixa</button>' : ""); }
  }
  if (a.etapa === "concluido") { cls = "ok"; agora = "Concluído."; }
  const linha = (a.linha || []).slice(-6).map((x) => esc(ROT[x.etapa] || x.etapa) + " · " + esc(hora(x.em))).join("<br>");
  return '<div class="cx"><div class="etapa">' + esc(ROT[a.etapa] || a.etapa) + "</div><h2>" + esc(a.destino) + "</h2>" + (a.endereco ? '<small><a href="' + maps(a) + '" target="_blank" rel="noopener">' + esc(a.endereco) + "</a></small>" : "") + (a.paciente ? "<p>Paciente " + esc(a.paciente) + "</p>" : "") +
    '<div class="agora ' + cls + '">' + esc(agora) + "</div>" + bt + '<div class="linha">' + linha + "</div></div>";
}
function pintar() {
  if (!D) return;
  const ativos = (D.atendimentos || []).filter((a) => a.etapa !== "concluido"), feitos = (D.atendimentos || []).filter((a) => a.etapa === "concluido");
  const ord = ["pronta", "retirada", "entregue", "fracionamento", "preparo", "testes", "pago", "autorizado", "possivel"];
  ativos.sort((a, b) => ord.indexOf(a.etapa) - ord.indexOf(b.etapa));
  $("#app").innerHTML = '<div class="topo"><h1>Transporte CVH<small>' + esc(D.aparelho.nome) + '</small></h1><button class="btn sec peq" data-a="atualizar">Atualizar</button></div>' +
    (notifOk() ? "" : '<div class="cx av"><p>Ative as notificações para receber os avisos com o aplicativo fechado.</p><button class="btn" data-a="notif">Ativar notificações</button></div>') +
    (ativos.length ? ativos.map(cartao).join("") : '<div class="cx vazio">Nenhum atendimento no momento.</div>') +
    (feitos.length ? '<div class="cx"><h2>Concluídos hoje</h2>' + feitos.map((a) => "<p>" + esc(a.destino) + " · " + esc(hora(a.entregue_em)) + "</p>").join("") + "</div>" : "") +
    '<p class="notif">Dúvidas, fale com o CVH.</p>';
}
let ULT = 0;
try { ULT = +localStorage.getItem("cvh_moto_ult") || 0; } catch (e) {}
async function carregar(silencio) {
  if (!K) { $("#app").innerHTML = '<div class="cx"><h2>Aparelho não ativado</h2><p>Abra neste celular o link de ativação enviado pelo CVH.</p></div>'; return; }
  try {
    const antes = D; D = await srv("motoDados");
    const novos = (D.avisos || []).filter((x) => x.id > ULT).sort((a, b) => a.id - b.id);
    if (novos.length) { ULT = novos[novos.length - 1].id; try { localStorage.setItem("cvh_moto_ult", String(ULT)); } catch (e) {} if (antes) { const c = novos.filter((x) => x.nivel === "critico"); if (c.length) alarme(c[c.length - 1].titulo, c[c.length - 1].corpo); else { somAviso(); toast(novos[novos.length - 1].titulo + " · " + novos[novos.length - 1].corpo, 8000); } } }
    if (antes) for (const a of D.atendimentos || []) { const r = (D.remessas || []).find((x) => x.id === a.remessa_id), r0 = ((antes.remessas || []).find((x) => x.id === a.remessa_id) || {}); if (r && r.recebida_em && !r0.recebida_em) { somOk(); toast("QR lido pela Intensivet · caixa " + r.id, 8000); } }
    if (!$("#modal").classList.contains("on")) pintar();
  } catch (e) {
    if (/APARELHO/.test(e.message)) { try { localStorage.removeItem("cvh_moto_k"); } catch (_) {} K = ""; return carregar(); }
    if (!silencio) toast(e.message || String(e), 6000);
    if (!D) $("#app").innerHTML = '<div class="cx vazio">Sem conexão com o CVH. <div class="bts" style="justify-content:center"><button class="btn" data-a="atualizar">Tentar de novo</button></div></div>';
  }
}
setInterval(() => carregar(true), 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar(true); });
document.addEventListener("click", async (ev) => {
  if (ev.target.id === "veu") return fechar();
  const b = ev.target.closest("[data-a]"); if (!b) return; const a = b.dataset.a;
  try {
    if (a === "atualizar") { await carregar(); return toast("Atualizado.", 1500); }
    if (a === "notif") { await ativarNotif(); toast("Notificações ativadas.", 4000); return pintar(); }
    if (a === "acao") { b.disabled = true; await srv("motoAcao", b.dataset.id, b.dataset.v); somOk(); await carregar(); return; }
    if (a === "compartilhar") { const t = "Caixa do CVH " + b.dataset.v + ". Leia o QR da caixa no aplicativo do CVH ou digite este código."; if (navigator.share) await navigator.share({ text: t }); else { await navigator.clipboard.writeText(t); toast("Código copiado."); } return; }
  } catch (e) { if (e && e.name === "AbortError") return; toast(e.message || String(e), 7000); b.disabled = false; }
});
carregar();
</script>
