<script>

  // carteirinha do doador com ícone próprio: link ?c=CÓDIGO (só a carteirinha, sem a carteira de saúde); a instalada lembra o código
  if (window.CVH_CTN) { var c = q.get('c') || ''; try { if (c) localStorage.setItem('cvh_ct', c); else c = localStorage.getItem('cvh_ct') || ''; } catch (e) {} window.BOOT = { modo: c ? 'carteirinha' : 'nenhum', token: '', ct: c }; }

  // link de arquivo leva só a chave de arquivos (12 h), nunca a sessão do painel; sem a chave, cai na sessão (versões antigas)
  function chaveArq() { try { return localStorage.getItem('cvh_fs') || ''; } catch (e) { return ''; } }
  // fora do painel, o PDF leva a chave de PDFs da carteira (ou o código do termo): sem um link que ainda vale, o exame não abre
  var CHAVE_R = '';

      return chamar('moduloArquivo', args).then(function (nome) {

  // versão nova publicada: aparece um aviso pequeno, lá em cima, para recarregar (o app aberto não troca sozinho de versão)
  var VERSAO = '20261126180839';
  // o app instalado no iPhone às vezes recarrega a página guardada: abre o endereço com a versão nova no fim, que obriga a buscar de novo
  function recarregar(v) { try { var u = new URL(location.href); u.searchParams.set('atualizado', v); location.replace(u.toString()); } catch (e) { location.reload(); } }
  if (q.get('atualizado')) { try { var u0 = new URL(location.href); u0.searchParams.delete('atualizado'); history.replaceState(history.state, '', u0.toString()); } catch (e) {} }

    fetch('versao.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (v) {

      d.style.cssText = 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:9999;background:#5F130F;color:#fff;border:0;border-radius:12px;padding:8px 14px;font:600 13px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:min(94vw,620px);white-space:nowrap';

  }

  // ao abrir o app, o número vermelho do ícone some (os avisos foram vistos)
  function limparIcone() { if (document.hidden) return; try { if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (e) {} try { navigator.serviceWorker && navigator.serviceWorker.getRegistration().then(function (r) { if (r && r.getNotifications) r.getNotifications().then(function (L) { L.forEach(function (n) { n.close(); }); }); }); } catch (e) {} }

  if (window.CVH_PAINEL && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
  // ?v= é a verificação de receita e laudo (código de 12 caracteres); nos links do painel e do motoboy, ?v=2 é só a versão da prévia do WhatsApp
  if (q.get('v') && !window.CVH_PAINEL && String(q.get('v')).replace(/\s/g, '').length >= 8) {
    chamar('verificacaoHtml', [q.get('v')]).then(function (h) { h = String(h).split('__API_URL__').join(API); document.open(); document.write(h); document.close(); },
      function (e) { document.body.textContent = e.message; });
  }
})();

<script>
// Painel CVH · campo de digitação sempre visível acima do teclado do celular (vale para todas as telas e módulos).
// O iPhone não rola a tela quando o campo está no fim da página ou dentro de um módulo: aqui o sistema abre espaço
// embaixo e sobe o campo para o meio da parte visível, e repete enquanto o teclado abre ou muda de tamanho.
(function () {
  if (window.__cvhTeclado) return; window.__cvhTeclado = 1;
  var topo = window; try { if (window.top && window.top.document) topo = window.top; } catch (e) { topo = window; }

  var ESPACO = 'cvh-kb-espaco', foco = null, tSai = null, tRola = null;
  function campo(el) { return el && (/^(TEXTAREA|SELECT)$/.test(el.tagName) || (el.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|reset|file|range|color|hidden)$/i.test(el.type || ''))) || (el && el.isContentEditable); }
  function rolador(el) {
    for (var p = el.parentElement; p && p !== document.body && p !== document.documentElement; p = p.parentElement) {

    if (!esp) { esp = document.createElement('div'); esp.className = ESPACO; esp.setAttribute('aria-hidden', 'true'); esp.style.cssText = 'display:block;width:1px;pointer-events:none;flex:none'; (r === document.scrollingElement || r === document.documentElement ? document.body : r).appendChild(esp); }

  function fecharEspaco() { var L = document.querySelectorAll('.' + ESPACO); for (var i = 0; i < L.length; i++) L[i].remove(); }

  document.addEventListener('input', function (e) { if (foco && e.target === foco) { clearTimeout(tRola); tRola = setTimeout(ajustar, 60); } }, true);

  vv.addEventListener('scroll', function () { if (foco) { clearTimeout(tRola); tRola = setTimeout(ajustar, 80); } });
})();

// Painel CVH · colar uma foto copiada (print, WhatsApp, Fotos) em qualquer campo de foto das telas e módulos.
// Ao tocar num botão de foto, abre uma folha com "Colar a foto copiada" e "Tirar ou escolher foto";
// a foto colada entra no mesmo campo, como se tivesse sido escolhida, sem nenhuma alteração.
(function () {

    '.cvh-colar .cx{background:#FBF8F4;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.2)}' +
    '@media (min-width:700px){.cvh-colar{align-items:center}.cvh-colar .cx{border-radius:18px}}' +
    '.cvh-colar h3{margin:0 0 10px;color:#5F130F;font-size:17px}.cvh-colar button{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin:0 0 8px;font:inherit;font-weight:700;cursor:pointer}' +
    '.cvh-colar .p{background:#5F130F;color:#fff}.cvh-colar .s{background:#fff;color:#5F130F;border:1px solid #E2D6C8}.cvh-colar .c{background:none;color:#6b5a52;font-weight:400}' +
    '.cvh-colar .st{font-size:13.5px;color:#A83D3D;min-height:18px;margin:2px 0 6px}';
  var folha = null;
  function fechar() { if (folha) { folha.remove(); folha = null; document.removeEventListener('paste', aoColar, true); } }
  function entregar(inp, arqs) {
    var dt = new DataTransfer(); arqs.forEach(function (f) { dt.items.add(f); });

  }

  function nomeArq(tipo) { var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); }; return 'Foto colada ' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + 'h' + p(d.getMinutes()) + '.' + (/png/.test(tipo) ? 'png' : /webp/.test(tipo) ? 'webp' : 'jpg'); }

  function aoColar(ev) {
    if (!alvo) return; var it = ev.clipboardData && ev.clipboardData.items ? [].slice.call(ev.clipboardData.items) : [], img = it.filter(function (i) { return i.kind === 'file' && /^image\//.test(i.type); })[0];
    if (!img) return; ev.preventDefault(); var b = img.getAsFile(), inp = alvo; fechar(); entregar(inp, [new File([b], nomeArq(b.type), { type: b.type })]);
  }

    try {
      var itens = await navigator.clipboard.read();
      for (var i = 0; i < itens.length; i++) { var t = itens[i].types.filter(function (x) { return /^image\//.test(x); })[0]; if (t) { var b = await itens[i].getType(t); fechar(); entregar(inp, [new File([b], nomeArq(t), { type: t })]); return; } }
      st.textContent = 'Não há foto copiada. Copie a foto (no WhatsApp, em Fotos ou num print) e toque em Colar de novo.';
    } catch (e) { st.textContent = 'Não consegui colar. Permita colar quando o celular perguntar, ou use Tirar ou escolher foto.'; }
  }
  function abrir(inp) {
    alvo = inp; fechar();
    if (!document.getElementById('cvh-colar-css')) { var s = document.createElement('style'); s.id = 'cvh-colar-css'; s.textContent = css; document.head.appendChild(s); }
    folha = document.createElement('div'); folha.className = 'cvh-colar';
    var pdf = /pdf/i.test(inp.accept || '');
    folha.innerHTML = '<div class="cx" role="dialog" aria-modal="true"><h3>Adicionar foto</h3><p class="st"></p>' +
      (podeLer ? '<button class="p" data-c="colar">Colar a foto copiada</button>' : '') +
      '<button class="s" data-c="escolher">' + (pdf ? 'Tirar foto ou escolher arquivo' : 'Tirar ou escolher foto') + '</button><button class="c" data-c="cancelar">Cancelar</button></div>';

    folha.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-c]'); if (!b) { if (ev.target === folha) fechar(); return; }
      var c = b.dataset.c;
      if (c === 'cancelar') return fechar();

  document.addEventListener('click', function (ev) {

    ev.preventDefault(); ev.stopPropagation(); abrir(inp);
  }, true);
})();

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Mini Estação CVH</title>
<style>
:root{--vinho:#5F130F;--verm:#A83D3D;--cara:#C49A6C;--bege:#C6B098;--areia:#EEE5DB;--areia2:#E2D6C8;--papel:#FBF8F4;--tinta:#2b2320;--tinta2:#6b5a52;--ok:#2F6B45}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.topo{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.topo h1{margin:0;font-size:21px;color:var(--vinho)}
.topo h1 small{display:block;font-size:12.5px;font-weight:600;color:var(--tinta2)}
.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--vinho);color:#fff;font-weight:700}
.btn.sec{background:#fff;color:var(--vinho);border:1px solid var(--areia2)}
.btn.peq{padding:8px 12px;font-size:14px;border-radius:11px}
.btn.grande{width:100%;padding:18px;font-size:18px;margin-bottom:10px}
.btn.perigo{background:#fff;color:var(--verm);border:1px solid #e3b9b4}
.btn:disabled{opacity:.45}
.bts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cx{background:#fff;border:1px solid var(--areia2);border-radius:16px;padding:14px;margin-bottom:12px}
.cx h2{margin:0 0 8px;font-size:16px;color:var(--vinho)}
.cx.al{border-color:#e3b9b4;background:#fdf3f1}
.cx.av{border-color:#ecd7b3;background:#fdf8ef}
.bolsa{border-top:1px solid var(--areia);padding:10px 0}
.bolsa:first-of-type{border-top:0}

<script>
"use strict";
const $ = (q) => document.querySelector(q);

/* ── aparelho: o link do CVH (?k=…) ativa este celular; depois o endereço fica limpo ── */
let K = "";
try { const q = new URLSearchParams(location.search); if (q.get("k")) { localStorage.setItem("cvh_int_k", q.get("k")); } K = localStorage.getItem("cvh_int_k") || ""; } catch (e) {}

const nomeSalvo = () => { try { return localStorage.getItem("cvh_int_nome") || ""; } catch (e) { return ""; } };

/* ── sons (Web Audio): aviso suave e alarme insistente; o primeiro toque na tela libera o som ── */
let AUD = null;

const SILENCIO = {};
// plaqueta: aviso crítico piscando (na caixa a caminho, na chegada e a cada 2 h enquanto estiver aqui)

  document.body.appendChild(ov); somLiberar();
  const ciclo = () => { for (let i = 0; i < 3; i++) { tom(988, i * 0.45, 0.2, 0.32, "square"); tom(740, i * 0.45 + 0.22, 0.2, 0.32, "square"); } if (navigator.vibrate) navigator.vibrate([500, 200, 500]); };

}
const CP_PERG = { aberta: "" };

/* ── notificações com o app fechado (caixa a caminho, alertas) ── */

  });

let TESTE_ESC = null;

  return new Promise(async (resolve) => {
    const cam = $("#cam"), v = cam.querySelector("video"); $("#camT").textContent = titulo; $("#camTxt").value = ""; cam.classList.add("on");
    let fluxo = null, vivo = true, det = null, jq = null; const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
