<script>
// Painel CVH · ligação das telas com o servidor novo (substitui o google.script.run)
(function () {
  var API = 'https://nrgloiiqppamxmmvcoyl.supabase.co/functions/v1/api', q = new URLSearchParams(location.search);
  // mesmos endereços do Apps Script: ?painel=1, ?r=TOKEN (carteira), ?t=TOKEN (termo), ?v=CODIGO (verificação)
  if (q.get('t') && !/termo\.html$/.test(location.pathname)) { location.replace('termo.html' + location.search); return; }
  // links antigos do painel (?painel=1) abrem a página própria do painel, com ícone e nome do Painel CVH ao instalar
  if (q.get('painel') && !window.CVH_PAINEL) { location.replace('painel.html'); return; }
  // a carteira instalada no celular lembra o último animal aberto (como o site atual da carteira)
  var r = q.get('r') || '';
  if (!window.CVH_PAINEL && !window.CVH_CTN && !q.get('painel') && !(q.get('v') && String(q.get('v')).replace(/\s/g, '').length >= 8)) { try { if (r) localStorage.setItem('cvh_r', r); else r = localStorage.getItem('cvh_r') || ''; } catch (e) {} }
  window.BOOT = { modo: (window.CVH_PAINEL || q.get('painel')) ? 'painel' : (r ? 'responsavel' : 'nenhum'), token: r };
  // carteirinha do doador com ícone próprio: link ?c=CÓDIGO (só a carteirinha, sem a carteira de saúde); a instalada lembra o código
  if (window.CVH_CTN) { var c = q.get('c') || ''; try { if (c) localStorage.setItem('cvh_ct', c); else c = localStorage.getItem('cvh_ct') || ''; } catch (e) {} window.BOOT = { modo: c ? 'carteirinha' : 'nenhum', token: '', ct: c }; }
  var DRIVE = /https:\/\/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([A-Za-z0-9_-]{10,})(?:\/view|\/preview)?(?:\?[^"'\s<]*)?/g;
  function sessao() { try { return localStorage.getItem('cvh_s') || sessionStorage.getItem('cvh_s') || ''; } catch (e) { return ''; } }
  // links de arquivos (antes no Google Drive) passam a abrir pelo servidor novo
  // link de arquivo leva só a chave de arquivos (12 h), nunca a sessão do painel; sem a chave, cai na sessão (versões antigas)
  function chaveArq() { try { return localStorage.getItem('cvh_fs') || ''; } catch (e) { return ''; } }
  // fora do painel, o PDF leva a chave de PDFs da carteira (ou o código do termo): sem um link que ainda vale, o exame não abre
  var CHAVE_R = '';
  function linkResp() { try { var tt = new URLSearchParams(location.search).get('t') || ''; return (CHAVE_R ? '&fr=' + encodeURIComponent(CHAVE_R) : '') + (tt ? '&t=' + encodeURIComponent(tt) : ''); } catch (e) { return ''; } }
  function arquivo(id) { if (!window.CVH_PAINEL) return API + '?arquivo=' + encodeURIComponent(id) + linkResp(); var f = chaveArq(), s = f ? '' : sessao(); return API + '?arquivo=' + encodeURIComponent(id) + (f ? '&fs=' + encodeURIComponent(f) : s ? '&s=' + encodeURIComponent(s) : ''); }
  // links de arquivo do servidor chegam sem chave: cada tela põe a dela (painel: chave de arquivos; carteira: chave de PDFs)
  var ARQ = new RegExp(API.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&') + '\\?arquivo=([A-Za-z0-9_-]+)(?:&(?:s|fs|fr|t)=[^"&\\s#<]*)*', 'g');
  function reescrever(x) {
    if (typeof x === 'string') { if (x.indexOf('drive.google.com') >= 0) x = x.replace(DRIVE, function (_, id) { return arquivo(id); }); return x.indexOf('?arquivo=') >= 0 ? x.replace(ARQ, function (_, id) { return arquivo(id); }) : x; }
    if (Array.isArray(x)) return x.map(reescrever);
    if (x && typeof x === 'object') { var o = {}; for (var k in x) o[k] = reescrever(x[k]); return o; }
    return x;
  }
  function chamar(fn, args) {
    args = JSON.parse(JSON.stringify(args || []));
    if (fn === 'moduloHtml') {
      // o servidor confere a permissão; o módulo vem do próprio site
      return chamar('moduloArquivo', args).then(function (nome) {
        return fetch('modulos/' + nome + '.html', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('Não consegui abrir o módulo.'); return r.text(); });
      });
    }
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json().catch(function () { throw new Error('O servidor não respondeu (' + r.status + '). Tente de novo.'); }); },
        function () { throw new Error('Sem conexão com o servidor. Confira a internet e tente de novo.'); })
      .then(function (r) { if (!r.ok) throw new Error(r.erro || 'Erro no servidor.'); if (fn === 'carteiraPublica' && r.r && r.r.chaveArquivos) CHAVE_R = r.r.chaveArquivos; return reescrever(r.r); });
  }
  window.CVH_SERVIDOR = { api: API, chamar: chamar, arquivo: arquivo };
  // versão nova publicada: aparece um aviso pequeno, lá em cima, para recarregar (o app aberto não troca sozinho de versão)
  var VERSAO = '20261126123132';
  // o app instalado no iPhone às vezes recarrega a página guardada: abre o endereço com a versão nova no fim, que obriga a buscar de novo
  function recarregar(v) { try { var u = new URL(location.href); u.searchParams.set('atualizado', v); location.replace(u.toString()); } catch (e) { location.reload(); } }
  if (q.get('atualizado')) { try { var u0 = new URL(location.href); u0.searchParams.delete('atualizado'); history.replaceState(history.state, '', u0.toString()); } catch (e) {} }
  function conferirVersao() {
    if (document.hidden) return;
    fetch('versao.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (v) {
      v = String(v || '').trim(); if (!v || v === VERSAO || document.getElementById('cvhVersao')) return;
      // o Cartão doador só mostra o cartão: troca de versão sozinho, sem pedir toque
      if (window.CVH_CTN) { recarregar(v); return; }
      var d = document.createElement('button'); d.id = 'cvhVersao'; d.type = 'button'; d.textContent = 'Há uma versão nova do app. Toque para atualizar.';
      d.style.cssText = 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:9999;background:#5F130F;color:#fff;border:0;border-radius:12px;padding:8px 14px;font:600 13px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:min(94vw,620px);white-space:nowrap';
      d.onclick = function () { recarregar(v); }; document.body.appendChild(d);
    }).catch(function () {});
  }
  setInterval(conferirVersao, 180000);
  document.addEventListener('visibilitychange', conferirVersao);
  // ao abrir o app, o número vermelho do ícone some (os avisos foram vistos)
  function limparIcone() { if (document.hidden) return; try { if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (e) {} try { navigator.serviceWorker && navigator.serviceWorker.getRegistration().then(function (r) { if (r && r.getNotifications) r.getNotifications().then(function (L) { L.forEach(function (n) { n.close(); }); }); }); } catch (e) {} }
  document.addEventListener('visibilitychange', limparIcone); window.addEventListener('focus', limparIcone); setTimeout(limparIcone, 1500);
  // notificações: o service worker só existe no painel
  if (window.CVH_PAINEL && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
  // ?v= é a verificação de receita e laudo (código de 12 caracteres); nos links do painel e do motoboy, ?v=2 é só a versão da prévia do WhatsApp
  if (q.get('v') && !window.CVH_PAINEL && String(q.get('v')).replace(/\s/g, '').length >= 8) {
    chamar('verificacaoHtml', [q.get('v')]).then(function (h) { h = String(h).split('__API_URL__').join(API); document.open(); document.write(h); document.close(); },
      function (e) { document.body.textContent = e.message; });
  }
})();

</script>
<script>
// Painel CVH · campo de digitação sempre visível acima do teclado do celular (vale para todas as telas e módulos).
// O iPhone não rola a tela quando o campo está no fim da página ou dentro de um módulo: aqui o sistema abre espaço
// embaixo e sobe o campo para o meio da parte visível, e repete enquanto o teclado abre ou muda de tamanho.
(function () {
  if (window.__cvhTeclado) return; window.__cvhTeclado = 1;
  var topo = window; try { if (window.top && window.top.document) topo = window.top; } catch (e) { topo = window; }
  var vv = topo.visualViewport; if (!vv) return;
  var ESPACO = 'cvh-kb-espaco', foco = null, tSai = null, tRola = null;
  function campo(el) { return el && (/^(TEXTAREA|SELECT)$/.test(el.tagName) || (el.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|reset|file|range|color|hidden)$/i.test(el.type || ''))) || (el && el.isContentEditable); }
  function rolador(el) {
    for (var p = el.parentElement; p && p !== document.body && p !== document.documentElement; p = p.parentElement) {
      // painéis que rolam de verdade (tela, folha, gaveta); tabelas com rolagem lateral ficam de fora
      var s = getComputedStyle(p); if (/(auto|scroll)/.test(s.overflowY) && p.clientHeight >= window.innerHeight * 0.4) return p;
    }
    return document.scrollingElement || document.documentElement;
  }
  // altura que o teclado ocupa na tela do aparelho
  function alturaTeclado() { return Math.max(0, topo.innerHeight - vv.height - vv.offsetTop); }
  // posição do topo deste documento dentro da tela (módulos rodam numa moldura dentro do painel)
  function deslocamento() { var y = 0, w = window; try { while (w !== topo && w.frameElement) { y += w.frameElement.getBoundingClientRect().top; w = w.parent; } } catch (e) {} return y; }
  function abrirEspaco(r, h) {
    var esp = r.querySelector(':scope > .' + ESPACO);
    if (!esp) { esp = document.createElement('div'); esp.className = ESPACO; esp.setAttribute('aria-hidden', 'true'); esp.style.cssText = 'display:block;width:1px;pointer-events:none;flex:none'; (r === document.scrollingElement || r === document.documentElement ? document.body : r).appendChild(esp); }
    esp.style.height = Math.round(h) + 'px';
  }
  function fecharEspaco() { var L = document.querySelectorAll('.' + ESPACO); for (var i = 0; i < L.length; i++) L[i].remove(); }
  function ajustar() {
    if (!foco || !document.contains(foco)) return;
    var kb = alturaTeclado(); if (kb < 80) return; // sem teclado aberto (computador ou teclado externo)
    var r = rolador(foco); abrirEspaco(r, kb + 40);
    var b = foco.getBoundingClientRect(), off = deslocamento();
    var visTopo = vv.offsetTop + 8, visFim = vv.offsetTop + vv.height - 12;
    var cTopo = off + b.top, cFim = off + Math.min(b.bottom, b.top + 140);
    // campo escondido pelo teclado ou acima da área visível: leva o campo para perto do meio da parte visível
    if (cFim > visFim || cTopo < visTopo) {
      var alvo = visTopo + (visFim - visTopo) * 0.38, delta = cTopo - alvo;
      if (r === document.scrollingElement || r === document.documentElement) window.scrollBy(0, delta); else r.scrollTop += delta;
    }
  }
  function agendar() { clearTimeout(tRola); ajustar(); tRola = setTimeout(ajustar, 120); setTimeout(ajustar, 320); setTimeout(ajustar, 650); }
  document.addEventListener('focusin', function (e) { if (!campo(e.target)) return; clearTimeout(tSai); foco = e.target; agendar(); }, true);
  document.addEventListener('focusout', function () { tSai = setTimeout(function () { if (!campo(document.activeElement)) { foco = null; fecharEspaco(); } }, 250); }, true);
  // ao digitar (texto que quebra linha, sugestões que aparecem) o campo continua visível
  document.addEventListener('input', function (e) { if (foco && e.target === foco) { clearTimeout(tRola); tRola = setTimeout(ajustar, 60); } }, true);
  vv.addEventListener('resize', function () { if (foco) agendar(); });
  vv.addEventListener('scroll', function () { if (foco) { clearTimeout(tRola); tRola = setTimeout(ajustar, 80); } });
})();

// Painel CVH · colar uma foto copiada (print, WhatsApp, Fotos) em qualquer campo de foto das telas e módulos.
// Ao tocar num botão de foto, abre uma folha com "Colar a foto copiada" e "Tirar ou escolher foto";
// a foto colada entra no mesmo campo, como se tivesse sido escolhida, sem nenhuma alteração.
(function () {
  if (window.__cvhColar) return; window.__cvhColar = 1;
  var podeLer = !!(navigator.clipboard && navigator.clipboard.read) && typeof DataTransfer === 'function';
  var deFoto = function (el) { return el && el.tagName === 'INPUT' && el.type === 'file' && /image/i.test(el.accept || '') && !el.hasAttribute('capture'); };
  var css = '.cvh-colar{position:fixed;inset:0;background:rgba(43,35,32,.5);z-index:2147483000;display:flex;align-items:flex-end;justify-content:center;font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}' +
    '.cvh-colar .cx{background:#FBF8F4;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.2)}' +
    '@media (min-width:700px){.cvh-colar{align-items:center}.cvh-colar .cx{border-radius:18px}}' +
    '.cvh-colar h3{margin:0 0 10px;color:#5F130F;font-size:17px}.cvh-colar button{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin:0 0 8px;font:inherit;font-weight:700;cursor:pointer}' +
    '.cvh-colar .p{background:#5F130F;color:#fff}.cvh-colar .s{background:#fff;color:#5F130F;border:1px solid #E2D6C8}.cvh-colar .c{background:none;color:#6b5a52;font-weight:400}' +
    '.cvh-colar .st{font-size:13.5px;color:#A83D3D;min-height:18px;margin:2px 0 6px}';
  var folha = null;
  function fechar() { if (folha) { folha.remove(); folha = null; document.removeEventListener('paste', aoColar, true); } }
  function entregar(inp, arqs) {
    var dt = new DataTransfer(); arqs.forEach(function (f) { dt.items.add(f); });
    inp.files = dt.files; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
  }
  var alvo = null;
  function nomeArq(tipo) { var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); }; return 'Foto colada ' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + 'h' + p(d.getMinutes()) + '.' + (/png/.test(tipo) ? 'png' : /webp/.test(tipo) ? 'webp' : 'jpg'); }
  // Ctrl/Cmd+V com a folha aberta (computador)
  function aoColar(ev) {
    if (!alvo) return; var it = ev.clipboardData && ev.clipboardData.items ? [].slice.call(ev.clipboardData.items) : [], img = it.filter(function (i) { return i.kind === 'file' && /^image\//.test(i.type); })[0];
    if (!img) return; ev.preventDefault(); var b = img.getAsFile(), inp = alvo; fechar(); entregar(inp, [new File([b], nomeArq(b.type), { type: b.type })]);
  }
  async function colar(inp, st) {
    try {
      var itens = await navigator.clipboard.read();
      for (var i = 0; i < itens.length; i++) { var t = itens[i].types.filter(function (x) { return /^image\//.test(x); })[0]; if (t) { var b = await itens[i].getType(t); fechar(); entregar(inp, [new File([b], nomeArq(t), { type: t })]); return; } }
      st.textContent = 'Não há foto copiada. Copie a foto (no WhatsApp, em Fotos ou num print) e toque em Colar de novo.';
    } catch (e) { st.textContent = 'Não consegui colar. Permita colar quando o celular perguntar, ou use Tirar ou escolher foto.'; }
  }
  function abrir(inp) {
    alvo = inp; fechar();
    if (!document.getElementById('cvh-colar-css')) { var s = document.createElement('style'); s.id = 'cvh-colar-css'; s.textContent = css; document.head.appendChild(s); }
    folha = document.createElement('div'); folha.className = 'cvh-colar';
    var pdf = /pdf/i.test(inp.accept || '');
    folha.innerHTML = '<div class="cx" role="dialog" aria-modal="true"><h3>Adicionar foto</h3><p class="st"></p>' +
      (podeLer ? '<button class="p" data-c="colar">Colar a foto copiada</button>' : '') +
      '<button class="s" data-c="escolher">' + (pdf ? 'Tirar foto ou escolher arquivo' : 'Tirar ou escolher foto') + '</button><button class="c" data-c="cancelar">Cancelar</button></div>';
    document.body.appendChild(folha); document.addEventListener('paste', aoColar, true);
    var st = folha.querySelector('.st');
    folha.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-c]'); if (!b) { if (ev.target === folha) fechar(); return; }
      var c = b.dataset.c;
      if (c === 'cancelar') return fechar();
      if (c === 'colar') return colar(inp, st);
      if (c === 'escolher') { fechar(); inp.__cvhDireto = 1; inp.click(); }
    });
  }
  // toque no campo de foto (pelo botão, pelo rótulo ou por .click() no código): a folha abre antes do seletor do celular
  document.addEventListener('click', function (ev) {
    var inp = ev.target; if (!deFoto(inp)) return;
    if (inp.__cvhDireto) { inp.__cvhDireto = 0; return; }
    ev.preventDefault(); ev.stopPropagation(); abrir(inp);
  }, true);
})();

</script>

<script>
// requisição gerada pelo CVH: o médico veterinário confere os dados e assina com o dedo (10.13 a 10.15)
const $ = (q) => document.querySelector(q), esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hora = (iso) => { if (!iso) return ""; const d = new Date(iso), p = (n) => String(n).padStart(2, "0"); return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + " às " + p(d.getHours()) + ":" + p(d.getMinutes()); };
const TESTES = { tipagem: "Tipagem sanguínea", prova: "Prova de compatibilidade", coombs: "Teste de Coombs (antiglobulina direto)" };
const T = new URLSearchParams(location.search).get("r") || "";
const srv = (fn, ...a) => window.CVH_SERVIDOR.chamar(fn, a);
let tracos = 0;
async function abrir() {
  let r; try { r = await srv("reqDados", T); } catch (e) { $("#app").innerHTML = '<h1>Requisição CVH</h1><div class="cx"><p class="erro">' + esc(e.message || e) + "</p></div>"; return; }
  const p = r.pedido || {}, P = p.paciente || {}, V = p.vet || {};
  const pedido = (p.bolsas || []).map((b) => b.qtd + " " + b.componente).concat((p.testes || []).map((t) => TESTES[t] || t)).join(" · ");
  let h = "<h1>Requisição de " + (r.modelo === "comum" ? "bolsa" : "emergência") + "<small>CVH - Centro Veterinário de Hemoterapia · atendimento " + esc(r.id) + " · " + esc(r.destino) + "</small></h1>";
  h += '<div class="cx"><h2>Dados da requisição</h2><pre>' + esc(r.texto || [pedido && "Pedido: " + pedido, "Paciente: " + [r.paciente, P.peso ? P.peso + " kg" : "", P.ht ? "Ht " + P.ht + "%" : ""].filter(Boolean).join(" · "), "Solicitante: " + r.solicitante].filter(Boolean).join("\n")) + "</pre></div>";
  if (r.assinada) { h += '<div class="cx"><p class="ok">Requisição assinada por ' + esc(r.nome) + " (" + esc(r.crmv) + ") em " + esc(hora(r.assinadoEm)) + ".</p><p><small>Obrigado. O documento fica guardado no atendimento do CVH.</small></p></div>"; $("#app").innerHTML = h; return; }
  h += '<div class="cx"><h2>Assinatura do médico veterinário</h2><p><small>Confira os dados acima. Ao assinar, você confirma a solicitação ao CVH.</small></p><label>Nome</label><input id="rNome" value="' + esc(V.nome || "") + '"><label>CRMV/UF</label><input id="rCrmv" value="' + esc(V.crmv || "") + '" placeholder="CRMV-DF 0000"><label>Assine com o dedo</label><canvas id="rAss" width="700" height="220"></canvas><button class="btn sec" id="rLimpar" type="button">Limpar</button><button class="btn" id="rOk" type="button">Assinar a requisição</button><p id="rSt"></p></div>';
  $("#app").innerHTML = h;
  const cv = $("#rAss"), cx = cv.getContext("2d"); cx.lineWidth = 3; cx.lineCap = "round"; cx.strokeStyle = "#2b2320"; let des = false;
  const pos = (e) => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * cv.width / b.width, (e.clientY - b.top) * cv.height / b.height]; };
  cv.onpointerdown = (e) => { des = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); cx.beginPath(); cx.moveTo(x, y); };
  cv.onpointermove = (e) => { if (!des) return; const [x, y] = pos(e); cx.lineTo(x, y); cx.stroke(); tracos++; };
  cv.onpointerup = cv.onpointercancel = () => { des = false; };
  $("#rLimpar").onclick = () => { cx.clearRect(0, 0, cv.width, cv.height); tracos = 0; };
  $("#rOk").onclick = async () => {
    const st = $("#rSt"); if (tracos < 8) { st.className = "erro"; st.textContent = "Assine no quadro."; return; }
    $("#rOk").disabled = true; st.className = ""; st.textContent = "Enviando…";
    try { await srv("reqAssinar", T, { nome: $("#rNome").value.trim(), crmv: $("#rCrmv").value.trim(), assinatura: cv.toDataURL("image/png").split(",")[1] }); abrir(); }
    catch (e) { $("#rOk").disabled = false; st.className = "erro"; st.textContent = e.message || String(e); }
  };
}
abrir();
</script></body></html>
