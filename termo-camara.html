<script>
// Painel CVH · ligação das telas com o servidor novo (substitui o google.script.run)
(function () {
  var API = 'https://nrgloiiqppamxmmvcoyl.supabase.co/functions/v1/api', q = new URLSearchParams(location.search);
  // mesmos endereços do Apps Script: ?painel=1, ?r=TOKEN (carteira), ?t=TOKEN (termo), ?v=CODIGO (verificação)
  if (q.get('t') && !/termo\.html$/.test(location.pathname)) { location.replace('termo.html' + location.search); return; }
  // links antigos do painel (?painel=1) abrem a página própria do painel, com ícone e nome do Painel CVH ao instalar
  if (q.get('painel') && !window.CVH_PAINEL) { location.replace('painel.html'); return; }
  // a carteira instalada no celular lembra o último animal aberto (como o site atual da carteira)
  var r = q.get('r') || '';
  if (!window.CVH_PAINEL && !q.get('painel') && !(q.get('v') && String(q.get('v')).replace(/\s/g, '').length >= 8)) { try { if (r) localStorage.setItem('cvh_r', r); else r = localStorage.getItem('cvh_r') || ''; } catch (e) {} }
  window.BOOT = { modo: (window.CVH_PAINEL || q.get('painel')) ? 'painel' : (r ? 'responsavel' : 'nenhum'), token: r };
  var DRIVE = /https:\/\/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([A-Za-z0-9_-]{10,})(?:\/view|\/preview)?(?:\?[^"'\s<]*)?/g;
  function sessao() { try { return localStorage.getItem('cvh_s') || sessionStorage.getItem('cvh_s') || ''; } catch (e) { return ''; } }
  // links de arquivos (antes no Google Drive) passam a abrir pelo servidor novo
  // link de arquivo leva só a chave de arquivos (12 h), nunca a sessão do painel; sem a chave, cai na sessão (versões antigas)
  function chaveArq() { try { return localStorage.getItem('cvh_fs') || ''; } catch (e) { return ''; } }
  // fora do painel, o PDF leva a chave de PDFs da carteira (ou o código do termo): sem um link que ainda vale, o exame não abre
  var CHAVE_R = '';
  function linkResp() { try { var tt = new URLSearchParams(location.search).get('t') || ''; return (CHAVE_R ? '&fr=' + encodeURIComponent(CHAVE_R) : '') + (tt ? '&t=' + encodeURIComponent(tt) : ''); } catch (e) { return ''; } }
  function arquivo(id) { if (!window.CVH_PAINEL) return API + '?arquivo=' + encodeURIComponent(id) + linkResp(); var f = chaveArq(), s = f ? '' : sessao(); return API + '?arquivo=' + encodeURIComponent(id) + (f ? '&fs=' + encodeURIComponent(f) : s ? '&s=' + encodeURIComponent(s) : ''); }
  // links de arquivo do servidor chegam sem chave: cada tela põe a dela (painel: chave de arquivos; carteira: chave de PDFs)
  var ARQ = new RegExp(API.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&') + '\\?arquivo=([A-Za-z0-9_-]+)(?:&(?:s|fs|fr|t)=[^"&\\s#<]*)*', 'g');
  function reescrever(x) {
    if (typeof x === 'string') { if (x.indexOf('drive.google.com') >= 0) x = x.replace(DRIVE, function (_, id) { return arquivo(id); }); return x.indexOf('?arquivo=') >= 0 ? x.replace(ARQ, function (_, id) { return arquivo(id); }) : x; }
    if (Array.isArray(x)) return x.map(reescrever);
    if (x && typeof x === 'object') { var o = {}; for (var k in x) o[k] = reescrever(x[k]); return o; }
    return x;
  }
  function chamar(fn, args) {
    args = JSON.parse(JSON.stringify(args || []));
    if (fn === 'moduloHtml') {
      // o servidor confere a permissão; o módulo vem do próprio site
      return chamar('moduloArquivo', args).then(function (nome) {
        return fetch('modulos/' + nome + '.html', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('Não consegui abrir o módulo.'); return r.text(); });
      });
    }
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json().catch(function () { throw new Error('O servidor não respondeu (' + r.status + '). Tente de novo.'); }); },
        function () { throw new Error('Sem conexão com o servidor. Confira a internet e tente de novo.'); })
      .then(function (r) { if (!r.ok) throw new Error(r.erro || 'Erro no servidor.'); if (fn === 'carteiraPublica' && r.r && r.r.chaveArquivos) CHAVE_R = r.r.chaveArquivos; return reescrever(r.r); });
  }
  window.CVH_SERVIDOR = { api: API, chamar: chamar, arquivo: arquivo };
  // versão nova publicada: aparece um aviso para recarregar (o app aberto não troca sozinho de versão)
  var VERSAO = '20261124175617';
  function conferirVersao() {
    if (document.hidden) return;
    fetch('versao.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (v) {
      v = String(v || '').trim(); if (!v || v === VERSAO || document.getElementById('cvhVersao')) return;
      var d = document.createElement('button'); d.id = 'cvhVersao'; d.type = 'button'; d.textContent = 'Há uma versão nova do app. Toque para atualizar.';
      d.style.cssText = 'position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;background:#5F130F;color:#fff;border:0;border-radius:14px;padding:13px 18px;font:600 15px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw';
      d.onclick = function () { location.reload(); }; document.body.appendChild(d);
    }).catch(function () {});
  }
  setInterval(conferirVersao, 180000);
  document.addEventListener('visibilitychange', conferirVersao);
  // ao abrir o app, o número vermelho do ícone some (os avisos foram vistos)
  function limparIcone() { if (document.hidden) return; try { if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (e) {} try { navigator.serviceWorker && navigator.serviceWorker.getRegistration().then(function (r) { if (r && r.getNotifications) r.getNotifications().then(function (L) { L.forEach(function (n) { n.close(); }); }); }); } catch (e) {} }
  document.addEventListener('visibilitychange', limparIcone); window.addEventListener('focus', limparIcone); setTimeout(limparIcone, 1500);
  // notificações: o service worker só existe no painel
  if (window.CVH_PAINEL && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
  // ?v= é a verificação de receita e laudo (código de 12 caracteres); nos links do painel e do motoboy, ?v=2 é só a versão da prévia do WhatsApp
  if (q.get('v') && !window.CVH_PAINEL && String(q.get('v')).replace(/\s/g, '').length >= 8) {
    chamar('verificacaoHtml', [q.get('v')]).then(function (h) { document.open(); document.write(h); document.close(); },
      function (e) { document.body.textContent = e.message; });
  }
})();

</script>
<script>
// Painel CVH · campo de digitação sempre visível acima do teclado do celular (vale para todas as telas e módulos).
// O iPhone não rola a tela quando o campo está no fim da página ou dentro de um módulo: aqui o sistema abre espaço
// embaixo e sobe o campo para o meio da parte visível, e repete enquanto o teclado abre ou muda de tamanho.
(function () {
  if (window.__cvhTeclado) return; window.__cvhTeclado = 1;
  var topo = window; try { if (window.top && window.top.document) topo = window.top; } catch (e) { topo = window; }
  var vv = topo.visualViewport; if (!vv) return;
  var ESPACO = 'cvh-kb-espaco', foco = null, tSai = null, tRola = null;
  function campo(el) { return el && (/^(TEXTAREA|SELECT)$/.test(el.tagName) || (el.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|reset|file|range|color|hidden)$/i.test(el.type || ''))) || (el && el.isContentEditable); }
  function rolador(el) {
    for (var p = el.parentElement; p && p !== document.body && p !== document.documentElement; p = p.parentElement) {
      // painéis que rolam de verdade (tela, folha, gaveta); tabelas com rolagem lateral ficam de fora
      var s = getComputedStyle(p); if (/(auto|scroll)/.test(s.overflowY) && p.clientHeight >= window.innerHeight * 0.4) return p;
    }
    return document.scrollingElement || document.documentElement;
  }
  // altura que o teclado ocupa na tela do aparelho
  function alturaTeclado() { return Math.max(0, topo.innerHeight - vv.height - vv.offsetTop); }
  // posição do topo deste documento dentro da tela (módulos rodam numa moldura dentro do painel)
  function deslocamento() { var y = 0, w = window; try { while (w !== topo && w.frameElement) { y += w.frameElement.getBoundingClientRect().top; w = w.parent; } } catch (e) {} return y; }
  function abrirEspaco(r, h) {
    var esp = r.querySelector(':scope > .' + ESPACO);
    if (!esp) { esp = document.createElement('div'); esp.className = ESPACO; esp.setAttribute('aria-hidden', 'true'); esp.style.cssText = 'display:block;width:1px;pointer-events:none;flex:none'; (r === document.scrollingElement || r === document.documentElement ? document.body : r).appendChild(esp); }
    esp.style.height = Math.round(h) + 'px';
  }
  function fecharEspaco() { var L = document.querySelectorAll('.' + ESPACO); for (var i = 0; i < L.length; i++) L[i].remove(); }
  function ajustar() {
    if (!foco || !document.contains(foco)) return;
    var kb = alturaTeclado(); if (kb < 80) return; // sem teclado aberto (computador ou teclado externo)
    var r = rolador(foco); abrirEspaco(r, kb + 40);
    var b = foco.getBoundingClientRect(), off = deslocamento();
    var visTopo = vv.offsetTop + 8, visFim = vv.offsetTop + vv.height - 12;
    var cTopo = off + b.top, cFim = off + Math.min(b.bottom, b.top + 140);
    // campo escondido pelo teclado ou acima da área visível: leva o campo para perto do meio da parte visível
    if (cFim > visFim || cTopo < visTopo) {
      var alvo = visTopo + (visFim - visTopo) * 0.38, delta = cTopo - alvo;
      if (r === document.scrollingElement || r === document.documentElement) window.scrollBy(0, delta); else r.scrollTop += delta;
    }
  }
  function agendar() { clearTimeout(tRola); ajustar(); tRola = setTimeout(ajustar, 120); setTimeout(ajustar, 320); setTimeout(ajustar, 650); }
  document.addEventListener('focusin', function (e) { if (!campo(e.target)) return; clearTimeout(tSai); foco = e.target; agendar(); }, true);
  document.addEventListener('focusout', function () { tSai = setTimeout(function () { if (!campo(document.activeElement)) { foco = null; fecharEspaco(); } }, 250); }, true);
  // ao digitar (texto que quebra linha, sugestões que aparecem) o campo continua visível
  document.addEventListener('input', function (e) { if (foco && e.target === foco) { clearTimeout(tRola); tRola = setTimeout(ajustar, 60); } }, true);
  vv.addEventListener('resize', function () { if (foco) agendar(); });
  vv.addEventListener('scroll', function () { if (foco) { clearTimeout(tRola); tRola = setTimeout(ajustar, 80); } });
})();

</script>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Termo da câmara · CVH"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#F5EFE7"><link rel="apple-touch-icon" href="painel-180.png"><link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="painel-escuro-192.png?v=2"><link rel="icon" type="image/png" href="painel-192.png?v=2"><link rel="manifest" href="painel.webmanifest">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Termo da câmara · CVH</title>
<style>
:root{--vinho:#5F130F;--verm:#A83D3D;--areia:#EEE5DB;--areia2:#E2D6C8;--papel:#FBF8F4;--tinta:#2b2320;--tinta2:#6b5a52;--ok:#2F6B45}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:20px 14px 60px}
h1{margin:0;font-size:21px;color:var(--vinho)}.sub{color:var(--tinta2);font-size:13.5px;margin:2px 0 12px}
.cx{background:#fff;border:1px solid var(--areia2);border-radius:16px;padding:14px;margin:12px 0}
.cx h2{margin:0 0 8px;font-size:16px;color:var(--vinho)}
.termo{white-space:pre-wrap;font-size:14.5px}
label{display:block;font-size:13.5px;font-weight:700;color:var(--tinta2);margin:10px 0 4px}
input{width:100%;border:1px solid var(--areia2);border-radius:12px;padding:12px;font:inherit;background:#fff}
.btn{border:0;border-radius:14px;padding:14px 16px;background:var(--vinho);color:#fff;font:inherit;font-weight:700;width:100%;margin-top:12px}
.btn.sec{background:#fff;color:var(--vinho);border:1px solid var(--areia2);width:auto;padding:8px 12px;font-size:14px;margin-top:6px}
.ok{color:var(--ok);font-weight:700}.erro{color:var(--verm);font-weight:700}
canvas{width:100%;height:160px;border:1px dashed #C6B098;border-radius:12px;touch-action:none;background:#fff;display:block}
.esc{display:flex;gap:8px}.esc button{flex:1;border:1px solid var(--areia2);background:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:700;color:var(--vinho)}.esc button.on{background:var(--vinho);color:#fff;border-color:var(--vinho)}
small{color:var(--tinta2)}
</style></head><body>
<div class="wrap" id="app"><p>Abrindo o termo…</p></div>
<script>
// termo de responsabilidade e ciência do aluguel da câmara portátil: o médico veterinário e o responsável assinam no mesmo link
const $ = (q) => document.querySelector(q), esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const p2 = (n) => String(n).padStart(2, "0");
const hora = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + "/" + d.getFullYear() + " às " + p2(d.getHours()) + ":" + p2(d.getMinutes()); };
const T = new URLSearchParams(location.search).get("tc") || "";
const srv = (fn, ...a) => window.CVH_SERVIDOR.chamar(fn, a);
let quem = "", tracos = 0;
async function abrir() {
  let r; try { r = await srv("camTermoDados", T); } catch (e) { $("#app").innerHTML = '<h1>Termo CVH</h1><div class="cx"><p class="erro">' + esc(e.message || e) + "</p></div>"; return; }
  const A = r.assinaturas || {}, linha = (x, rot) => x ? '<p class="ok">' + rot + ": assinado por " + esc(x.nome) + " em " + esc(hora(x.em)) + "</p>" : "<p><small>" + rot + ": aguardando assinatura</small></p>";
  const falta = [!A.vet && "vet", !A.responsavel && "responsavel"].filter(Boolean); if (!falta.includes(quem)) quem = falta[0] || "";
  let h = '<h1>Termo da câmara portátil</h1><div class="sub">CVH - Centro Veterinário de Hemoterapia · reserva ' + esc(r.id) + " · " + esc(r.camara) + "</div>";
  if (r.situacao === "cancelada") h += '<div class="cx"><p class="erro">Esta reserva foi cancelada.</p></div>';
  h += '<div class="cx"><div class="termo">' + esc(r.termo) + "</div></div>";
  h += '<div class="cx"><h2>Assinaturas</h2>' + linha(A.vet, "Médico veterinário") + linha(A.responsavel, "Responsável") + "</div>";
  if (falta.length && r.situacao !== "cancelada") {
    h += '<div class="cx"><h2>Assinar agora</h2>' + (falta.length > 1 ? '<div class="esc"><button data-q="vet" class="' + (quem === "vet" ? "on" : "") + '">Sou o médico veterinário</button><button data-q="responsavel" class="' + (quem === "responsavel" ? "on" : "") + '">Sou o responsável</button></div>' : "<p><small>Falta a assinatura do " + (quem === "vet" ? "médico veterinário" : "responsável") + ".</small></p>") +
      '<label>Nome completo</label><input id="aNome" value="' + esc(quem === "vet" ? r.vet.nome || "" : r.responsavel || "") + '"><label>' + (quem === "vet" ? "CRMV" : "CPF") + '</label><input id="aDoc" ' + (quem === "vet" ? 'value="' + esc(r.vet.crmv || "") + '"' : 'inputmode="numeric"') + '>' +
      '<label>Assinatura com o dedo</label><canvas id="aCv" width="900" height="300"></canvas><button class="btn sec" id="aLimpar">Limpar</button>' +
      '<button class="btn" id="aOk">Li e concordo · assinar</button><p id="aSt"></p></div>';
  } else if (!falta.length) h += '<div class="cx"><p class="ok">Termo assinado pelo médico veterinário e pelo responsável. Obrigado.</p></div>';
  $("#app").innerHTML = h;
  document.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => { quem = b.dataset.q; abrir(); });
  const cv = $("#aCv"); if (!cv) return; tracos = 0;
  const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.lineWidth = 4; cx.lineCap = "round"; cx.lineJoin = "round"; cx.strokeStyle = "#2b2320"; let des = false;
  const pos = (e) => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * cv.width / b.width, (e.clientY - b.top) * cv.height / b.height]; };
  cv.onpointerdown = (e) => { des = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); cx.beginPath(); cx.moveTo(x, y); };
  cv.onpointermove = (e) => { if (!des) return; const [x, y] = pos(e); cx.lineTo(x, y); cx.stroke(); tracos++; };
  cv.onpointerup = cv.onpointercancel = () => { des = false; };
  $("#aLimpar").onclick = () => { cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); tracos = 0; };
  $("#aOk").onclick = async () => {
    const st = $("#aSt"); if (tracos < 8) { st.className = "erro"; st.textContent = "Assine no quadro."; return; }
    $("#aOk").disabled = true; st.className = ""; st.textContent = "Enviando…";
    try { await srv("camTermoAssinar", T, quem, { nome: $("#aNome").value.trim(), doc: $("#aDoc").value.trim(), assinatura: cv.toDataURL("image/png").split(",")[1] }); quem = ""; abrir(); window.scrollTo(0, 0); }
    catch (e) { $("#aOk").disabled = false; st.className = "erro"; st.textContent = e.message || String(e); }
  };
}
abrir();
</script></body></html>
