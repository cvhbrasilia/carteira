(function () {
  var API = 'https://nrgloiiqppamxmmvcoyl.supabase.co/functions/v1/api', q = new URLSearchParams(location.search);
  // mesmos endereços do Apps Script: ?painel=1, ?r=TOKEN (carteira), ?t=TOKEN (termo), ?v=CODIGO (verificação)

  // links de arquivos (antes no Google Drive) passam a abrir pelo servidor novo
  // link de arquivo leva só a chave de arquivos (12 h), nunca a sessão do painel; sem a chave, cai na sessão (versões antigas)
  function chaveArq() { try { return localStorage.getItem('cvh_fs') || ''; } catch (e) { return ''; } }
  // fora do painel, o PDF leva a chave de PDFs da carteira (ou o código do termo): sem um link que ainda vale, o exame não abre
  var CHAVE_R = '';
  function linkResp() { try { var tt = new URLSearchParams(location.search).get('t') || ''; return (CHAVE_R ? '&fr=' + encodeURIComponent(CHAVE_R) : '') + (tt ? '&t=' + encodeURIComponent(tt) : ''); } catch (e) { return ''; } }

  // links de arquivo do servidor chegam sem chave: cada tela põe a dela (painel: chave de arquivos; carteira: chave de PDFs)
  var ARQ = new RegExp(API.replace(/[.*+?^${}()|[\]\\\/]/g, '\\<head>') + '\\?arquivo=([A-Za-z0-9_-]+)(?:&(?:s|fs|fr|t)=[^"&\\s#<]*)*', 'g');

    return x;

  function chamar(fn, args) {
    args = JSON.parse(JSON.stringify(args || []));
    if (fn === 'moduloHtml') {

      return chamar('moduloArquivo', args).then(function (nome) {

  window.CVH_SERVIDOR = { api: API, chamar: chamar, arquivo: arquivo };
  // versão nova publicada: aparece um aviso pequeno, lá em cima, para recarregar (o app aberto não troca sozinho de versão)
  var VERSAO = '20261127182820';
  // o app instalado no iPhone às vezes recarrega a página guardada: abre o endereço com a versão nova no fim, que obriga a buscar de novo

  if (q.get('v') && !window.CVH_PAINEL && String(q.get('v')).replace(/\s/g, '').length >= 8) {

  }

.fillin.nw{white-space:nowrap}
.fillin{font-weight:700;color:#3B1411;border-bottom:1.5px solid #C49A6C;padding:0 .1em}
.fillin.empty{color:#B7A396;font-weight:400;font-style:italic}
ol.rail{list-style:none;margin:0;padding:0 0 0 2.35em;position:relative}
ol.rail::before{content:"";position:absolute;left:.82em;top:.55em;bottom:.9em;width:2px;background:#A83D3D;border-radius:2px}
ol.rail>li{counter-increment:c;position:relative;margin:0 0 1.05em}
ol.rail>li.callout{break-inside:avoid;page-break-inside:avoid}
ol.rail{counter-reset:c}
ol.rail>li::before{content:counter(c);position:absolute;font-size:.74em;left:-2.72em;top:.12em;width:1.95em;height:1.95em;border-radius:50%;background:#FFFDFA;border:2px solid #A83D3D;color:#A83D3D;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
ol.rail>li.callout{background:#F5ECE2;border-radius:8px;padding:.7em .9em;color:#5F130F;font-weight:600}
ol.rail>li.callout::before{top:.85em;background:#A83D3D;color:#fff}
.animals{display:grid;grid-template-columns:repeat(auto-fill,minmax(14em,1fr));gap:.7em;margin:0 0 1.4em}
.animal{border:1px solid #E7D9C9;border-top:3px solid #A83D3D;border-radius:6px;padding:.65em .8em;background:#FFFFFF;break-inside:avoid}
.animal .an{font-weight:700;color:#5F130F;font-size:1.04em}
.animal .ad{font-size:.86em;color:#6B5550;line-height:1.45}
.species{display:grid;grid-template-columns:1fr 1fr;gap:.8em;margin:.7em 0 .3em}
.species.one{grid-template-columns:1fr}
.doc.mob .species{grid-template-columns:1fr}
.sp{background:#F7F1EA;border-radius:8px;padding:.75em .9em;break-inside:avoid}
.sp h3{margin:0 0 .4em}
.sp ul{margin:0;padding-left:1.1em}
.sp li{margin:0 0 .35em;font-size:.95em}
.sp li::marker{color:#C49A6C}
.vac{margin:.5em 0 0;padding-left:1.1em}
.vac li{margin-bottom:.3em}
.vac li::marker{color:#C49A6C}
.obs{font-size:.9em;color:#4A3733}
.obs p{margin:0 0 .6em}
.imgopts{margin:.4em 0 0;padding:0;list-style:none}
.imgopts li{display:flex;gap:.6em;align-items:flex-start;margin:0 0 .55em;color:#6B5550}
.imgopts li .bx{flex:none;width:1.05em;height:1.05em;border:1.6px solid #A83D3D;border-radius:3px;margin-top:.25em;display:flex;align-items:center;justify-content:center}
.imgopts li.sel{color:#2E1C1A;font-weight:600}
.imgopts li.sel .bx{background:#A83D3D}
.imgopts li.sel .bx::after{content:"";width:.28em;height:.55em;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pending{font-size:.86em;color:#9A5B12;font-style:italic;margin:.2em 0 .8em}
.foot{font-size:.82em;color:#6B5550}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:1.4em;margin-top:1.4em}
.doc.mob .sigs{grid-template-columns:1fr}
.sig{break-inside:avoid}
.sig .area{height:5.2em;display:flex;align-items:flex-end;justify-content:center;border-bottom:1.5px solid #5F130F;padding-bottom:.15em}
.sig .area svg{height:100%;width:auto;max-width:100%}
.sig .area .wait{font-size:.8em;color:#B7A396;font-style:italic;align-self:center}
.sig .who{margin-top:.45em;font-weight:700;color:#3B1411;font-size:.95em}
.sig .role{font-size:.8em;color:#6B5550;line-height:1.4}
.final{break-inside:avoid;page-break-inside:avoid}
.audit{margin-top:2em;background:#F7F1EA;border-radius:8px;padding:.9em 1em;font-size:.76em;color:#4A3733;line-height:1.5;break-inside:avoid}
.audit h3{margin:0 0 .5em;color:#5F130F;font-size:1.05em}
.audit dl{display:grid;grid-template-columns:max-content 1fr;gap:.25em 1em;margin:0}
.audit dt{color:#7A6560}
.audit dd{margin:0;word-break:break-word}
.audit .hash{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;word-break:break-all}
.doc.mob .audit dl{grid-template-columns:1fr}
.doc.mob .audit dt{margin-top:.35em}


.err{color:var(--accent);font-size:14px;margin:0 0 10px}
.err:empty{display:none}
.brandmark img{height:28px;width:auto;display:block}
.lgD{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lgL{display:none!important}:root:not([data-theme="light"]) .lgD{display:block!important}}
:root[data-theme="dark"] .lgL{display:none!important}:root[data-theme="dark"] .lgD{display:block!important}
.dhead .logo{height:auto;width:210px;max-width:60%}
.doc.mob .dhead .logo{width:170px}
.doc p,.doc ol.rail>li,.doc .sp li,.doc .vac li,.doc .imgopts li>span:last-child,.greet p,.signcard .opt span{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.dsig{display:flex;gap:.7em;align-items:flex-start;margin-top:.8em;font-size:.74em;line-height:1.45;color:#4A3733;text-align:left}
.dsig img{width:3.9em;height:3.9em;flex:none}
.dsig b{color:#5F130F}
.dsig .code{color:#A83D3D;margin-top:.15em}
.done-hero .seal{background:none;width:84px;height:84px}
.done-hero .seal img{width:84px;height:84px}
a.btn{text-decoration:none}
.prev{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--text);font-size:13.5px;padding:8px 18px;text-align:center}
.center{min-height:60vh;display:grid;place-items:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.receive.wide{max-width:900px}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.list-head h1{margin:0;font-size:24px;color:var(--accent-strong)}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;justify-content:space-between;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.trow:hover{border-color:var(--focus)}
.tmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.tmain b{color:var(--accent-strong);font-size:16px}
.tmain span{color:var(--muted);font-size:14px}
.tmain .tid{font-size:12.5px}
.tside{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.tdate{font-size:12.5px;color:var(--muted)}
.chip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st-draft{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.st-wait{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.st-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.empty{text-align:center;padding:34px 20px}
.sep{height:1px;background:var(--line);margin:18px 0}
.panel textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);font-size:15px;resize:vertical}
.panel .check{margin:4px 0}
.out textarea{font-size:14px}
@media (max-width:560px){.trow{flex-direction:column;align-items:flex-start}.tside{align-items:flex-start}}

.modal-back{position:fixed;inset:0;background:rgba(20,8,8,.55);display:grid;place-items:center;z-index:60;padding:18px}
.modal{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
.modal h2{margin:0 0 8px;font-size:19px;color:var(--accent-strong)}
.modal .hint{margin:0 0 12px}
.btn-danger{background:#A83D3D;color:#fff}
.btn-danger:disabled{opacity:.4;cursor:not-allowed}
#delSigned,#delRec{color:var(--accent)}
.ac-pai{position:relative}
.ac-lista{position:absolute;left:0;right:0;top:100%;z-index:40;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1px solid #e4dad0;border-radius:10px;box-shadow:0 10px 28px rgba(60,20,15,.18);max-height:264px;overflow:auto;display:none}
.ac-lista.on{display:block}
.ac-lista li{padding:.62em .75em;border-radius:7px;cursor:pointer;font-size:15px}
.ac-lista li:hover,.ac-lista li[aria-selected=true]{background:#f4ece5}

  toSig(){if(this.empty())return null;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const s of this.strokes)for(const[x,y]of s){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
    const p=8,X=v=>v-x0+p,Y=v=>v-y0+p;let d='';for(const s of this.strokes){d+='M'+X(s[0][0])+' '+Y(s[0][1]);for(let i=1;i<s.length-1;i++){d+='Q'+X(s[i][0])+' '+Y(s[i][1])+' '+X(Math.round((s[i][0]+s[i+1][0])/2))+' '+Y(Math.round((s[i][1]+s[i+1][1])/2));}const l=s[s.length-1];d+='L'+X(l[0])+' '+Y(l[1]);}
    return{w:x1-x0+p*2,h:y1-y0+p*2,d};}
}
function pathToStrokes(sig){const out=[];const re=/([MQL])([^MQL]*)/g;let m,cur=null;while((m=re.exec(sig.d))){const n=m[2].trim().split(/\s+/).map(Number);if(m[1]==='M'){cur=[[n[0],n[1]]];out.push(cur);}else cur.push([n[0],n[1]]);}return out.map(s=>s.map(([x,y])=>[x+60,y+40]));}

async function signResp(btn){const t=S.term,err=$('#rErr');const img=document.querySelector('input[name="img"]:checked')?.value;const m=[];

async function openList(){S.view='list';S.rec=null;S.token=null;try{S.list=await API.list(S.pin);}catch(e){if(/PIN/.test(e.message)){S.view='login';}else toast(e.message);}render();
  clearInterval(pollT);pollT=setInterval(async()=>{if(S.view!=='list')return;try{const l=await API.list(S.pin);if(JSON.stringify(l)!==JSON.stringify(S.list)){S.list=l;render();}}catch(e){}},30000);}
function rubricaStrokes(d){const out=[];const re=/([MQL])([^MQL]*)/g;let m,cur=null;while((m=re.exec(d||''))){const n=m[2].trim().split(/[\s,]+/).map(Number).filter(x=>!isNaN(x));
    if(m[1]==='M'){cur=[];out.push(cur);}if(!cur)continue;for(let i=0;i+1<n.length;i+=2)cur.push([Math.round(n[i]*3+50),Math.round(n[i+1]*3+20)]);}return out.filter(x=>x.length);}
function anosDe(n){if(!/^\d{4}-\d{2}-\d{2}$/.test(n||''))return '';const h=new Date();let a=h.getFullYear()-+n.slice(0,4);if((h.getMonth()+1)*100+h.getDate()<+n.slice(5,7)*100+ +n.slice(8,10))a--;return a>=0?String(a):'';}
function draftDoCadastro(){const d=blankDraft();if(!PAINEL||!CTX.resp)return d;const r=CTX.resp;
  Object.assign(d.resp,{nome:r.nome||'',email:r.email||'',tel:maskTel(r.tel||''),cpf:r.cpf||'',cep:r.cep||'',logradouro:r.logradouro||'',numero:r.numero||'',complemento:r.complemento||'',bairro:r.bairro||'',cidade:r.cidade||'',uf:r.uf||''});d.respId=r.id;
  const ans=(CTX.animais||[]).filter(a=>a.ativo!=='0');const doad=ans.filter(a=>a.doador==='1');const lista=(doad.length?doad:ans);
  if(lista.length)d.animais=lista.map(a=>({id:a.id,nome:a.nome||'',esp:/fel/i.test(a.especie||'')?'gato':'cao',raca:a.raca||'',idade:anosDe(a.nascimento),sexo:/^m/i.test(a.sexo||'')?'M':/^f/i.test(a.sexo||'')?'F':''}));
  return d;}
function openNew(){S.rec=null;S.token=null;S.link='';S.unsaved=false;S.cvhStrokes=null;S.draft=draftDoCadastro();S.view='edit';render();window.scrollTo(0,0);}
async function openRec(token){S.view='loading';render();try{const r=await API.getAdmin(S.pin,token);S.rec=r;S.token=r.token;S.cvhStrokes=null;
  if(r.status==='assinado'){S.mob=false;S.view='signed';}

    document.querySelectorAll('[data-r]').forEach(i=>{const h=()=>{const k=i.dataset.r;let val=i.value;if(k==='cpf')val=maskCPF(val);if(k==='tel')val=maskTel(val);if(k==='cep')val=maskCEP(val);if(i.tagName==='INPUT'&&val!==i.value)i.value=val;S.draft.resp[k]=val;changed();if(k==='cep'&&digits(val).length===8)lookupCep(val);};i.oninput=h;i.onchange=h;});
    document.querySelectorAll('[data-s]').forEach(i=>{const h=()=>{S.signer[i.dataset.s]=i.value;refreshPreview();};i.oninput=h;i.onchange=h;});
    document.querySelectorAll('[data-a]').forEach(i=>{const h=()=>{const[ix,k]=i.dataset.a.split('.');S.draft.animais[+ix][k]=i.value;changed();};i.oninput=h;i.onchange=h;});
    document.querySelectorAll('input[data-lista]').forEach(i=>autoLista(i,()=>(RACAS[i.dataset.lista]||[]).concat((((CTX||{}).racasExtra)||{})[i.dataset.lista]||[])));
    document.querySelectorAll('[data-esp]').forEach(b=>b.onclick=()=>{const[ix,val]=b.dataset.esp.split('.');S.draft.animais[+ix].esp=val;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#ar'+ix).dataset.lista=val;changed();});

    if($('#simResp'))$('#simResp').onclick=()=>{S.term=S.rec.term;S.sim=true;S.mob=true;S.opened=new Date().toISOString();S.view='resp';render();window.scrollTo(0,0);};
  }
  if(v==='resp'){
    respPad=new SigPad($('#respSig'),()=>{S.respStrokes=respPad.strokes;});if(S.respStrokes&&S.respStrokes.length){respPad.strokes=S.respStrokes;respPad.draw();}
    const rf=S.respForm||{};if(rf.img){const x=document.querySelector(`input[name="img"][value="${rf.img}"]`);if(x)x.checked=true;}if(rf.cpf)$('#cpfc').value=rf.cpf;if(rf.agree)$('#agree').checked=true;
    const saveRF=()=>{S.respForm={img:document.querySelector('input[name="img"]:checked')?.value,cpf:$('#cpfc').value,agree:$('#agree').checked};};

async function cepNavegador(c){const fontes=[['https:\/\/viacep.com.br/ws/'+c+'/json/',j=>j.erro?null:{logradouro:j.logradouro,bairro:j.bairro,cidade:j.localidade,uf:j.uf}],['https:\/\/brasilapi.com.br/api/cep/v1/'+c,j=>j.cep?{logradouro:j.street,bairro:j.neighborhood,cidade:j.city,uf:j.state}:null],['https:\/\/opencep.com/v1/'+c,j=>j.cep?{logradouro:j.logradouro,bairro:j.bairro,cidade:j.localidade,uf:j.uf}:null]];
  for(const[u,f]of fontes){try{const r=await fetch(u);if(!r.ok)continue;const v=f(await r.json());if(v&&(v.cidade||v.logradouro))return v;}catch(e){}}return null;}
async function lookupCep(cep){const msg=$('#cepMsg');if(msg)msg.textContent='Buscando endereço';const d=digits(cep);
  let r=null;try{r=await API.cep(d);}catch(e){}
  if(!r)r=await cepNavegador(d);
  if(!r){if(msg)msg.textContent='CEP não encontrado nas bases públicas. Preencha o endereço manualmente.';return;}
  Object.assign(S.draft.resp,{logradouro:r.logradouro||S.draft.resp.logradouro,bairro:r.bairro||S.draft.resp.bairro,cidade:r.cidade||S.draft.resp.cidade,uf:r.uf||S.draft.resp.uf});
  for(const[id,k]of[['rlog','logradouro'],['rbai','bairro'],['rcid','cidade'],['ruf','uf']]){const el=$('#'+id);if(el)el.value=S.draft.resp[k];}
  if(msg)msg.textContent='Endereço encontrado. Complete o número.';$('#rnum')?.focus();refreshPreview();}


(async function init(){render();
  const t=await tokenFromURL();
  if(t){S.token=t.toUpperCase();try{const res=await API.getPublic(S.token);S.opened=new Date().toISOString();if(res.status==='assinado'){S.full=res.term;S.view='respdone';}else{S.term=res.term;S.view='resp';}}catch(e){S.err=e.message;S.view='error';}render();return;}
  if(PAINEL){
    S.pin='painel';
    if(CTX.vet){const m=/CRMV\s*-?\s*([A-Z]{2})\s*([\d.\-\/]+)/i.exec(CTX.vet.crmv||'');S.signer={nome:CTX.vet.nome,uf:m?m[1].toUpperCase():'DF',num:m?digits(m[2]):digits(CTX.vet.crmv)};}
    else if(CTX.vetPadrao){const m=/CRMV\s*-?\s*([A-Z]{2})\s*([\d.\-\/]+)/i.exec(CTX.vetPadrao.crmv||'');S.signer={nome:CTX.vetPadrao.nome,uf:m?m[1].toUpperCase():'DF',num:m?digits(m[2]):''};}
    try{S.cfg=await API.config();}catch(e){S.err=e.message||'Não foi possível conectar.';S.view='error';render();return;}
    if(CTX.resp){try{const l=await API.list(S.pin);const ab=l.find(x=>x.respId===CTX.resp.id&&x.status!=='assinado');if(ab)return openRec(ab.token);}catch(e){}return openNew();}
    return openList();
  }
  try{S.cfg=await API.config();}catch(e){S.err='Não foi possível conectar. Recarregue a página.';S.view='error';render();return;}
  if(!S.cfg.hasPin){S.view='setpin';render();return;}
  if(S.pin){try{await API.login(S.pin);return openList();}catch(e){}}
  S.view='login';render();})();

window.__dbg={S:S,integrity:integrity};

  document.addEventListener('focusin', function (e) { var x = e.target; if (x && (x.tagName === 'INPUT' || x.tagName === 'TEXTAREA') && !x.hasAttribute('autocomplete') && x.type !== 'password') x.setAttribute('autocomplete', 'off'); }, true); })();
